#     script comparing the drift d against the incumbent's own eye step on the cam-relatch row.
#     Un-gating that block is NOT instrumentation (track.moving feeds the tenure election) and was
#     deliberately not done.
#   * rgen / rgen_old read 0 and the CAMREBASE tripwire is inert. The fields cost nothing and make a
#     later on-arm run directly comparable.
#   * Every handover past the 0.8 view delta re-enters the 12-frame confirm, so S-hold gains the
#     confirm-hold population. analyze-basis.py labels each hold `confirm` (a cam-track handover or
#     reset row within one frame of its first row) or `miss` (none) so the two are never summed.
