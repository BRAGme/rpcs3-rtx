# ROUND 62 (2026-09-10) -- flat-painted decals: COL0.rgb is a literal in 9 of the 61 stored programs
# =================================================================================================
# The fragment program states the surface colour as an inline constant ('MOV R0.xyz <- c[]') and
# the texture it samples feeds only alpha (a mask). The backend elected that mask as the albedo, so
# the decal rendered as its own greyscale mask; untextured draws of the same programs took the
# neutral grey. FPCONSTALBEDO states the literal through the instance's fixed-function stage
# (SelectArg1(TFactor)); no new material, mesh keys untouched. The code default is OFF.
#   armed:   'Remix live:' fpconst=N climbing; one 'Remix fpconst:' line per program names the
#            literal and the packed factor.
#   refuted: a decal or flat surface visibly wrong-coloured -> set to 0 (bit-exact restore).
# NOT the blue [0 0.0627 1]: that literal is written to MRT3 (R4), the material-parameter target,
# shared by textured, grey and white surfaces alike; it never reaches COL0 in any stored program.
#
# ROUND 63 (2026-09-11) -- a bitmask now: 1 = the MOV literal above, 2 = the hand-rolled LERP
# endpoint, 3 = both. The "code blood" program 500c9f0b17153879 (fpraw CE3BE6B2685F446C) never
# states its colour with a MOV; it fades the texture toward (0.694, 0.808, 1.0) = (177, 206, 255)
# with 'ADD R1.xyz <- -R0, c[]' then 'MAD R0.xyz <- t, R1, R0', and the per-pixel t cannot be
# replayed, so bit 2 states the ENDPOINT as a flat colour instead of white. Weight-gated: only a
# lerp whose t is <varying> * k with k >= 0.5 is stated. 36 of the 41 terminal lerps in the ucode
# corpus are a level-wide fog fade toward (1, 1, 0.859) at k = 0.204 - the main world programs
# among them - and would repaint the world pale yellow without that gate. 2 of 793 programs pass.
#   armed:   'Remix live:' fplerp=N climbing; 'Remix fpconst:' route=lerp weight=1 rgb=[0.6941
#            0.8078 1] for fp=500c9f0b17153879.
#   refuted: the surface is wrong-coloured rather than pale blue -> set to 1 (round 62 exactly).
# NOT the other code-blood texture 921904970ADA8A23 (fp=01072a35c2acbe5c, fpraw 9F30538CBDE6C249)
# through THIS bit: that program fades toward the pale-yellow fog at k = 0.204, and its blue is a
# per-channel 'MUL R0.xyz <- R0, c[0.5 0.8 1.5]' on the texture - bit 4, below.
#
# ROUND 67 (2026-09-11) -- bit 4 = the per-channel TINT on the sampled texel, Modulated against the
# elected texture: 'TEX R0 [tex0]' then 'MUL R0.xyz <- R0, c[0.5 0.8 1.5]' is the code blood's blue.
# tFactor is 8-bit, so the 1.5 lane is CLAMPED - factor (0.5, 0.8, 1.0), linearised to FF379AFF -
# not normalised: the guest's own target is 8-bit and clamps too, and the texture is black with
# bright specks, the regime where clamp-first agrees with the guest exactly. The shape is ordinary
# shading and matches 404 of the 793 stored programs; the rule the C++ applies passes 2 (see
# docs/remix/fptint.py, which stages the count): the product must reach COL0.rgb through a
# kill-aware walk, be non-neutral, be unclaimed by bits 1 and 2, and the program must write COL0
# ONLY. The 43 refused by that last term write the deferred G-buffer (R2/R3/R4), and their
# identical instruction is the material diffuse colour of the level's walls, floors and skin -
# stating those repaints the level, so if it is ever wanted it is its own route over all 43.
#   armed:   'Remix live:' fptint=N/M with N climbing; 'Remix fpconst:' route=tint rgb=[0.5 0.8
#            1.5] tfactor=FF379AFF for fp=01072a35c2acbe5c (albedo 921904970ADA8A23).
#   refuted: the code blood is wrong-coloured rather than blue -> set to 3 (round 63 exactly).
