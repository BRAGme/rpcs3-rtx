# --- round 56: the submitted camera's mirrored right vector (2026-09-09) -------------------------
# Comments must be on their own line -- the parser does not strip inline ones, and an inline
# comment has silently made a knob read 0 here before while still counting as `applied`.
#
# try_split_once does not RECOVER the view, it CONSTRUCTS it: forward and up_hint are unprojected
# out of the fused matrix (convention-free), then right = up_hint x forward. That cross-product
# ORDER assumes a left-handed world. Eat Lead's is right-handed, so the constructed row 0 points
# screen-LEFT and the recovered P = viewToWorld x fused hides it in a negative x-scale. The product
# V x P is right; neither factor is.
#
# MEASURED with no rebuild off score_perspective's own -0.5 dock for m[0][0] < 0: the camera-trace
# rows read 8167 x score=5.500 + 672 x score=4.500 (run pid27232) and 8475 x score=5.500 (run
# pid30572) -- ZERO integer scores in 17,314 resolved frames, so P[0][0] < 0 on 100% of them.
#
# 1 inserts S = diag(-1,1,1,1) between the SUBMITTED V and P and nowhere else. V'P' = VP exactly
# (verified bit-identical in f32), so THE IMAGE MUST NOT CHANGE. What changes is that the runtime's
# free camera finally strafes and yaws the right way -- RtCamera::getRight() is viewToWorld[0].xyz()
# verbatim -- and the dev menu's MAIN block reads Overall Handedness: Right-handed instead of
# Left-handed, with Projection Handedness still Left-handed.
#
# ACCEPTANCE for this run, all from the dump: banner camxflip=1 and applied=20; on 'Remix live:'
# cam_xmirror == cam_xflip == cam_resolved and cam_dropped == 0; on every 'Remix camera trace:' row
# vdet ~ 1 and p00 < 0; and every guest-light-drift / cam-track / cam-synth / cam-relatch row keeps
# the shape it has on the control arm (the fix is downstream of all of them, so any change there
# means an edit landed outside submit_camera).
RPCS3_REMIX_CAMXFLIP=1
# --- round 57: the 0.05-0.25 band is the pre-relatch pose error (2026-09-09) -------------------
#
# THE DEFECT: static props visibly wobble with camera movement.  On 'Remix pick-follow:' rows
# that reads as a 0.05-0.25-unit band on d_origin -- 3-10x the camera's own translation step on
# the same frames -- on 19.1% of rows.
#
# MEASURED on the frozen pid-28088 slice (646 pick-follow rows, 8 clicks), BEFORE any of this
# was built:
#   * the two props that visibly swim are age=1 -- drawn BEFORE the frame's mid-frame relatch
#     and therefore divided by the PREVIOUS frame's camera -- on 298 of 298 rows, and 116 of
#     the run's 122 band rows are theirs;
#   * the three quiet objects are level chunks at the world origin, age=0 on 93% of their rows;
#   * those props print d_origin=0 EXACTLY on the frames whose cam-relatch row reads step=0,
#     which excludes precision, quantisation and genuine guest motion outright.
#
# THE ARITHMETIC: world = OS x (fused x reference_inverse), and a draw that arrives before the
# relatch is divided by the flip latch of frame N-1, so it lands at OS x M x Q_N with
# Q_N = V_N x V_{N-1}^-1 -- the camera's own frame-to-frame motion.  At 2 deg/frame of yaw and
# an eye distance of 9 that is 0.31 units of pose error: the prop DRAGS during a turn and SNAPS
# BACK when it stops.  d_origin is only the DERIVATIVE of that error, which is why the band sits
# several times the camera's translation step.
#
# WHAT PICKFRESH=1 ADDS: one 'Remix pick-fresh:' row per followed frame, re-dividing the same
# fused by the frame's OWN relatched reference.  err= is the pose error the eye actually reads;
# d_fresh= is the prop's motion with the reference error removed (must sit at the f32 floor if
# the prop really is static); recheck= re-divides by the STALE reference and must reproduce the
# submitted origin EXACTLY -- if recheck is not 0, do not read err at all.  Five fields (age,
# ord, relatched, d_rot, cpos) also appear at the END of every pick-follow row, on both arms.
#
# ACCEPTANCE, all inside ONE run, read in this order:
#   1. on the last 'Remix live:': pf_stale + pf_fresh == pf_rows, pf_first + pf_step0..4 ==
#      pf_rows, pf_norelatch + pf_place_refused + pf_err0..4 == pf_fresh_rows.  Any mismatch and
#      the instrument is wrong -- STOP, nothing else in the run can be trusted.
#   2. pf_recheck_fail == 0 and every recheck= on a pick-fresh row <= 1e-5.
#   3. R1 d_fresh median <= 1e-3 on the props' age=1 rows; R4 err == 0 exactly on every age=0
#      row (the level-section clicks are the control population).
#
# Nothing on the submit path changes.  0 restores today's output bit-exactly.
RPCS3_REMIX_PICKFRESH=1
#
# --- the FIX, staged DARK.  Do NOT un-comment it for the first run. ---------------------------
#
# DEFERPRERELATCH=1 holds each world draw that would be divided by a stale reference in the
