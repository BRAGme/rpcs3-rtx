# =================================================================================================
# Eat Lead: The Return of Matt Hazard (BLUS30267) -- per-game Remix profile
#
# Created 2026-09-06 for the white-screen investigation. Deliberately carries NO ACTIVE KNOBS at
# first: the file's presence has to be provable on its own, and it is, by
# `Remix game-config: BLUS30267 applied=0` on the run's dump segment. A baseline run with this file
# in place is therefore byte-for-byte the same behaviour as a run without it, which is the whole
# point -- the A/B that follows changes exactly one line and nothing else.
#
# PRECEDENCE: an environment variable that is ALREADY SET always wins over this file
# (RemixGameConfig.cpp, `env_is_set`). So a launcher or an A/B harness stays authoritative and a
# knob can be swept without editing or commenting anything out here.
#
# WHEN THIS IS READ: once, at backend init (RemixGSRender.cpp, before any knob is latched). Almost
# every accessor in this backend is a function-static latched on first call, so a change here needs
# a RESTART of RPCS3, not just a game reload.
#
# ONLY `RPCS3_REMIX_*` KEYS ARE ACCEPTED. Anything else is counted as `ignored` and named on the
# summary line.
# =================================================================================================

# --- 2D compositor: exact UI allowlist only ------------------------------------------------------
# The broad screen-space route is unsafe for this title: it also captures glyph-atlas construction,
# framebuffer copies, and a 256x1 gradient pass, then stretches them over the final frame. Keep the
# compositor enabled for the measured UI programs while UIFORCEONLY rejects every unlisted pass.
RPCS3_REMIX_NOUI=0

# The automatic NDC population also contains opaque framebuffer copies and construction passes.
# Composite only the exact UI pairs below; unlisted screen-space draws keep the old skip behaviour.
RPCS3_REMIX_UIFORCEONLY=1

# Route only the measured UI fragment programs through the compositor. The same VP also draws an
# opaque 1280x720 background pass (fp=0BDE04241AED1C6A), so a VP-wide force is intentionally not
# used. UIFORCEVPDW applies the existing depth-write relaxation to these exact pairs.
RPCS3_REMIX_UIFORCEPAIRVP=f2b6988e84056628
RPCS3_REMIX_UIFORCEPAIRFP=53c93dc604379134
RPCS3_REMIX_UIFORCEPAIRVP2=f2b6988e84056628,f2b6988e84056628,f2b6988e84056628,f2b6988e84056628,f2b6988e84056628,f2b6988e84056628,f2b6988e84056628
RPCS3_REMIX_UIFORCEPAIRFP2=2c05f08eb3b8c22c,6ba2c985460bbe6b,26d385e5e297a8f1,3c05f08eb3b8c22c,aed625032a4735dd,c128c6698ee7ca0d,d8225eb7a4e6d157
RPCS3_REMIX_UIFORCEVPDW=2

# --- step 6 A/B: the position-input widening -----------------------------------------------------
# Default is 1 (on) in the binary. Uncomment to restore the pre-fix behaviour, in which every
# vertex program is decoded as though ATTR0 held its position. Eat Lead's world programs feed HPOS
# from v2 (and its sprite program from v1), so with this at 0 the world reaches Remix as a
# byte-quantised 0..254 normal cloud and the white must return with `pos_input=0/0`.
#RPCS3_REMIX_POSINPUT=0

