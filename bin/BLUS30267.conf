# which is a HOLD -- the tracker had the incumbent unmatched at the flip, the latch did not move,
# and every draw's fused matrix carries the current camera while the divisor is frozen, so the world
# slides by the camera's motion and RETURNS at the next fresh frame (878edd: -3.145 -> -4.194 over
# frames 3096-3099, back to -3.128 at 3100). (E4) THE PROP WOBBLE AND THE LIGHT DRIFT ARE THE SAME
# MEASURED EVENT: pick-followed prop 393ba752/FC43120CE463D306 steps +0.446 +0.266 +0.149 +0.053
# across frames 4425-4428 and returns -0.914 at 4429 -- exactly the sum -- while lamp fa4be5 drifted
# on the same frames and snapped at 4429; a prop whose reference is FRESH every frame jitters only
# 1e-4..1e-3 units, which is the f32 floor at these coordinates and three orders under the 0.25
# census threshold. (E5) CAMREBASE's bridge does what it claims where it acts: all 49 bridges read
# bridge_err <= 2.7e-7 with rdet=1, and each lamp had one home position across 6-8 witnesses on the
# on arm against one per witness on the off arm.
#
# SO THE MECHANISM IS A STALE REFERENCE, NOT A MOVING LAMP AND NOT A DECODE WOBBLE. What no row can
# say yet is WHICH staleness: a hold (the incumbent was off screen), draw order (the lamp drew
# before this frame's mid-frame relatch), or the relatch refreshing from a DIFFERENT OBJECT than the
# witness tracker is following. Those three want three different fixes, and this round exists only
# to make each row say which one it is. Nothing below changes what is rendered or submitted.
#
# THE TWO KNOBS, both new, both default 0, both pure instrumentation.
RPCS3_REMIX_CAMRELATCHTRACE=1
RPCS3_REMIX_GLDRIFTMAT=1
#
# CAMRELATCHTRACE=1 emits 'Remix cam-relatch:' (one line per mid-frame relatch: the eye it took, the
# step it applied to the submitted eye, whether that draw lay within CAMTRACKPOS of the incumbent
# witness track, and how many world draws had already been placed on the previous reference) and
# 'Remix cam-relatch-disagree:' (one line per frame in which the relatch's draw and the tracker's
# own match for the incumbent are more than 0.05 units apart). Both capped 64 per 120-flip window.
# GLDRIFTMAT=1 adds 'Remix guest-light-drift-mat:' after each drift row with the draw's raw fused
# matrix and the active reference_inverse in %a hex, so "the guest moved the lamp" (translation row
# only) and "the decode wobbled" (spread through the entries) can be split from THIS run's log
