# --- ROUND 55: reference refresh without an identity change (CAMREFSYNTH) ------------------------
# What round 54's rows actually said, once each hold was read against the cam-track rows that bracket
# it rather than against a +/-1-frame label: the holds do NOT end in the frozen reference thawing.
# Nine of the eleven hold-ending snaps are a BASIS SWITCH - a handover, a reset, or the 12-frame
# discontinuity confirm finally installing a different witness's basis - and the two that were an
# exact return came through a foreign relatch, not through the incumbent's own basis coming back.
# The script's [miss]/[confirm] label tested for a handover within one frame of a hold's FIRST row,
# and this run's handovers fall in the middle or at the end of the holds, so every hold read [miss]
# while several were confirm windows. Twenty-three of the 28 switches were CO-PRESENT handovers -
# exactly the population CAMREBASE bridges.
#
# So the slide and the snap have different owners. The slide is the frozen reference on the ~71
# cam_track_missed flips; the snap is a change of witness basis because the incumbent DIED.
# CAMREFSYNTH attacks only the first: on a miss flip it re-synthesises the incumbent's reference for
# that frame from a co-present static witness and the rigid relation the pair expressed while both
# were drawn (rel = M_J x M_I^-1, so view_I = rel^-1 x view_J), and installs it through the ordinary
# latch. Camera IDENTITY is untouched - the tracker still holds the incumbent, and every counter that
# describes the election is bit-identical. A synthesis that cannot be made holds exactly as today and
# says why (cam_ref_synth_nowitness / _short / _rigid / _basis / _badrel).
#
# THREE ARMS, one restart each. Change the ONE active line below; this file is FIRST-WINS, so a
# second copy of a key appended later is a silent no-op - never add one, edit in place.
#   arm 1 (this one)  RPCS3_REMIX_CAMREFSYNTH=1
#                     tell: cam_ref_synth > 0 on 'Remix live:', 'Remix cam-synth:' rows in the dump,
#                     drift rows carrying refsrc=1, and NO drift row with refsrc=1 and new_age >= 2.
#   arm 2             comment the =1 line and un-comment the =2 line below.
#                     tell: cam_discontinuity_held=0 and cam_switch_confirmed=0 (structural), and
#                     cam_ref_synth_install == cam_track_handover + cam_track_reset. Cost: more
#                     snaps, because every handover switches at once instead of 12 flips later.
#   arm 3 (bridge)    the user's call - un-comment the existing RPCS3_REMIX_CAMREBASE line at the top
#                     of this file (it is commented with the round-54 reasoning attached) and repeat.
#                     tell: cam_rebase_applied ~ cam_track_handover, cam_basis_switch ~ reset only.
#   off arm           comment the =1 line and add nothing.
#
# Expected banner on arm 1:
#   Remix game-config: BLUS30267 applied=17 skipped-already-set=0 ignored=0
