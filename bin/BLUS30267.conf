# (30086232b02bc73a / b4863d4286b2ec49) carries no literal route at all and is untouched.
#   armed:   'Remix live:' fpconstmrt=N climbing beside fpconst=; 'Remix fpconst:' route=mov
#            target=31 mrtsel=1 for fp=76ef310dc95f9e7b.
#   refuted: a flat-painted MRT surface that should show its texture detail -> set to 0.
RPCS3_REMIX_FPCONSTMRT=1

# Round 63: missing level-1 geometry. The cmask skip drops draws whose RGB writes are all
# masked off; this title evidently shows some of them. skip_cmask was 2784126 of 6109024 draws.
# Bisect: SKIPCMASK first (dominant, 2.78M); SKIPNOTARGET second (30k) if geo is still missing.
# REFUTED 2026-09-11: =0 did NOT restore the missing walls, and it made every masked draw a
# full-screen grey neutral-material surface (RMXNOTEX) in the main menu. The walls are not
# cmask-skipped draws. Left at default 1.
#RPCS3_REMIX_SKIPCMASK=0

# Round 63b: white "clown shoe" blobs = draws whose texture was deferred by the per-frame upload
# budget (default "Texture Uploads Per Frame" = 8). Over-budget draws submit a null material and
# render neutral white until a later frame admits them; tex_deferred was 1724, notex_mat_applied
# 15573. Must be a NUMBER, never 0: texture_budget() uses the env||g_cfg shape, so 0 is a silent
# no-op that falls through to the config default.
RPCS3_REMIX_TEXBUDGET=128

# Round 63c: missing-wall bisect, part 2. Drops draws with NO colour target bound (depth-only /
# shadow passes), 30544 of 6109024. Narrower than the cmask half, which was refuted. Watch for
# ghost duplicate geometry - a shadow pass submitted as world geo renders as a second body.
# REFUTED 2026-09-11: did not restore the walls, and the main-menu world went BLACK a few
# seconds in - depth-only passes submitted as world geometry. Left at default 1.
#RPCS3_REMIX_SKIPNOTARGET=0

# Round 64: the sky dome never classified. Its own sky-census row reads reject:extent -
# albedo=20703908CDA055F1 vtx=584 depth_write=0 rawext=46722 wext=1095.09 minext=2000.
# Every other gate passes (anchor 4.77e-07 vs limit 4, measured=1). Threshold placed at 800:
# admits the two sky-like draws (wext 1095.09 and 1121.51), excludes the next candidate (282.76).
# SKYTAG stays 0 - the Remix sky CATEGORY hides geometry on this backend.
# INERT while SKYTAG=0: lowering this only changes the census label (TAGGED means "would have
# been"); the tag is suppressed at the consume site, so nothing reaches the renderer. Parked.
#RPCS3_REMIX_SKYEXTENT=800

# Round 67: the sun already existed and submits every frame ("Remix sun: created
# travel=[-0.3509 -0.9023 -0.2506] radiance=3 angle=0.5deg", draw=SUCCESS) - it was simply too
# weak against the ambient to read as directional light. Reference shows clear directional
# modelling on Matt and the brickwork. Raising radiance; direction left alone for now so this
# is one variable.
RPCS3_REMIX_SUNRADIANCE=10

# Round 68: THE MISSING SUNLIGHT. A startup "debug light" is created at the world ORIGIN for
# every title except BLUS30443 (RemixGSRender.cpp, create_origin_light) - sphere, radius 0.1,
# radiance 100, hash 0x3, isDynamic. The Remix dev menu shows it as "Frame last touched: 0":
# created once and never updated, and the code comment notes the runtime keeps created lights
# active forever. A 100-radiance omni at the origin flattens every directional cue, which is why
# the sun (radiance 10, submitting draw=SUCCESS every frame) reads as no sunlight at all.
# NOT 0: env_float rejects non-positive values, so =0 is indistinguishable from unset and falls
# through to the config default. 0.0001 is off in all but name.
RPCS3_REMIX_LIGHTRADIANCE=0.0001

# Round 70: the bulb CARD (the visible glow quad), not the fixture housings - those were the
# "green light bulbs" and are already fixed by FPCONSTMRT. The shipped card builds its alpha from
# the RED channel, but the bulb program (bin/remix_ucode/2AB144FBF9F8905C.fp) never samples red:
# it reads the atlas as tex1.y (G) and tex1.w (A), and writes a FLAT 0.6 alpha. R is non-zero on
# only 2.7% / 2.9% of texels, so the card was ~97% transparent - present but invisible.
# 0 = shipped, 1 = the program own G/A base with flat alpha 153, 2 = the same carried as emissive.
# Try 1 first; 2 if the bulb reads as grey glass rather than as something lit.
RPCS3_REMIX_GUESTLIGHTCARD=1

# --- ROUND 71: WORLD-SPACE INSTANCE CENSUS (the instrument the placement measurement needs) -------
# WHAT WAS MEASURED THIS ROUND, so the next round does not re-derive it:
#   * `map` (view x projection x reference_inverse) is the IDENTITY - identity_l1 = 9.98e-05 on
#     every `Remix authored-map:` line ever emitted, and `Remix authored-light:` confirms it in
#     mission 1 too (file=[-25.3998 -36.7466 4.81586] -> render=[-25.4005 -36.747 4.81594]).
#     So the runtime derivation contributes NOTHING: placement is AUTHOREDLIGHTAXIS + OFFSET alone.
#   * The file frame is Z-up, metres. The light cloud is 233.4 x 150.5 x 13.5 m and 251 of the 398
#     records aim exactly (0,0,-1) - ceiling lights pointing straight down file-Z.
#   * The render frame is ALSO Z-up metres and is a STABLE, RUN-INDEPENDENT guest world frame.
#     Decoding the exact-hex fused/ref pair on `Remix guest-light-drift-mat:` gives
#     model = fused x reference_inverse with scale 1.0000: one static lamp lands on
#     model_t=[15.22 16.09 -10.12] in pid 33068 AND pid 23456, another on [14.70 17.38 -12.55] in
#     pids 31908, 17756 and 19056 - agreeing to 0.01 m across separate processes. The codebase's
#     "render space differs between frames by a pure translation" note is therefore RETRACTED: the
#     apparent drift was the 2-slot guest-light list re-minting onto DIFFERENT lamp instances on
#     different floors, not the frame moving. A constant axis+offset IS the right shape of answer.
#   * What is still missing is the CORRESPONDENCE. The logs contain only TWO emissive glow-card
#     meshes; a 48-permutation Hough fit of their 47 decoded instance positions scores 9/47 for
#     01_JapaneseRestaurant1 against 6/47 for 06_Warehouse_Druglab and 5/47 for three other wrong
#     levels. No discriminating power - so NO axis value and NO offset is entitled to be set, and
#     AUTHOREDLIGHTAXIS stays at 0 with AUTHOREDLIGHTOFFSET unset.
#   * HOW WRONG TODAY'S PLACEMENT IS, measured rather than asserted. Over 147,539 logged
#     `Remix authored-light:` rows in mission 1 the nearest authored light to the active eye is
#     19.41 m and it never gets closer; the same code on 00_MainMenu reaches 1.19 m, but only
#     because that scene's 6 lights are authored AT the origin (centre [6.7 -1.6 -8.0]) - it is a
#     degenerate case, not a control.
#   * A BOUND ON THE ANSWER that needs no correspondence: the eye box over all mission-1 runs is
#     x[-34.2 37.8] y[-61.0 35.9] z[-14.5 7.5] (n=94405 `active=` samples) and the light box is
#     x[-174.9 58.6] y[-167.7 -17.3] z[-0.4 13.1]. For the player to be inside the lit volume at
#     all, under the IDENTITY permutation the offset must satisfy x in [-20.8 140.7] and y in
#     [+53.1 +106.7]; on a 0.5/99.5 percentile eye box, which is robust to a transient bad
#     camera latch, the conservative band is x [-33.9 141.4] and y [+43.7 +125.9].
#     So AUTHOREDLIGHTOFFSET=0,0,0 is provably wrong by at least 43.7 m in y on the conservative
#     band, whatever the axis is.
#     The same bound for the other three vertical-preserving rotations: axis 3 x[-137.1 24.4]
#     y[-131.8 -78.3]; axis 17 x[-129.9 -51.4] y[-22.7 113.8]; axis 18 x[55.1 133.5] y[-139.0 -2.5].
#     All four remain feasible, so the bound constrains the OFFSET, not the AXIS.
#
# WORLDBOXCENSUS=1 is what closes that gap. `Remix worldbox:` already prints lo/hi in exactly that
# world frame; it was gated to ONE row per vertex program per run (96 rows covering a handful of
# shaders). At 1 the dedup key becomes (vp, albedo, box centre quantised to 0.5 m) and the cap
# becomes 8192, so every distinct drawn INSTANCE contributes one row. One mission-1 session then
# yields hundreds of object positions in the guest's own world frame, which is what makes the same
# 48-permutation fit - WITH its wrong-level control - able to decide.
# Diagnostic only. Default 0 = today's behaviour, byte-identical. Read back on the run-start banner
# as `worldboxcensus=`.
RPCS3_REMIX_WORLDBOXCENSUS=1
