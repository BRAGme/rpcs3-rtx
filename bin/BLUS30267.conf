# --- guest light injection (2026-09-06) ----------------------------------------------------------
# The guest-light path was already running and already finding lamps -- 435 `Remix light-candidate:`
# rows in one menu session, split `state=fixture` and `state=glowcard`, lum 0.72-0.88 -- but it
# never fired once: `guest_light_notrigger=217096` with `guest_lights_created=0`, because the
# albedo enrolment list was empty (`glalbedos=0`). The albedo content hash is the only required key
# (the vp/fp pair is optional narrowing), the list holds 16, and it parses comma/space separated
# base-16. These are the twelve the census named, most-seen first. If a lamp lights that should not,
# drop its hash rather than the whole list.
# CORRECTED 2026-09-06: the twelve census-ranked hashes were far too broad -- the light debug
# visualisation showed spheres welded to walls, floor and crates (guest_lights pinned at the
# glmax=64 cap with guest_light_capped=53909). The user identified the actual ceiling bulbs by
# hash; only these two are lamps.
RPCS3_REMIX_GUESTLIGHTALBEDO=FCC887021F24B784,FC43120CE463D306
RPCS3_REMIX_GUESTLIGHTVP=30086232B02BC73A
RPCS3_REMIX_GUESTLIGHTFP=B4863D4286B2EC49
# The FP discards tex0 RGB and computes a warm procedural bulb colour. Remix cannot replay that
# shader, so attach the scoped synthetic warm masked material instead of the raw green atlas.
RPCS3_REMIX_GUESTLIGHTFIXTUREMAT=1

# --- guest light colour and stability (2026-09-06, from the user's 68-frame clip) -----------------
# Two faults seen in the video, both with an existing knob:
#
# 1. THE LIGHTS ARE GREEN. Light colour is sampled from the fixture albedo's mean RGB, and the
#    enrolled lamp texture is the green-capped bulb, so every injected light comes out green and by
#    frame 45 the whole corridor is flooded green. GUESTLIGHTCOLOR=0 restores the fixed warm
#    constant instead of the sampled colour (the accessor uses env_u32 precisely so the explicit
#    off is expressible).
RPCS3_REMIX_GUESTLIGHTCOLOR=0
#
# 2. THE LIGHTS MOVE WITH VIEW ANGLE. Frame 30 puts the debug spheres at shelf height on the left
#    wall rather than on the ceiling fixtures, and the set changes as the camera turns. The
#    glow-card cell table is the position-stability mechanism and ships default 0, "armed from a
#    config, per this project's standing rule". Its own comment recommends 4: "4 leaves a 6x margin
#    over the fixtures". With cells on, GUESTLIGHTSTABLE can stay 0 so fixtures light on first
#    sight rather than serving a 600-frame dwell.
#
#    RETRACTED 2026-09-06 (round 52). The cell gate is a WORLD-MOTION test, and world motion on this
#    title is BASIS motion. The gauge-anchor branches of per_draw_transform never fire here --
#    gauge_used=0 gauge_prev=0 against gauge_absent=2055599, every draw of every run -- so each
#    draw's world is `fused * m_active_camera.reference_inverse`, a per-frame camera-relative basis.
#    The recovered position of a bolted-down lamp therefore moves whenever the camera re-bases, and
#    the gate cannot separate a lamp from an NPC. MEASURED, run pid=20656: the camera went
#    [-0.443 -0.654 -1.108] (frame 2801) -> [-9.18 -13.59 0.64] (2808) -> [-7.03 -19.39 -1.10]
#    (2809), and BOTH enrolled bulbs were disqualified at frame 2809 on their fifth distinct cell --
#    four of which were logged before the cut. With GUESTLIGHTAUTO=0 and two hashes the user picked
#    by hand there is nothing for it to protect, so it only ever removes the two lights that were
#    asked for. Left as a comment rather than deleted: if AUTO is ever re-armed here the gate needs
#    a "count cells only within one camera latch" variant first.
#RPCS3_REMIX_GUESTLIGHTCELLS=4
RPCS3_REMIX_GUESTLIGHTCELLS=0

# --- ROUND 52: the lights sit in the wrong place and move as the player turns ---------------------
#
# The lights do not move. The WORLD moves under them. A guest light's position is the fixture's local
# AABB centre pushed through that draw's world transform, and with no gauge anchor on this title that
# transform is `fused * m_active_camera.reference_inverse` -- the model space of whichever draw last
# won the camera election, divided out as of the last latch. Geometry is re-divided every frame; a
# light was minted ONCE and never touched again. MEASURED, run pid=29940 frames 1255-1258: the same
# FC43120CE463D306 bulb minted a light at [17.29 9.106] -> [16.68 10.89] -> [15.93 12.68] ->
# [15.04 14.46], a straight line at ~1.9 units/frame, while the camera was identical to five decimals
# with cam_age climbing 0,1,2,3.
#
# GUESTLIGHTTRACK keys a fixture on (albedo, vp, quantised LOCAL AABB centre) -- vertex data, which
# does not depend on the camera -- and re-places its light every frame the fixture is drawn, with a
# same-hash CreateLight (an in-place update) and isDynamic so the runtime does not sleep it.
RPCS3_REMIX_GUESTLIGHTTRACK=0
RPCS3_REMIX_GUESTLIGHTIDLE=1
#
# GUESTLIGHTMAINCLIP refuses an aux-pass draw of the fixture: the bulb program 30086232b02bc73a also
# draws into 128x128 targets, and divided by the MAIN camera's inverse those land at a projectively
# wrong scale -- measured extent 1.281 / 1.732 (run pid=29940 frame 1258) and 1.556 / 2.068 (run
# pid=20656 frame 2724) against 0.5 / 0.578 on every main-pass row. There was no clip gate on this
# path at all.
RPCS3_REMIX_GUESTLIGHTMAINCLIP=1
#
# BOTH ARE LATCHED AT BACKEND INIT -- a change here needs a RESTART of RPCS3, not a game reload.
#
# THE A/B: set GUESTLIGHTTRACK=0 and keep MAINCLIP=1. The drift is still MEASURED on the off arm, so
# that run prints `Remix guest-light-drift:` rows with `replaced=0` and a non-zero
# `guest_light_drift` / `guest_light_drift_stale` on `Remix live:`, saying exactly how far a TRACK=1
# run would have moved each light -- and `guest_lights_created` should climb past the bulb count as
# the duplicates return. Expected with TRACK=1: banner `gltrack=1 glmainclip=1`,
# `guest_light_replaced > 0`, `guest_light_auxclip > 0`, `guest_light_track_conflict=0`,
# `guest_light_createfail=0`, and every `Remix guest-light:` row reading clip=1280x720.

# --- sky (2026-09-06, round 52) ------------------------------------------------------------------
# DO NOT "fix" this by lowering SKYEXTENT. A SKY-TAGGED DRAW IS DELETED AND REPLACED BY BLACK on
# this backend -- tagging the dome would remove the sky, not show it. The mechanism, verified in
# source 2026-09-07: rtx_instance_manager.cpp sets `m_isHidden = true` for every instance whose
# drawCall.cameraType == CameraType::Sky, and the only thing that would put something back in its
# place, tryHandleSky, is called from exactly one site -- RtxContext::commitGeometryToRT, the D3D9
# draw path. remixapi meshes reach the scene through SceneManager's external-mesh route instead and
# never touch it. So the sky is hidden and nothing replaces it.
#
# CORRECTED 2026-09-07 -- this note previously blamed the behaviour on the runtime being a
# "dxvk-remix-aerial" build swapped in at 05:24 on 09-06. Every part of that was wrong:
#   * That runtime was NOT aerial. ProductName read `remix-main+55ff80e9`, the head of branch
#     `numos3-f90`; `git merge-base --is-ancestor 7645c53d 55ff80e9` is FALSE.
#   * The string evidence proved nothing. `dxvk-remix-aerial` is the WORKTREE all three f90
#     branches are built in, so it is a folder name in the embedded build path, not a version
#     marker. And numos3 carries the atmosphere and the older cloud system too (21 files under
#     shaders/rtx/pass/atmosphere, 14 of them cloud), so `atmosphere` / `Hillaire` / `skyMode`
#     counts do not separate the lineages either.
#   * The `m_isHidden = true` block itself is identical on numos3-f90 and on the aerial line.
# Lineage is settled by ProductName plus ancestry, never by strings.
#
# BUT THE OUTCOME DOES DIFFER BY RUNTIME, via a clamp UPSTREAM of that block
# (rtx_remix_api.cpp, toRtDrawState, verified 2026-09-07):
#   * numos3-f90:    prototype.cameraType = (cameraType == Sky) ? Main : cameraType;
#                    SKY selects the sky camera's matrices via ExternalDrawState::cameraType but
#                    does NOT hide the instance. This is what rpcs3 ran until 2026-09-07.
#   * aerial line:   prototype.cameraType = cameraType;   (no clamp)
#                    SKY reaches DrawCallState, m_isHidden fires, the draw is gone.
#   * remixplus-f90: no clamp either, so PCSX2 behaviour is unchanged by its own swap.
# So on the runtime deployed here NOW, a SKY-tagged API draw really is deleted -- but that is a
# property of this runtime, not of every runtime, and BLUS30094 (SKYCLASSIFY=1) is the title where
# the difference will actually show.
#
# As of 2026-09-07 the deployed runtime IS aerial-descended: `remix-main+0ff0db1b` = Kim2091's
# world-space clouds branch (`world-space-numos3`) plus the f90 commit, and `rtx.skyMode = 1` is
# now set in bin\rtx.conf. That changes which sky system is available; it does NOT change any of
# the above -- SKYEMISSIVE is still the route that works here.
#
# The route that works here is the material, not the category: SKYEMISSIVE keys on the albedo
# content hash and gives the dome an emissive material (intensity 2.0, per-texel, BlendType::Emissive)
# with no extent or anchor gate.
#
# The dome is identified unambiguously: vp=bdc0776911119029, 584 triangles, draw origin on the eye
# (anchor 2e-6), camera inside it, raw sphere +/-23361, depth-write off, wext 291-1095 -- the only
# extent-refused draw that would have cleared the anchor gate.
#
# Expected: banner `skyemissive=1`, `mat_skyemissive>=1`, a `Remix skyemissive: vp=bdc0776911119029
# ... listed=1` row, and `cat_sky=0` STAYS ZERO (that is correct here, not a failure).
# CORRECTED 2026-09-11: 20703908CDA055F1 is NOT the sky. Its BMP dump is flat opaque white -
# mean rgb (247.1 246.6 247.1), stddev 8.3, identical across all 8 row bands, acov=255..255.
# A sky texture has a vertical gradient; this has none. It is the LIGHT-RAY texture (vtx=584,
# rawext=46722 = long shafts), and tagging it sky-emissive is what made the rays render as huge
# translucent glowing sheets instead of white opaque. Disarmed.
# RE-ARMED 2026-09-11: disarming it turned the world BLACK. The texture is shared by the DOME
# (vp=bdc0776911119029) and the RAYS (vp=487557313fb93949), so one hash cannot separate them.
# The emissive is what makes the dome visible at all; without it the dome is unlit = black.
# Proper fix is a vp-scoped list, which needs a code change. Restored meanwhile.
RPCS3_REMIX_SKYEMISSIVE=20703908CDA055F1

# --- ROUND 53 (2026-09-07): the game's own dome as THE sky, on any runtime in the family -----
#
# THE WISH: "working raster sky so that way numos isn't a reliability, just something to mess
# around with." Today it is the other way round - what is on screen IS the runtime's atmosphere.
#
# MEASURED, in bin\remix_dump.log, not argued:
#   Remix skip-census: gate=wext vp=bdc0776911119029 fp=9747c2d02c8abf97
#     albedo=20703908CDA055F1 extent=1095.06 dist=4.76837e-07 clip=1280x720
# The dome is EATEN BY THE WORLD-EXTENT GATE. audit_world_extent refuses any draw whose
# post-transform extent exceeds STREAKGATE (128) times the frame's median once 16 samples exist,
# and the dome's ratio is three to four orders of magnitude over that (median ~0.149, extent
# 1095 -> ratio ~7330). Max wext_refused on a 'Remix live:' line in that dump: 7896. So the dome
# reaches the runtime only in the handful of frames before a median exists, and the sky the user
# has been looking at is bin\rtx.conf's rtx.skyMode=1 atmosphere.
#
# And in the frames it DOES pass, mat_skyunordered=1 on the live line: the material declares
# BlendType::kEmissive, whose opacity is exactly 0 in NVIDIA's shader
# (opaque_surface_material_blending.slangh:159-166, enableOpacityEmissiveBlendModes default
# false at :32), so the dome is ADDED on top of whatever the runtime paints behind it. Its look
# is therefore a property of the build. That is the dependence being removed.
#
# Two conf changes here, one code change (RPCS3_REMIX_SKYEMISSIVEWEXT, round 53):
#
#  * SKYEMISSIVEBLEND=0 makes the dome OPAQUE. With the blend knob off the material keeps
#    useDrawCallAlphaState=1 and the draw-call blend extension this backend fills is the
#    ONE/ZERO "opaque alias", so NVIDIA's rtx_instance_manager.cpp gives it OBJECT_MASK_OPAQUE
#    instead of OBJECT_MASK_UNORDERED_ALL_EMISSIVE. Opaque to primary, shadow and indirect rays
#    on numos3, numos3-f90 and the deployed aerial build alike: it covers the runtime's sky and
#    its sky probe, it blocks the aerial build's atmosphere sun, and it becomes the scene's sky
#    light through GI - which is what a sky is. Read: mat_skyunordered goes 1 -> 0.
#    A/B: =1 restores the additive dome and the atmosphere shows through it again.
#
#  * SKYTAG=0 makes every anchored SKY rule MEASURE-ONLY for this title. The rule fires on the
#    untextured pass of the second dome program (vp=487557313fb93949, albedo=0, wext 3516-4176
#    against SKYEXTENT 2000) - 'Remix skyemissive: ... sky_tagged=1 listed=0' in the same dump.
#    What a SKY-tagged API draw then DOES is fork-dependent by construction: on the deployed
#    aerial-descended runtime it is HIDDEN, on numos3 toRtDrawState clamps Sky->Main and it is
#    merely re-cameraed. SKYEMISSIVE is the route that makes this dome visible and it needs no
#    category at all, so the category is removed rather than relied on. Counter
#    sky_tag_suppressed says how many draws it WOULD have tagged; every sub-rule's own counter
#    (sky_learned_ring, skyhash_tagged, sky_backdrop_hit) still records what it would have done
#    and 'Remix sky-census:' still prints TAGGED, so nothing above the switch goes quiet.
#    SKYEXTENT stays 2000: env_float rejects a non-positive value so the env cannot express 0,
#    and raising it would also disarm fp_vcol_sky_gate, which shares the same accessor.
#
# EXPECTED, banner: skyemissiveblend=0 skytag=0 skyemissivewext=1.
# EXPECTED, 'Remix live:': mat_skyemissive>=1, mat_skyunordered=0, wext_exempt_sky climbing by
#   one or two per frame with the sky on screen, sky_tag_suppressed>0 once the untextured pass
#   has been seen, and wext_refused NO LONGER climbing while the sky is up.
# EXPECTED, 'Remix stats:': cat_sky=0, sky_learned_ring=0.
# EXPECTED, census: NO 'skip-census: gate=wext vp=bdc0776911119029' row for the run.
#
# NEGATIVE CONTROLS, one restart each:
#   RPCS3_REMIX_SKYEMISSIVEWEXT=0 -> wext_exempt_sky=0, wext_refused climbing again, the
#     'gate=wext vp=bdc0776911119029' row back, and the atmosphere back in the sky's place.
#     That attributes the sky to the code change.
#   RPCS3_REMIX_SKYEMISSIVEBLEND=1 -> mat_skyunordered>=1 and the atmosphere visible THROUGH
#     the dome again. That attributes the covering to the opaque material.
# TO SEE THE RUNTIME'S OWN SKY INSTEAD (numos as a toy, not a reliability), add
#   RPCS3_REMIX_CAT_HIDE=20703908CDA055F1
# and restart: HIDDEN is contract-defined on every build, cat_hidden climbs at the dome's rate
# and the atmosphere returns. Remove the line to get the game's sky back.
#
# If the sky is blown out or dim that is RPCS3_REMIX_SKYEMISSIVEINT (binary default 2.0; try
# 1.0 then 3.0), one restart per value. Both keys below are latched at init.
RPCS3_REMIX_SKYEMISSIVEBLEND=0
RPCS3_REMIX_SKYTAG=0

# --- ROUND 52: the transposed vertex blend (RPCS3_REMIX_VERTEXBLEND) ------------------------
#
# Characters were invisible for the whole title. Round 51 measured skin_unrecognised=117183, ALL
# of it skin_unrec_indexed (the other three faults 0), skin_submitted=0, vp_indexed_matched=0
# vp_indexed_unmatched=8. Cause: these eight programs blend the TRANSPOSE of the shape
# match_blend_palette expresses -- they transform the point by each bone (four indexed MAD column
# chains) and sum the four transformed points, instead of summing the matrix rows and applying the
# sum once. Every arm of find_chain refused it by design. All eight replayed from bin
# emix_ucode:
#   001e9e3d5495ee54 001e6e3d1495ee54 031ce5a041c06209 031cb5a001c06209
#   a97036b5f4b84f25 a97006b5b4b84f25   (main passes, 52 indexed reads each)
#   349bacaa433e003c 645fc1a8edc0d28d   (colour-mask-skipped shadow passes, 16 each)
#
# match_vertex_blend runs LAST in find_chain, so it can only ever match a group every existing arm
# already refused. Default ON; the line below is the one-line A/B.
#
# Expected with it ON:  banner `vertexblend=1`; six `Remix: indexed-world ... form=vertexblend
#   extra=36` rows plus two with extra=0; `Remix posinput: vp=001e9e3d5495ee54 input=4
#   scale_slot=465`; skin_unrec_indexed=0, vp_indexed_matched=8, skin_vertexblend>0, characters
#   drawn.
# Expected with it OFF (uncomment): banner `vertexblend=0`; skin_unrec_indexed climbing at
#   ~14 draws/frame again, vp_indexed_unmatched=8, skin_vertexblend=0, characters gone.
#RPCS3_REMIX_VERTEXBLEND=0

# --- ROUND 52: the camera election (CAMRELATCHTOL / CAMCLIPGATE=2 / CAMSTICKY) ---------------
#
# SYMPTOM: in the main menu the camera submitted to Remix rides the player character's revolver
# and oscillates; in gameplay the elected identity flip-flops between clusters 10-25 units apart.
#
# MEASURED, run 13 of bin
# emix_dump.log (build=Sep 6 2026 12:08:47 pid=26984, 6,045 elected
# frames, 83,257 cluster rows), read PER FRAME rather than summed:
#
# 1. THE MENU SYMPTOM IS THE MID-FRAME RELATCH, NOT THE VOTE. In every sampled menu frame the
#    9-vote winner 001e6e3d1495ee54 sits static at [-1.6456 2.4655 -0.5667] with view_delta=0.40,
#    while the cluster the active camera was actually refreshed from (view_delta=0) is a ONE-vote
#    633ba74c6b235af7 cluster - one of four near-identical clusters, i.e. parts of one animated
#    thing - drifting -2.3212 -> -2.3270 -> -2.3329 -> ... -> -2.4104 by frame 2100. The relatch
#    takes the FIRST candidate within 0.8 of the active view and submit_camera() submits what it
#    left behind, so the winner was >= 0.05 from what was submitted on 727 of 1,074 contested menu
#    frames (68%) and 1,312 of 4,731 in gameplay (28%). CAMRELATCHTOL scopes the relatch to the
#    active camera's OWN cluster. 0.1 is 4x under the props' 0.40 and >= 3x over the true camera's
#    own per-frame motion (p50 0.054 / p90 0.17 / p99 0.33 against a matrix norm of ~8-35).
RPCS3_REMIX_CAMRELATCHTOL=0.1
#
# 2. THE 128x128 CUBE-FACE PASS WINS BY VOTES. 1b20d02263aa8ee4 / f5265372e9f61872 at
#    clip=128x128 fov=90 aspect=1.0 near=0.01 won 14 frames of run 13 INCLUDING THE FIRST CAMERA
#    OF THE RUN (frame 931, candidates=1, position 30 units off). score_perspective's square-aspect
#    refusal is fed the candidate's OWN clip aspect (1.0 for a square pass), so it is structurally
#    disabled for exactly the pass it was written for; a target rule cannot separate them either
#    (155 of the 157 128x128 rows are on target 31, the same target as the main pass). Mode 2 runs
