# ROUND 60. THE BOOT LOGO BLUE FLICKER, ROOT-CAUSED AND FIXED.
#
# NOT a colour write mask. The 'cmask=0xe' on every logo row packs RGBA from bit 3 DOWN on the
# ui-route line (R=0x8 G=0x4 B=0x2 A=0x1), so 0xe is "RGB written, ALPHA masked off" - an
# ordinary state, not "red masked off". The 'Remix notex:' line packs the SAME register the
# other way round (r=0x1 g=0x2 b=0x4 a=0x8); do not read one line's nibble with the other
# line's key.
#
# THE ACTUAL CAUSE. The four 1280x720 logo textures (fmt=a5 = A8R8G8B8|LN) carry
# NV4097_SET_TEXTURE_CONTROL1 = 0xAA93, a non-identity channel remap: guest memory holds RGBA8
# bytes [R][G][B][A] that the format byte declares as A8R8G8B8, and the remap is what puts them
# back in order. remix_rsx::texture_cache::decode() never read that register, so the decoded
# image came out with B pinned to 255 and the greyscale in G/R/A - a full-strength blue field.
# The fragment program cc1755fe0ee916bf samples the texture's RGB with no swizzle of its own,
# so blue is exactly what reached the screen.
#
# MEASURED, both directions, unattended boot runs on 2026-09-10:
#   texremap=0 -> tex_remap_seen=542 tex_remap_applied=0
#   texremap=1 -> tex_remap_seen=246 tex_remap_applied=239
#   the "solid blue field" content dumps 921600/921600 texels at B=255 G=0 R=0 A=0 before and
#   921600/921600 at B=0 G=0 R=0 A=255 after - an EXACT whole-image match to the predicted
#   0xAA93 transform, zero disagreeing pixels.
#
# THE A/B IS THIS ONE LINE. Set it to 0 (or delete it) and the old picture returns in one
# restart - the code default is OFF, so no other title is affected by this file.
# CELL_GCM_TEXTURE_B8 is deliberately excluded from the rewrite: that decode arm already
# hand-writes (v,v,v,255), which is itself a stand-in for this register, and applying the remap
# on top would double it. That is the gap between seen=246 and applied=239.
RPCS3_REMIX_TEXREMAP=1

