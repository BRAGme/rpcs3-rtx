# The Last of Us (BCUS98174) -- RTX Remix profile
#
# The half-resolution 982D... program writes a motion/deferred buffer, not visible colour.
# Ctrl-click picked this exact pair twice as opaque material-less geometry in the 640x360 pass.
# Keep it out of the primary/shadow TLAS without touching any other use of either program.
RPCS3_REMIX_HIDEPAIRVP=3D8BF2BAE8F9E1FB
RPCS3_REMIX_HIDEPAIRFP=982DF9C1B2535FB3
RPCS3_REMIX_HIDEPAIRMODE=1

# TLOU's valid projection convention produces a negative signed far result. The sanity gate's
# far-sign test labels every resolved camera insane; leave the already-stable camera election on.
RPCS3_REMIX_CAMDEPTHGATE=0
RPCS3_REMIX_TEXREMAP=1
