# Ratchet & Clank Collection (BCUS98282) -- per-game Remix profile
# Restart RPCS3 after edits; this file is read once at boot (and again after the exitspawn into
# RC1, which reports the same serial -- the second read logs skipped-already-set, not applied).
#
# Round 57 unblocked the world path: RC1's vertex programs write the projection with the W row in
# a different temp lane and the X row overwritten by a MAD, so the matrix chain was invisible and
# every world draw was refused. repair_split_rows follows those two hops back; see
# RPCS3_REMIX_SPLITROWS in docs/remix/KNOBS.md. MEASURED after the fix, run 2026-09-10:
#   arch=fused  world_applied=18,137,400  world_refused=9,911 (0.05%)  submitted=18,137,148
#
# Every value below is aimed at one measured number from that run's 'Remix stats:'/'Remix timing:'.

# ---------------------------------------------------------------------------------------------
# THE FRAMERATE. 'Remix timing:' on that run:
#   frame_ms=38.89 | draw=32.38 (mesh_create=15.06  audit=7.03  ui=0.14) | mesh_creates/frame=467
#   meshes_live=148,696   created=1,931,080   destroyed=1,782,384   buckets=0/0/0/0/52
# mesh_create alone is 39% of the frame and every one of the 52 sampled frames sat in the top
# create bucket. The live count is not a coincidence: 467 creates/frame x MESHIDLE 300 frames =
# 140,100, against the 148,696 measured. The cache is holding five seconds of one-shot meshes,
# 92% of which are destroyed unused (1.78M of 1.93M), and each is a live Remix BLAS.
#
# CORRECTED 2026-09-10, second pass. MESHIDLE is a MEMORY lever, not a framerate one: it sets how
# long an unreferenced mesh is KEPT, so it moves meshes_live (148,696 -> an expected ~14,000) and
# leaves mesh_creates/frame exactly where it is. The first version of this comment implied it would
# raise the framerate. It will not, unless Remix's per-create cost happens to scale with the size
# of the live set -- which is plausible and unproven. Keep it for the 5.4 GB, judge it on
# meshes_live, and do not credit it with frames it has not yet earned.
#
# WHERE THE CREATES ACTUALLY COME FROM, and it is one program. 'Remix meshchurn:' on that run:
#     programs=3 creates/frame: d032c3b0051293db=641.2  646dec336deba29a=0.3  24d3cae7b3e1bd04=0.0
# against a whole-frame mesh_creates/frame of 467-550. One vertex program is essentially all of it,
# and its content hash moves every frame -- the mesh key is the hash of the submitted vertices, so
# geometry the guest rewrites per frame can never hit the cache. That is the real target, and it
# is not a knob yet: it needs the draws characterised first (are they one big dynamic batch or
# hundreds of small camera-facing cards -- 'Remix suncard:' logs 3,456 of the latter on this vp).
RPCS3_REMIX_MESHIDLE=30

# ---------------------------------------------------------------------------------------------
# THE FRAMERATE LEVER THAT IS REAL, AND IT IS FREE. Same timing line:
#   frame_ms=38.89 | draw=32.38 (mesh_create=15.06  audit=7.03  ui=0.14)
# 'audit' is 7.03 ms -- 18% of the whole frame -- and it is PURE DIAGNOSTICS:
# audit_vertex_extent makes four passes over the decoded positions and audit_world_extent walks
# the entire index list transforming every vertex into world space. Nothing is refused on either.
# The header comment on frame_timing says so outright and names this knob as the fix if audit ever
# dominates. It does.
#
# The documented cost of 0: the sky/extent rules and VTXREFUSE read the audit's results. On this
# title that costs nothing today -- cat_sky=0, every sky candidate is already refused, and the sky
# is being solved by texture hash below, which needs no extent rule at all. Set it back to 1 for
# any session where the sky census is the instrument.
RPCS3_REMIX_DRAWAUDIT=0

# ---------------------------------------------------------------------------------------------
# THE CAMERA FLICKER. Same run, over 11,076 frames:
#   cam_resolved=9,478  cam_fallback=1,598 (14%)  cam_held=814
#   cam_clusters=25,832  cam_contested=8,709 (79% of frames)  cam_relatch=8,658 (78%)
# CORRECTED before shipping: the obvious knob here is CAMSTICKY, and it is the WRONG one.
# Round 53 measured it and it did not move the identity-change rate at all, because the rank it
# applies is absolute precedence -- an own cluster present in the frame cannot lose -- and over
# 4,761 gameplay frames the winner track changed 84 times with the previous winner's track
# ABSENT from the frame in 80 of them. No ranking rule can help a candidate that is not there.
#
# CAMTRACK is the rule that can: continuity of identity over TIME. The longest-serving track
# keeps the camera, survives up to 3 frames in which it is not drawn, and hands over only when it
# really dies. Simulated on run 13's 83,257 logged cluster rows: 16 handovers against 84.
# READ: cam_fallback and cam_relatch should fall; cam_resolved should rise toward 11,076.
RPCS3_REMIX_CAMTRACK=1

# ---------------------------------------------------------------------------------------------
# THE MISSING HUD. ui_draws=0 -- the compositor rasterized NOTHING all run -- while ui_rt=11,535.
# The UIDUMP confirms why: every dumped HUD draw targets an offscreen render target, not the
# framebuffer (target=0xc0000000 / 0xc0780000, sampling a 768x768 atlas at texaddr=0xc33d0000),
# and KEEPRT is off by default so render-target-targeted draws are skipped. RC1 composes its HUD
# into an RT and blits it; with those draws dropped the HUD never reaches the screen.
#
# CAUTION, and the reason this is listed last: KEEPRT costs a full-screen fill per RT draw and is
# documented as having held one title at 1.9 FPS. Here it is ~1 RT draw per frame against a
# current ui_px/frame of only 24k, so the expected cost is one screen of scalar fill. If the
# framerate does not improve on the next run, set this to 0 and re-read -- it is the one line
# here that can COST frames, and separating it from MESHIDLE is a single-value A/B.
RPCS3_REMIX_KEEPRT=1

# ---------------------------------------------------------------------------------------------
# Compositor buffer capped to the guest surface rather than the window. RC1's clip is 1280x720,
# and the knob's own docs say nothing the rasterizer draws is authored above that, so the extra
# pixels buy no detail. NOT the framerate lever -- ui=0.14ms measured -- but free, and it stops
# KEEPRT above from costing a 1920-wide fill instead of a 1280-wide one.
RPCS3_REMIX_UIWIDTH=1280

# UIDUMP has answered its question (see THE MISSING HUD above). Off.
RPCS3_REMIX_UIDUMP=0

# ---------------------------------------------------------------------------------------------
# THE SKY -- deliberately NOT touched yet, because the run does not yet say what to touch.
# cat_sky=0 with sky_cand=10,842,400 all rejected on extent looks like the sky classifier
# refusing the dome, but the census says otherwise: every candidate it printed is a small prop
# (rawext 2.7 to 52, wext 3.6 to 66, against minext=2000) and most carry albedo=0. Those
# rejections are CORRECT. The actual dome never becomes a candidate at all, so raising SKYEXTENT
# would only admit props.
#
# And the category would be the wrong tool even if it fired: on this aerial-descended runtime
# CameraType::Sky reaches DrawCallState and rtx_instance_manager sets m_isHidden, so a SKY-tagged
# draw is DELETED, not re-lit (see the derivation on sky_tag_enabled(), RemixTransforms.h).
# SKYEMISSIVE is what makes a dome look right and it needs no category -- but it needs the dome's
# albedo hash, and nothing in the last run names it. The suncard census tops out at ext=69.91
# (8590EF62BA99EEAF), which is a card and not a dome, and the sky census only prints candidates
# that already passed the earlier gates.
#
# SO IDENTIFY IT BY EYE. RPCS3_REMIX_DUMP=1 writes one line per unique vertex program and texture
# to remix_dump.log, and RPCS3_REMIX_TEXBMP (on by default) writes each of those textures out as a
# BMP named by its hash, beside the exe. The sky is recognisable on sight; its filename is the
# hash to paste below. Bounded by the number of UNIQUE textures, not by draws.
#
# Turn DUMP back off afterwards -- the log grows without limit on a title submitting 18M draws
# (the Eat Lead copy of remix_dump.log reached 739 MB).
RPCS3_REMIX_DUMP=1

# Then fill these in and set DUMP back to 0:
#   RPCS3_REMIX_SKYEMISSIVE=<hash>[,<hash>]
#   RPCS3_REMIX_SKYEMISSIVEINT=2
#   RPCS3_REMIX_SKYEMISSIVEBLEND=1
# as BLUS30443.conf does for Demon's Souls. All three are also in Settings -> RTX Remix -> Sky now.
