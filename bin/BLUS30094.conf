# === ITEM 2: AIM THE SUN FROM THE SUN'S OWN SPRITE ============================
# You asked "any way we can attach the light to the suns texture? It's not
# clickable in game, the suns hash id is A61A3CBECA257FE0." You were right, and
# the reason it is not clickable is the reason it works: it is a 64x64
# SCREEN-SPACE sprite (route=2d, drawn by 2f64c2f8ffd6add1 and 2f650a38ffe6add1)
# so it never existed as world geometry to click on. Because the game draws it
# where its own sun APPEARS, its screen position encodes the sun's DIRECTION:
# unproject the quad's NDC centre through the live camera and that ray is the
# ray to the sun - per level, per frame, no texture analysis, no hand tuning.
#
# PRECEDENCE NOW SHIPPED:
#     SUNMAP  >  SPRITE  >  SUNSKY  >  SUNTRACK card  >  SUNDIR
# SUNMAP STAYS ON TOP. An earlier draft of this round demoted it below the
# sprite, because it was one hand-tuned vector per sky texture and you reported
# it aiming the Mantel land carrier wrongly. That premise died before shipping:
# Haze's PBCK archives were unpacked and every level pak authors its own
# k_scene_sun block with an azimuth and elevation, and for the jungle level the
# file-derived direction agrees with the sky-texture centroid to 0.8 degrees in
# azimuth. SUNMAP is now FILE-DERIVED GROUND TRUTH wherever it has an entry, and
# ground truth outranks a derivation - including this one.
# So the sprite's job is what it should always have been: the automatic
# per-level source for every level SUNMAP does NOT have an entry for.
# The SUNMAP line above was NOT touched.
RPCS3_REMIX_SUNSPRITE = A61A3CBECA257FE0
# GUARDED, because a sprite clamped to a screen edge is where the EDGE is, not
# where the sun is, and using it would swing the light as you turn. The quad
# must be fully inside the screen and must be small and roughly square. NDC
# units; 0.5 is a quarter of the screen per axis.
RPCS3_REMIX_SUNSPRITEMAXSPAN = 0.5
# 'Remix sunsprite:' lines carrying the NDC box, the derived direction and the
# reject reason. This is how "the sun never moves" gets answered without a
# guess: seen>0 with solved=0 means every sighting was REJECTED and the line
# says by which guard. 0 removes the lines.
RPCS3_REMIX_SUNSPRITECENSUS = 16
# *** 2026-08-17 ROUND 28: NEW KNOB. Stop the sun flipping when you look down. ***
# You reported: "if I look up enough the sun light is showing the proper direction
# but as I look down more, it changes to where it used to be." The log shows it
# happening, in two consecutive retargets:
#   Remix sun-retarget: travel=[0.3695 -0.8084 -0.4582] src=sprite  frame=4337
#   Remix sun-retarget: travel=[-0.1993 -0.3827 0.9021] moved=100.2 deg src=sky
#                                                                    frame=4339
# The sprite can only be solved while it is FULLY on screen, so it necessarily
# stops solving the moment you tilt far enough for the sun to leave the view -
# and ONE FRAME LATER the precedence chain drops to the sky-texture centroid,
# which on this level points ~100 degrees away. A sun that swings with head pitch
# is worse than a sun that is slightly wrong and stays put.
# This holds the last SOLVED direction for N frames. Nothing is recomputed while
# held. 300 frames is ~5 seconds - long enough to cover any amount of looking
# around, far short of a level. 'Remix sun-retarget:' prints src=spritehold rather
# than src=sprite while it is holding, so the two states are never confused.
# *** IT APPLIES TO THE SUNMAP RUNG TOO, and the round-28 review caught that before
# it shipped. m_sky_sun_frame is republished only while that area's DOME IS DRAWN,
# so holding only the sprite would INVERT the precedence: any two frames without a
# dome - indoors, looking down, a cutscene - would drop SUNMAP out of the chain and
# let the held sprite re-aim the light away from the file-derived ground truth that
# was authoritative one frame earlier. Both rungs now take THIS value, so they can
# never trade places because of it, and src=sunmaphold names the SUNMAP half.
# Bounded residue, deliberate: neither latch is cleared on a level change, so for up
# to 300 frames after a transition the previous level's direction can still be held.
# REVERT: set this to 0. That restores round 27's one-frame rule on BOTH rungs.
# 2026-08-17: RAISED 300 -> 999999. The user named the cause without knowing it:
# "I have to look up for the sun light to be properly aligned on the
# landcarrier and like ~10 seconds later it returns to its old position."
# 300 frames IS ~10 seconds at 30 fps. So the sprite solves correctly while it
# is on screen, the hold keeps that answer for 300 frames, the hold expires,
# and the light reverts to the stored SUNMAP/SUNDIR value - which on the
# carrier is wrong. The timing is not a coincidence, it is the knob.
# 999999 makes the hold effectively permanent: the last SOLVED sprite direction
# persists until a newer solve replaces it. A stale-but-correct sun beats a
# fresh-but-wrong one, and there is no scene in this game where the sun should
# move on its own.
# WATCH: the carrier's sunlight should stop snapping back after you look away.
# 'Remix sunsprite:' lastgood= should stay populated; src= should stop
# alternating between sprite and sunmap on that level.
# REVERT: 300.
RPCS3_REMIX_SUNSPRITEHOLD = 216000
