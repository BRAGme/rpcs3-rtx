#
# AND HERE IS THE ROOT CAUSE IN ONE SENTENCE, WHICH IS NOT A NEW KNOB AT ALL:
# ONE declaration (WORLDIDENTITYVP) drives TWO gates, and only one of them ever
# learned about WORLDIDMAXT=32.
#   * submit_subdraw (RemixGSRender.cpp ~:18404, `keep_resolved`) reads the draw's
#     discarded translation, sees 335 units, and correctly says "this is NOT a
#     world-identity draw, keep its real transform". That is round 24's carrier fix
#     and it is armed.
#   * per_draw_transform (~:15398, `capture_gauge_anchor(fused)`) has ALREADY run
#     for that same draw, earlier in the same submit, and installed that same
#     fused matrix as the whole frame's world gauge. Its only qualification is the
#     vp-hash list - it never looks at the translation at all.
# So the backend says "carrier-local" and "this is the world" about one draw, in
# one frame, for one reason. WORLDIDMAXT fixed the placement and left the gauge.
#
