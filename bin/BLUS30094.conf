# ===== ROUND 38: THE STALE DIVISOR. This is the round's headline fix. ==================
# A draw whose render source has not produced its identity-donor draw YET this frame is
# divided by LAST frame's anchor and then rendered with THIS frame's camera. The residual
# is D = V(t)*V(t-1)^-1, which for a point p is p -> eye + (p - eye)*dR: a rotation about
# the eye by ONE FRAME OF CAMERA TURN. So the displacement is
#     (distance from the eye) x (turn per frame)
# and the SAME defect reads as a millimetre wobble on the weapon, a hand-width jiggle on a
# dumpster, and metres on a light fixture across the room. Four separate user reports.
#
# MEASURED (round 38, bin\remix_dump.log, round-37 build 56A0A57DA51FF02E):
#   * 4000 CONSECUTIVE 'Remix vmbasis:' frames (frames 12311..16395, vtx=3649, one line per
#     frame). Express the recovered viewmodel 3x3 in the camera basis of frame t+s and
#     measure its frame-to-frame change. s=-1 is a STRICT minimum:
#         s    median   mean     p95
#        -3    0.2844   0.4819   1.7876
#        -2    0.3031   0.4676   1.4879
#        -1    0.2287   0.3750   1.2348   <- the gun is aligned to LAST frame's camera
#         0    0.2984   0.4655   1.5531
