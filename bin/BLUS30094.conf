# --- THE VIEWMODEL AXIS FLIP (the one thing to play-test this round) ------
# The arms and weapon RENDER now, but backwards, upside down and displaced
# up-and-to-the-right. Three symptoms, one operator: a sign error on a pair
# of axes. The runtime is NOT the cause - its viewmodel correction works out
# to a 1.257x widening about the eye with a POSITIVE determinant, so it
# cannot reverse an axis. The error is in the instance transform, and this
# flips it back, in the camera's own frame, about the eye.
#
#   bit0 (1) = negate the camera's RIGHT axis   -> mirrors left/right
#   bit1 (2) = negate the camera's UP axis      -> flips upside down
#   bit2 (4) = negate the camera's FORWARD axis -> puts it behind the eye
#
# 6 = up+forward = a 180 degree rotation about the camera's right axis. It
# is the first guess because it is the ONLY single operator that produces
# all three reported symptoms at once: upside down (up negated), backwards /
# facing away (forward negated), and displaced UP while staying on the same
# side of the screen (right preserved).
#
# The axes come from the orthonormal columns of the worldToView, so this is
# an exact reflection/rotation: a WRONG value cannot rescale, stretch or
# shear the viewmodel, only reorient it. Trying another value is one edit
# here and no rebuild. If 6 lands it upside down but facing the right way,
# try 4; if it is mirrored left-right instead, try 3; 2 is up-only.
# REVERT: 0 = exactly the round-18 orientation.
#
# ROUND 34 - DISARMED TO 0, DELIBERATELY, AND THIS IS STEP 1 OF TWO. Round
# 19 armed 6 to fix "mirrored, upside down and displaced". Round 34 measured
# that all three symptoms had one cause and it was NOT handedness: the
# viewmodel divide collapses to the identity by construction and parks the
# mesh at the world origin (see VMTAGONLY below). An orientation guess taken
# against a mesh that is 2129 units from where it should be tells you
# nothing, and applying 6 on top threw it a further 2.5 km.
#
# So: STEP 1 (this build) = VMTAGONLY=1 + VMBASISPIVOT=1 + VMBASIS=0. That
# restores the placement the world path already gets right and adds ONLY the
# VIEW_MODEL tag - ONE new variable, which is the discipline round 19's own
# note asked for. The census still emits, with pre==post, and cdist_pre= is
# the number to read.
# STEP 2 (only after step 1 is judged) = set this back to 6. With
# VMBASISPIVOT=1 that is an in-place 180-degree rotation about the camera's
# right axis: dbasis= goes non-zero and dcentre= must stay ~0. If the arms
# look right after step 1, do NOT do step 2.
#
# === ROUND 35 - 6 -> 5. THE OPERATOR WAS NEVER BROKEN; ONLY THE TARGET IS. ===
