#
#   vp                 rows   mean|t|    max|t|   rows |t|>32   max basis_delta
#   BD1C10DF5703E559    383     0.000     0.000             0           0.00000
#   7F02E76D7369D09E    289     0.000     0.000             0           0.00000
#   AD7CE9D672A0BF6B   4654   197.305  2123.000          3875           0.51289
#   0214281B9A7A412D    931   334.508  3909.850            96           1.98014
#   C1D482DCD1B03ED0     38   161.688   355.394            32           0.00022
#   D0B6A471BB2D463B     26   162.833   290.523            26           0.00022
#
# AD7CE9D672A0BF6B's raw vertex boxes are a FIXED 220x54x81 volume centred on its own
# origin (x [-122.8,101.0] y [-19.1,35.0] z [-45.6,35.5]) across the whole run - local
# coordinates for the land carrier. BD1C10DF's are world-sized (x [-1397.7,1146.3]).
# So the first two really do submit absolute world vertices and the override is free;
# AD7CE9... submits LOCAL vertices and the override deletes the carrier's placement,
# pinning the vehicle to the world origin while the player rides it away. That is the
# "it went away from the camera" / "we drove through it" report, and it is NOT a
# refusal: C1D482DCD1B03ED0 and AD7CE9D672A0BF6B each appear in 'Remix world-refused:'
# in 1 of ~176 windows in that run.
#
# WORLDIDCENSUS: slots on 'Remix worldid-census:', run-cumulative, last line = run total.
#   Census only, no behaviour. Read t=<=1/<=32/<=128/>128 per program.
RPCS3_REMIX_WORLDIDCENSUS = 12
# WORLDIDMAXT (whole world units) / WORLDIDMAXB (thousandths of 3x3 deviation): when
#   non-zero, an identity-forced draw whose discarded placement exceeds the threshold
#   KEEPS its resolved transform instead of being pinned to the origin. 0 = OFF = the
#   round-21 behaviour byte for byte. THIS IS THE ROUND-23 EXPERIMENT, LEFT UNARMED
#   deliberately - read the census first, then try WORLDIDMAXT=32.
#   REVERT: set both back to 0.
# 2026-08-16 ARMED AT 32 - THIS IS THE LAND-CARRIER FIX, AND IT IS THE ONE
# KNOB THIS SESSION MOST LIKELY TO MOVE THINGS THAT CURRENTLY LOOK RIGHT.
# WORLDIDENTITYVP forces transform = identity for named programs. For programs
# whose vertices are already ABSOLUTE world coordinates that is free. For
# LOCAL-SPACE models it pins them to the world origin, and that is what has
# been eating the carrier. Measured over 51,232 flips:
#   c1d482dcd1b03ed0  98.8% of draws displaced  tmax=355
#   ad7ce9d672a0bf6b  58.5% displaced           tmax=2123
#   d0b6a471bb2d463b   100% displaced           tmax=291
#   bd1c10df5703e559   0.0% displaced   <- absolute coords, identity is free
#   7f02e76d7369d09e   0.0% displaced   <- same
# And the clincher: ad7ce9d672a0bf6b and c1d482dcd1b03ed0 sit in ONE FIXED
# 220x54x81 box centred on their own origin for the WHOLE RUN while the
# vehicle drives hundreds of units. Local-space models. The translation being
# discarded IS the carrier's placement.
# 32 keeps the override for anything translating <= 32 units (the genuine
# world-identity draws, all measured at t<=1) and hands back the real
# transform to anything further out.
# *** BLAST RADIUS, READ THIS *** ad7ce9d672a0bf6b is the MAIN WORLD PROGRAM
# and 58.5% of its draws are displaced, so this does not only touch the
# carrier. If static scenery starts moving or landing in the wrong place,
# that is this knob and nothing else.
# WATCH: 'Remix worldid-census:' kept= going non-zero; the carrier's deck
# attaching to the vehicle instead of sitting at the world origin.
# REVERT: back to 0, which reproduces round 21 byte for byte.
# ALTERNATIVE if this helps the carrier but breaks scenery: put this back to 0
# and try WORLDIDMAXB=100 instead, which targets the 1.98 basis rotation
