# when the GEOMETRY stops changing while flips CONTINUE - which is what an in-game pause menu
# does - and NOT when flips stop: the budget resets only when the frame counter changes, so if
# flips stop the budget stays spent and the stale copy freezes instead of converging.
# With no live handle, or on the budgeted-fallback path, the draw RETURNS and is never
# submitted at all
# (the "walls and ceiling and floor go invisible at some angles"), and because it returns
# before the refusal accounting it leaves NO line in "Remix world-refused:" - which is
# exactly why searching the refusal families for the missing walls comes back empty.
# COST. The CPU term is measured: "Remix timing:" gives mesh_create=0.11 ms/frame over
# 20.02 creates/frame = 110/20.02 = 5.49 us per create (a frame-weighted pass over all 840
# windows gives 5.64 us; the per-window ms field is printed rounded, so the two numerators do
# not mix). ~4 extra creations/frame is therefore ~22 us = 0.08% of
# the measured 28.14 ms frame.
# BUT THE CPU TERM IS NOT THE ONE THAT MATTERS, AND 24 WAS THE WRONG STEP. Review caught it:
# every rebuild mints a new BLAS handle and the superseded one stays resident for MESHIDLE
# frames, and RPCS3_REMIX_MESHCAP=0 means there is no ceiling on the resident set. Resident
# BLAS count is the term this project has ALREADY proved is the FPS driver - the round-30
# block in this file records FPS sitting at 21-36 and degrading the longer you play until
# MESHIDLE=600 took mesh_live from 167k to ~5.7k. And peak=4 budget=4 on all 811 lines means
# the unions never converged, so this churn is STEADY STATE, not a transient.
# 4 -> 24 would have taken creates/frame from ~20 to ~39, roughly DOUBLING the resident set,
# i.e. shipping a probable BLAS regression inside a round whose item 3 is performance.
# 8 is the conservative step: it clears about half of the 15.2 deferrals/frame for ~+4
# creates/frame (+20%), and the new stale=/dropped= split says whether that is enough.
# WATCH THESE TOGETHER on the next run, and do not raise this again without them:
#   "Remix stats:"  meshes_live / created / destroyed      beside the frame rate
#   "Remix static-index:"  stale= dropped= peak= budget=
# If mesh_live climbs across the session, set a finite RPCS3_REMIX_MESHCAP before going higher.
# The source ceiling was ALSO 4, so this knob could only ever be turned DOWN; round 31 raised
# the clamp to 64 so the range exists at all.
# REVERT: set "RPCS3_REMIX_STATICINDEXBUDGET=4"
#
# ROUND 34 - RAISED 8 -> 32, AND ROUND 31's OBJECTION IS FORMALLY RETIRED.
# Round 31 blocked this on: "every rebuild mints a new BLAS handle and the
# superseded one stays resident for MESHIDLE frames, and MESHCAP=0 means
# there is no ceiling on the resident set." BOTH HALVES ARE FALSE, read from
# the deployed runtime's own source (dxvk-remix-numos3, rtx_accel_manager.cpp
# clean since 2026-06-04, and all eight BLAS anchor strings verified present
# in the deployed d3d9.dll):
#   * rtx.minPrimsInDynamicBLAS = 1000 with a STRICT '<' against
#     std::max(1000,100). Haze's unions measure 426.2 / 267.1 / 364.3
#     triangles across three logged runs, so EVERY union takes the merged
#     bucket and NONE has ever had its own BLAS. forceMergedBlas overrides
#     every clause of requestDynamicBlas, including "keep the one you have",
#     and hands any existing dynamic BLAS back to the pool.
#   * A new mesh HASH costs no BLAS at all. remixapi_CreateMesh allocates
#     HOST_VISIBLE|HOST_CACHED buffers and a map insert; a BLAS is only born
#     on the DRAW path. 86.9 submitted draws/frame against meshes_live=16133
#     means >99.4% of live handles hold no BLAS on any frame.
#   * The merged pool is recycled BY BUFFER SIZE, never by mesh hash, and
#     rtx.numFramesToKeepBLAS resolves to 1 here (enablePreviousTLAS is false:
#     upscalerType=DLSS + enableRayReconstruction=True, integrateIndirectMode
#     != ReSTIRGI), so a BLAS is destroyed 2 frames - ~70 ms - after its last
#     draw. MESHIDLE=600 governs HOST mesh handles, not BLAS memory.
# There is also no per-frame BLAS build budget, no bucket triangle cap, and
# scratch memory grows on demand; the only hard cap is RPCS3's own
# s_max_indices_per_mesh, and at 426 tris/union you are ~800x away from it.
#
# THE REAL COST, in order: merged-bucket FULL rebuilds on the GPU (transient,
# watch frame_ms); CPU 4.54 us/mesh-create = 0.74% of frame; ~20 KB host RAM
# per resident union. VRAM growth: none on this evidence.
#
# WHY 32 AND NOT 64: 32 leaves 'peak' readable. Demand in the plant burst was
# ~57 deferrals/frame against 8 slots (census lines 43->44: deferred +3202
# over rebuilds +324 = 9.88/rebuild, ~56 frames at the measured 27.9 fps), so
# 32 relieves ~56% of it. If the census comes back peak=32 budget=32, go
# straight to 64 - the whole 8->64 range is bounded at +0.25 ms of frame time.
#
# PRE-REGISTERED READING, all DIFFERENCED WITHIN THE NEW RUN (first to last
# census line - never against another run; the rate varies 1.03-4.34 across
# runs and raw cross-run values are meaningless):
#   SUCCESS 1: peak < 32.
#   SUCCESS 2: dropped/rebuild falls below 3.661 (this run's differenced
#              value; the widely-quoted "1.17" was an undifferenced 2020/1728
#              and its correct value is 1.145).
#   SUCCESS 3: resident/entries on the FINAL line rises above 63.8%
#              (257/403). resident/evicted/nomesh are POINT-IN-TIME GAUGES,
#              not cumulative counters - read the last line, never difference
#              them.
#   REGRESSION 1: frame_ms rises >1.0 ms above baseline while mesh_create
#              stays under 1.0 ms. That is the merged-bucket rebuild term.
#   REGRESSION 2: mesh_create / mesh_creates-per-frame rises above ~6 us.
#   RETIRED: round 32 registered "if dropped falls while evicted RISES the
#              raise is a regression". That clause is WRONG and is withdrawn.
#              'evicted' counts RPCS3-side handles reaped by MESHIDLE, and a
#              handle carries no BLAS unless drawn that frame. Rising evicted
#              with falling dropped is the EXPECTED shape. The regression
#              signal is frame_ms.
#
# THE OTHER LEVER, FLAGGED NOT TAKEN: one earlier run ended resident=12
# evicted=1168 - 1.0% of unions still held a live handle - and every evicted
# one needs a budget slot to come back, so 1168 unions at 8 slots/frame is
# >=146 frames and MESHIDLE re-evicts anything out of view for 10 s. That is
# a treadmill. A longer idle window scoped to static-index UNION meshes only
# would relieve the budget more cheaply, but it is a code change, not a knob.
#
# ===== ROUND 38: 64 WAS THE CLAMP CEILING, NOT A TUNING RESULT ==========================
# THE CLAMP TRAP, A THIRD TIME (round 31: this same knob, ceiling == default; round 33:
# SUNSPRITEHOLD armed 277x over its ceiling). RemixTransforms.cpp clamped this to
# [1, 64] and the launcher armed 64, so "peak=64 budget=64" on every big window was the
# CLAMP REPORTING ITSELF and the knob could only ever be turned DOWN. Ceiling raised to 512
# this round so a ladder exists at all.
# MEASURED, last run in bin\remix_dump.log:
#   entries=11498 triangles=2252883 rebuilds=12228 deferred=841 stale=10 dropped=831
#   peak=64 budget=64 resident=115 evicted=11376 nomesh=7
# Round 37 reported the budget "relieved" from peak=56 budget=64 dropped=0 - that reading
# came from a 388-ENTRY window. Every 11,498-entry window in the same log reads
# peak=64 budget=64 with dropped in the hundreds to thousands. Both readings are real; they
# are different scenes, and the small one is not the one the plant walls are in.
# THE REAL LIMITER IS NOT THE BUDGET, IT IS THE EVICTION POPULATION. resident=115 against
# entries=11498 means 98.9% of static-index entries hold a mesh_hash whose mesh the reaper
# has already freed, and this file's own accounting (RemixGSRender.cpp, above the
# resident/evicted/nomesh loop) states what that costs: "evicted = mesh_hash != 0 and NOT in
# m_meshes (the reaper took it -> next draw of this entry takes the `dropped` exit and
# renders nothing)". Both drop exits return BEFORE the refusal accounting, which is why the
# missing walls have never appeared in 'Remix world-refused:'.
# 128 is ONE conservative step (the ladder has been 4 -> 8 -> 32 -> 64), not a jump to the
# new ceiling: it doubles how many evicted entries can be rebuilt per frame.
# WATCH TOGETHER: 'Remix static-index:' peak= dropped= resident=, and 'Remix live:'
# mesh_live= / mesh_created= beside the frame rate. If peak= stops pinning at budget= and
# dropped= falls, the step worked. If mesh_live climbs across the session, stop here.
# LADDER if 128 helps but not enough: 256, then 512. If it does NOT help, the answer is the
# reaper, not the budget: MESHIDLE=600 (~20 s at 30 fps) is what evicts them, and the
# untaken lever is a longer idle window scoped to static-index UNION meshes only, which is
# a code change and NOT this knob.
# REVERT: set "RPCS3_REMIX_STATICINDEXBUDGET=64"
RPCS3_REMIX_STATICINDEXBUDGET = 512
