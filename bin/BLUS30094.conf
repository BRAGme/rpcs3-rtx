# ROUND 44b - THE ONE KNOB THAT CHANGES PIXELS. Replaces round 44's GAUGEDONORMAXT,
# which was PLAY-TESTED, REVERTED, and is now REMOVED FROM THE BUILD (the exe contains
# neither the wide string RPCS3_REMIX_GAUGEDONORMAXT nor gaugedonormaxt=%%u nor the
# counter gauge_donor_refused). Do not re-add it.
#
# WHY ROUND 44 FAILED, measured per flip, round 43 (56,381 flips) vs round 44 (17,583):
#     anchor_parked    0.0769 -> 0.1542      anchor_recap   0.0766 -> 0.0181
#     anchor_promoted  0.00032 -> 0.1360     (+42,512%%)
#     park outcomes    99.6%% recaptured / 0.4%% promoted  ->  11.8%% / 88.2%%
#     placements on last frame's anchor      19.22%% -> 37.09%%
# Refusing the off-origin donor parked it; promotion runs at FLIP, so the very donor that
# was refused got installed ONE FRAME LATE anyway. The gate did not remove the bad gauge,
# it DELAYED it - which is why the scene warped under camera turn: a one-frame-old gauge
# displaces everything by distance-from-eye x turn-per-frame.
# A GAUGE REMEDY MUST NEVER MAKE THE GAUGE LATER OR ABSENT.
#
# (My guard was also mis-specified twice, recorded so it is not repeated: I put a threshold
# on an ABSOLUTE cumulative counter and compared it across sessions of different length
# - gauge_absent 57,424 vs 295,391 is 3.27/flip vs 5.24/flip, it went DOWN - and even
# normalised it was the WRONG counter, because park->promote means the gauge was never
# absent, only late. anchor_promoted moved 425x and I had put no threshold on it.)
#
# WHAT GAUGEDONORBEST DOES INSTEAD (whole world units, 0 = OFF = round 43 byte for byte):
# the frame's FIRST donor installs immediately and unconditionally, exactly as today, so
# the gauge is never late and never absent. A LATER donor of the same frame may REPLACE it,
# but only when it is at least TWICE as close to the world origin (measured against the
# gauge held when the first donor arrived) and only when the installed one is beyond this
# threshold. First-draw-wins becomes best-draw-wins. Nothing is parked, promoted or refused,
# so anchor_promoted structurally CANNOT move - and that is the counter that caught round 44.
# 75.0%% of AD7CE9D672A0BF6B's 3,316,291 draws sit at |t| <= 1, so a good donor is usually
# in the frame; only the ORDER was wrong.
#
# WATCH ON "Remix live:":
#   gauge_donor_upgrade_avail - a better donor existed. Counted WHETHER OR NOT this knob is
#                               armed. If 0, the route is dead in the level you played.
#   gauge_donor_upgraded      - replacements that happened. avail>0 & upgraded=0 = knob off.
#   anchor_promoted           - MUST STAY NEAR ROUND 43's RATE (0.00032/flip). This knob
#                               cannot touch it; if it moves, something else did.
#   gauge_prev                - MUST NOT rise as a SHARE of gauge_used+gauge_prev+gauge_absent.
#                               Round 43 19.22%%, round 44 (bad) 37.09%%. Divide, do not compare
#                               raw totals: the sessions are different lengths.
# REFUTED IF: the scene TEARS within a frame - part of the world offset from the rest, props
# separating from the floor they stand on. That is the gauge changing mid-frame.
# REVERT: set "RPCS3_REMIX_GAUGEDONORBEST=0"   <- one line, round 43 bit-exactly.
RPCS3_REMIX_GAUGEDONORBEST = 32
