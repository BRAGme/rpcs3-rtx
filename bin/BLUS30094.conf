#     decorrelation helps". Restricted to the 328 frames where the camera turned >1 deg the
#     same shape holds and steepens (-1: 0.3484/0.4791, 0: 0.3879/0.6472, +1: 0.4882/0.9985).
#   * All 48 'Remix picked:'/'pick-deep:' lines for the family the user reports as jiggling
#     (vp=830d7d1b9681c475 fp=c61b0b9586dd67fb - the dumpsters, the lockers AND the
