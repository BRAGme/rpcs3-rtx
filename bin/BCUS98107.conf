# Resistance: Fall of Man (BCUS98107) -- per-game Remix profile
#
# Read once at boot, next to the executable. Environment wins over anything here
# (env_already_set), so a launcher `set RPCS3_REMIX_X=...` still overrides a line below.
#
# ==============================================================================================
# WHAT IS ACTUALLY WRONG, 2026-09-12, and it is NOT what the symptom looks like
# ==============================================================================================
# The first read of this title said "nothing renders". That was wrong, and it was wrong because
# the two measurements available at the time were both taken while the game was NOT in-world:
#
#   * menu phase   (~frame 2,900): draws = 2,800 screen + 7,295 immediate, submitted=0,
#                                  tex_created=1, world_applied=0. Every draw is 2D or refused.
#   * cutscene     (~frame 6,400): draws=211,020 submitted=3,792 (1.8%),
#                                  world_applied=3,792 world_refused=78,335,
#                                  skin_unrecognised=61,051 (all skin_unrec_indexed),
#                                  cam_resolved=219 cam_fallback=6,190, arch=fused.
#
# A 42 s capture of the same build IN-WORLD (rpcs3__2026-09-12__10-01-01) settles it:
# **geometry, camera, the 2D UI and emissive effects are all correct.** Buildings, muzzle
# smoke, red particle sprays and the "Press R1 to fire." overlay all render in the right place
# and at the right size, 15-30 fps. What the capture does NOT show is any *lit* surface: the
# only pixels above black are the ones that emit their own light.
#
# So the headline defect on this title is LIGHTING, not geometry, not camera, not textures.
# The cutscene-phase refusal counters above are a real second-order debt (see the bottom of
# this file) but they are not what makes the picture black.
#
# Nothing below has been A/B'd on this title yet -- the emulator was in use by another title
# when this file was written, so every value here is either a default restated for the record,
# an instrument, or a first estimate that says so. Treat the first run with this file as the
# measurement, not as the fix.

# ==============================================================================================
# 1. LIGHT -- the actual problem
# ==============================================================================================
# The default distant sun (SUNDIR / SUNRADIANCE=3) is already on and is evidently not reaching
# these surfaces. Before tuning it, find out whether this title has fixtures the derived path
# can see: GUESTLIGHTLUM / GUESTLIGHTMAXEXT are the two terms of the `Remix light-candidate:`
# census and NOTHING acts on them unless GUESTLIGHTAUTO is set, so this is a free read.
#
# Read `Remix light-candidate:` out of bin\remix_dump.log after a run and paste the fixture
# albedos into GUESTLIGHTALBEDO below. That is the one required key of the derived path.
RPCS3_REMIX_GUESTLIGHTLUM=0.7
RPCS3_REMIX_GUESTLIGHTMAXEXT=6

# The derived path is deliberately NOT armed yet. It needs a fixture list, and inventing one
# lights doors and sheet metal (the documented Haze failure). Fill this in from the census
# above, then the next three lines start mattering.
# RPCS3_REMIX_GUESTLIGHTALBEDO=
# RPCS3_REMIX_GUESTLIGHTRADIANCE=150
# RPCS3_REMIX_GUESTLIGHTTRACK=1

# The authored path, ARMED 2026-09-12. Note the loader runs independently of AUTHOREDLIGHTS:
# setting only AUTHOREDLIGHTLEVEL loads and reports the file while submitting nothing, which
# is how the load is proved on its own if a run ever needs to separate the two.
RPCS3_REMIX_AUTHOREDLIGHTDIR=resistance_lights
#
# EXTRACTED 2026-09-12. tools/resistance/extract_lights.py reads game.psarc directly
# (stock PSARC 1.2; 3,985 manifest lines + 1 == 3,986 TOC entries, exact) and pulls the
# analytic list out of ps3levelmain.dat section 0x8800, 128-byte records, in the IGHW
# ("Insomniac Games Hunk Wad") container. bin\resistance_lights\ now holds 41 .lights
# files, 373 records, 0 malformed, every N count matching.
#
# HOW THE PARSE WAS PROVEN (each of these could have failed and did not):
#   * section walk: offset+length over all 62 sections of level20 lands exactly on the
#     u32 stored at file offset 0x10 (0x019A3150).
#   * omni: field 0x20 == bounding-sphere radius AND sphere centre == position, 320/321.
#   * spot: |sphereCentre - position| == sphere radius AND the stored unit direction ==
#     normalize(centre - position), 52/52.
#   * spot trig: cos(f0x28)==f0x30, sin==f0x34, cos(f0x2C)==f0x38, cos^2+sin^2==1, 52/52
#     to 2e-5 -- which is what proves 0x28 is a HALF-angle in radians.
#   * 371/373 lights fall inside the level's own static-instance bbox (section 0x9300),
#     i.e. the lights and the geometry are in one world frame.
#
# READ THIS BEFORE EXPECTING A LIT LEVEL. 373 lights over 41 levels is ~9 per level,
# against Eat Lead's ~242. That is not a partial extraction -- it is what the game ships.
# ps3levellightstream.dat is ZERO BYTES on all 41 levels and the class table names
# IGG_LightVol / BakedLightGrid / BakedLightDb: **Resistance's scene lighting is BAKED.**
# The 373 analytic lights are the dynamic/special set only. The bulk lives in
#   * the baked light grid / DB, and
#   * section 0x8A00, 166 LIGHT VOLUMES: region ambient plus TWO directional RGBA8
#     colours over an oriented box (dumped to bin\resistance_lights\lightvols.txt).
# For a path tracer the 0x8A00 volumes are the more useful artefact -- a per-region sun
# plus ambient is exactly what this backend can submit -- and there is no loader for them
# yet. That is the next piece of work, not this file.
#
# Frame is Y-up, RAW, no axis fix applied. AUTHOREDLIGHTAUTO cannot work here: Resistance
# has no USRDIR/Maps/<16HEX>.map for the sys_fs hook to key on, so the M ids in the files
# are synthetic and the level must be named by hand. level20 is the lowest-numbered level.
RPCS3_REMIX_AUTHOREDLIGHTLEVEL=level20
RPCS3_REMIX_AUTHOREDLIGHTS=1
# Both spaces on one line in one frame -- the only thing that makes the placement residual
# solvable offline. At AUTHOREDLIGHTAXIS=0 (identity) world must equal file byte for byte.
RPCS3_REMIX_AUTHOREDLIGHTDUMP=8

# Sun census. Resistance's opening is overcast daylight and the capture above is night-lit by
# fires, so whether this title even HAS a sun card is an open question. This names every draw
# shaped like one without aiming anything.
RPCS3_REMIX_SUNCARDCENSUS=1

# ==============================================================================================
# 2. THE MAIN MENU (the radio) -- ROOT-CAUSED, from the ucode, no run required
# ==============================================================================================
# The menu is one full-screen textured quad. Its texture is 2933FBEEEB546174, 1280x720,
# route=2d reason=ortho, blend=1 (SRC_ALPHA/INV_SRC_ALPHA), box=[0 0]..[1920 1009], drawn by
#     vp=02e793a801950511  fp=d12a627750b8218a
# and the census reported `uvout=0 uvslot=c37 uvval=0` with `Remix uiwrap: u=[0..0] v=[0..0]`.
# Every vertex of a 1280x720 image samples texel (0,0): a flat block, which is what is on screen.
#
# bin\remix_ucode\02E793A801950511.vp was already captured and says exactly why:
#
#      5: VEC MUL r1.zw <- v2(normal).xxxy, c[36].xxxy
#      6: VEC MUL r1.xy <- v2(normal).xyxx, c[37].xyxx
#      7: VEC ADD r1.y  <- r1.xxxx, r1.yyyy
#      8: VEC ADD r1.x  <- r1.zzzz, r1.wwww
#     13: VEC ADD o[7](TEX0).xy <- r1.xyxx, c[38].xyxx   END
#
#   i.e.  u = v2.x*c36.x + v2.y*c36.y + c38.x
#         v = v2.x*c37.x + v2.y*c37.y + c38.y
#
# a full 2x2 texture matrix plus a bias, with the texcoords on ATTR2 (the normal slot).
#
# TWO independent things break on it, and they must not be confused:
#
#  (a) resolve_texcoord_affine() walks a LANE PAIR and requires ONE instruction to write both
#      lanes at every hop. Instructions 7 and 8 write r1.y and r1.x SEPARATELY, so the walk
#      fails at hop 1 with `affine:split-write` and the 2x2 is never resolved. This is the UV
#      twin of the position-path defect RPCS3_REMIX_SPLITROWS already fixes for RC1.
#
#  (b) uv_affine_form cannot express this transform even if the walk succeeded. Its row_slot[r]
#      is indexed by ATTRIBUTE COMPONENT (one constant carries a0's contribution to both u and
#      v). Resistance stores it the other way round -- one constant per OUTPUT LANE, c36 for u
#      and c37 for v. Expressing it needs a transpose flag or a per-lane row slot on the form.
#      Verified by hand against the apply arithmetic at RemixGSRender.cpp:21403-21412.
#
# The fallback then names c37 as a scalar scale and reads c37.x, which is 0 for a v-row (the
# identity mapping written as a full 2x2 is c36=(1,0), c37=(0,1) -- and c37.x is then exactly
# the 0 the census printed). `ui_uv_ucode=0/0` says the scalar branch did not actually fire
# either, which leaves ONE thing still to measure before any code is written:
#
#   IS have_uv FALSE? resolve_texcoord_attribute's wide scan admits ATTR2 only when
#   vertex_arrays_info[2].size() == 2. If this title declares ATTR2 as a 3- or 4-component
#   normal slot, no texcoord attribute is found at all and the UVs default to (0,0) -- which
#   reproduces the measurement exactly, WITHOUT (a) or (b) being the proximate cause.
#
# The instrument that settles it in one menu run is below. Read `Remix uv-fail:` and the
# uv_absent / uv_layout / uv_memory / uv_nonfinite counters on `Remix stats:` while sitting in
# the main menu.
RPCS3_REMIX_UVRANGECENSUS=1
RPCS3_REMIX_NOTEXCENSUS=1
# Force-capture the menu's FRAGMENT program: UCODESTOREFP only writes programs the backend
# refuses, and this one is not refused, so it has never been dumped. Needed to know what the
# menu draw does with the sampled texel.
RPCS3_REMIX_UCODESTOREFPHASH=d12a627750b8218a
#
# SETTLED 2026-09-12, run pid=33780, by the uvattr/uvstat fields added this round:
#     Remix ui-route: ... albedo=2933FBEEEB546174 ... uvout=0 uvslot=c37 uvval=0
#                     uvattr=0x02 uvstat=ok
#     Remix vtxattr:  vp=02e793a801950511 ... a0=f3[len=70.71] a2=f2
#     ui_uv_ucode=2691/0
# The attribute is found (ATTR2, float2, decodes ok) and the SCALAR fallback then applies
# c37.x = 0 to both lanes. The "have_uv is false" branch is REFUTED. Fixed by
# RPCS3_REMIX_UIUVSCALEGUARD (default on), which brings the 2D path's '> 0' test into line
# with the 3D path's. Set it to 0 to get the flat block back as the one-relaunch A/B.
#
# Capture what the 1280x720 surface actually CONTAINS. The user reports the menu is not a
# static image -- it has a wave filter on the selection and green/red buttons that flicker
# -- so this surface is a live-composited render target, and whether the radio is IN it
# decides whether the remaining work is UV or routing. Writes
# bin\remix_ui_<content>_1280x720.bmp once. UIDUMPVP alone does nothing; the budget is
# UIDUMP. REMOVE BOTH once the BMP exists -- each dumped frame builds ~8 KB of log string.
RPCS3_REMIX_UIDUMP=8
RPCS3_REMIX_UIDUMPVP=02e793a801950511

# ----------------------------------------------------------------------------------------------
# ROUND 84b -- THE FLICKERING TILED WEDGES, and the census named the mechanism outright
# ----------------------------------------------------------------------------------------------
# The zero-scale guard fixed the flat block and exposed the other half. The WHOLE menu -- radio
# panel, button plates, icons, the 128x1 scanline strip -- is drawn by ONE vertex program,
# 02e793a801950511, and on one element the named slot is ANIMATED. Measured in a single run,
# 'Remix ui-route:' rows for albedo 8FD8D8EE29E9F392 (64x64):
#     uvval = -1.25766 -3.00307 -4.61873 -6.02054 -7.72017 -7.93331 -9.26976 -9.76344 -9.90694
#             +6.69961
# That is the menu's WAVE EFFECT. c37 is not a scale at all -- it is the v ROW of a rotating
# texture matrix -- and the scalar fallback was multiplying BOTH lanes by it. Both lanes times
# -9.9 is exactly the tiled striped wedges that were on screen.
#
# RPCS3_REMIX_UIUVSPLITREFUSE (default on) refuses the scalar scale whenever the affine walk
# failed with 'affine:split-write', i.e. whenever the program demonstrably states a 2x2 the form
# cannot express. VERIFIED after: u=[0..1] v=[0..1] on 8FD8D8EE29E9F392 AND on the radio panel,
# uv_tiled=0, ui_uv_ucode=0/2463 (nothing applies a scalar scale on this title any more).
#
# WHAT THIS DOES NOT DO, stated rather than left to be found: the wave ANIMATION is not
# reproduced. Those elements now sample with the raw attribute, i.e. the identity mapping, which
# is static. Reproducing it needs the transposed form -- uv_affine_form indexes row_slot[] by
# ATTRIBUTE COMPONENT and this program stores one constant per OUTPUT LANE -- which is a
# 'rows_by_lane' flag, a unit-scale path, and a split-lane resolver in resolve_texcoord_affine.
# That is the next round, and it is the same defect family as RPCS3_REMIX_SPLITROWS solves in the
# POSITION path for RC1.

# ==============================================================================================
# 6. THE IN-WORLD BACKLOG, MEASURED 2026-09-12 in-game (frame 3,522)
# ==============================================================================================
#   draws=5,705,566  submitted=71,115 (1.2%)
#   skin_unrecognised = 1,644,801  ALL skin_unrec_indexed  -> the missing NPCs and WEAPONS.
#       Indexed-constant (bone palette) programs are refused and counted, so skinned meshes are
#       ABSENT rather than misplaced. Same shape as the Haze palette: match_mad_chain wants four
