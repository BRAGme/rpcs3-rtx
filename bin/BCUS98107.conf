# ==============================================================================================
# 5. PERFORMANCE
# ==============================================================================================
# The capture runs 15-30 fps. `audit` was 16.7-21.5 ms of a ~50 ms frame on the runs measured
# here -- pure diagnostics, nothing is refused on its results. DRAWAUDIT=0 is the free lever,
# but it is deliberately NOT set yet: the sky/extent rules and VTXREFUSE read the audit's
# results, and the sky census is still an instrument on this title. Turn it off once the sky is
# identified, not before.
# RPCS3_REMIX_DRAWAUDIT=0

# ==============================================================================================
# ROUND 85 (2026-09-12) -- THE ONE DEFECT BEHIND ~99% OF THIS TITLE'S REFUSALS
# ==============================================================================================
# The user asked for skinning. Skinning was a SYMPTOM. The `Remix layother:` census reported
# `arch=unknown areason=no-chain note=no matrix chain into HPOS groups=0` on ALL 314 censused
# vertex programs -- skinned and unskinned alike -- and the single biggest one,
# 320b56b1e42d633b (211,174 refused draws, more than the entire skinned population), is not
# skinned at all (indexed=0).
#
# Every Insomniac vertex program writes the W row of its view-projection TWO LANES AT A TIME and
# reads one lane back:
#     6: DP4 r0.z  <- r1, c[34]   mask=0x4
#     7: DP4 r0.y  <- r1, c[33]   mask=0x2
#     8: DP4 r0.x  <- r1, c[32]   mask=0x1
#     9: DP4 r1.xy <- r1, c[35]   mask=0x3   <- TWO LANES
#    18: MOV r0.w  <- r1.yyyy
#    19: MOV o[0](HPOS).xyzw <- r0
# c[32..35] is an ordinary consecutive view-projection with one detour. TWO separate tests
# demanded that DP4 write exactly one lane -- one in repair_split_rows, one in match_dp4_chain --
# and either one alone discards the W row. DP4/DPH compute a SCALAR and splat it across the whole
# write mask (GLSLCommon.cpp:527-530, '$Ty(dot($0,$1))'), so the lane count carries no
# information. RPCS3_REMIX_SPLITDOTLANES (default on) relaxes BOTH; 0 restores both.
#
# Fixing only the first was INERT, and the instrument is what proved it rather than another
# guess: 'splitrep=127 splitwide=127' (every repair that fired was a widened multi-lane
# acceptance) against 'groups=0' on all 314 programs -- the repair handed match_dp4_chain a good
# fourth row and the second test threw it back.
#
# MEASURED, same level, before and after:
#     before   draws=347,650  submitted=4,902   (1.4%)   world_refused=112,349   layother=314
#     after    draws= 67,001  submitted=19,701  (29.4%)  world_refused=    828   layother=  0
# world_refused fell 99.3%, skin_unrec_indexed fell from 1,644,801 to ~3,685, and NOT ONE program
# now reports 'no matrix chain into HPOS'.
#
# WHAT IS NEXT, in measured order:
#   cam_resolved=55 cam_fallback=781 -- the camera now dominates. It was invisible before because
#     nothing was being placed at all.
#   skin_unrec_indexed ~3,685 and vp_indexed_unmatched=32 -- the residual skinning, now a small
#     population instead of the whole scene. 21 dumped programs split 9 rigid (ARL off v0.w,
#     three indexed DP4 rows at c[A0+31..33] + a c19 bias -- match_indexed_affine's exact shape)
#     against 10 four-bone blends (ARL off rN.wzxy, three indexed MAD accumulators).
#   The lighting question in section 1 is UNCHANGED and still the reason the scene is dark.

# ==============================================================================================
# ROUND 86 (2026-09-12) -- free camera, framerate, and the first data-driven lighting
# ==============================================================================================

# --- THE FREE CAMERA'S LEFT/RIGHT, and it is a KNOWN one-knob fix ------------------------------
# User report: "in free cam left is right and right is left". That is RPCS3_REMIX_CAMXFLIP's
# documented symptom verbatim. try_split_once does not RECOVER the view, it CONSTRUCTS it, and
# closes the basis with 'right = up_hint x forward' -- a cross-product order that assumes a
# LEFT-handed guest world. Resistance's is right-handed, so the constructed row 0 points screen
# LEFT. RtCamera::getRight() is viewToWorld[0].xyz() verbatim, and the runtime's free camera
# strafes along it AND ties yaw to it, so a reversed row 0 reverses left/right for movement and
# turning and nothing else -- exactly as reported.
#
# THE IMAGE CANNOT CHANGE. '1' inserts S = diag(-1,1,1,1) between the submitted V and P, so
# V' P' = V S S P = VP exactly (verified bit-identical in f32, max|diff| = 0). Acceptance: the
# dev menu should read 'Projection Handedness: Left-handed / Overall Handedness: RIGHT-handed'
# (the screenshot currently shows Left/Left), and cam_xmirror == cam_xflip == cam_resolved.
RPCS3_REMIX_CAMXFLIP=1

# --- THE FRAMERATE, and it is free -------------------------------------------------------------
# MEASURED this session: frame_ms=79.5, draw=76.5, of which audit=25.3 -- a THIRD of the frame in
# pure diagnostics that nothing branches on. Taken now because the thing it was being held for
# (the sky census) has not produced a usable answer on this title anyway: 16ACCF24DDC3CF70 reads
# 'ARMED dome=8 other=0 agree=1' at frame 800 and 'reject:mixed' at 803, and every candidate
# carries wext=inf. Set this back to 1 for any session where the sky census is the instrument.
RPCS3_REMIX_DRAWAUDIT=0

# --- LIGHTING, driven by the level's OWN light volumes ------------------------------------------
# The authored analytic lights are working and their placement is EXACT -- the dump reads
# file=[53.9006 2.06736 -26.2267] world=[same] render=[same] with identity_l1=0.000977, i.e. the
# file's frame IS the render frame and AUTHOREDLIGHTAXIS=0 (identity) is correct. That question is
# settled; do not sweep the axis dial on this title.
#
# But nine lights at f0=0.5 / f1=9m cannot light a level, because Resistance is BAKED (see
# section 1). The scene lighting is the 166 region volumes in section 0x8A00, and level20's
# largest -- half-extent 17.5 x 3.5 x 14.5, the outdoor street environment -- reads:
#     ambient=334557  key=B5A6A6  fill=D4D1CC  scale=1
#     dir0=-0.0347084,0.999391,0.003648      (the direction TO the key light: almost straight up)
# which is exactly right for "YORK, ENGLAND / 11 JULY 1951 / 06:13 GMT" under overcast.
#
# SUNDIR is the direction the light TRAVELS, so it is dir0 NEGATED.
RPCS3_REMIX_SUNDIR=0.612289,-0.788011,-0.0643541
RPCS3_REMIX_SUNRADIANCE=1.54

# Ambient mode 1 = prefer a value recovered from the fragment ucode, fall back to the literal
# below. The literal is the volume's authored ambient 0x334557 = (0.200, 0.271, 0.341).
RPCS3_REMIX_AMBIENT=1
#
# THE ONE NUMBER HERE THAT IS NOT FROM THE FILE. AMBIENTRGB components ARE the irradiance, and
# the authored 0-1 colour is a ratio, not a level -- nothing in the container says what absolute
# irradiance 0x334557 meant to Insomniac's tone mapper. This is the authored colour times a gain
# of 8, which against the default AMBIENTSCALE of 1/pi lands radiance at ~(0.51 0.69 0.87)
# against a sun of 3 -- a plausible overcast sky/sun ratio and nothing more. It is the first knob
# to move if the result is too flat or too dark, and it is a CALIBRATION, not a measurement.
RPCS3_REMIX_AMBIENTRGB=1.25,1.25,1.34

# ROUND 92 -- THE EXPOSURE WAS MINE, AND THE RATIO WAS WRONG BY ~3x.
# Measured live: 'Remix ambient: ... -> radiance=[0.26738 0.26738 0.286479]' against
# 'Remix sun: ... radiance=[3 3 3]'. That is an ambient:sun of 0.089, and the level's own
# header rig authors 0.26 -- ambient luminance 0.2126*0.42 + 0.7152*0.42 + 0.0722*0.45 = 0.422
# against key luminance 0.2126*1.87 + 0.7152*1.59 + 0.0722*1.24 = 1.624. So the shadows were
# roughly three times too dark relative to the key, which is exactly the blown-white ground
# and crushed-black shadow in the 23:30 capture.
#
# Both values below are now the authored rig at UNIT GAIN, with no free parameter left:
#   SUNRADIANCE = key luminance x scale = 1.624 * 0.95 = 1.54
#   AMBIENTRGB  = authored ambient x pi x scale = (0.42,0.42,0.45) * 3.1416 * 0.95
# AMBIENTSCALE stays at its 1/pi default, which is the documented irradiance->radiance
# conversion, so the submitted ambient radiance is 1.25/pi = 0.398 against a sun of 1.54 --
# a ratio of 0.258, i.e. the file's 0.26 reproduced rather than guessed at.
#
# The sun also drops 3 -> 1.54. The old 3 was the backend DEFAULT, never a measurement, and it
# is 1.9x the authored key. That is what was clipping the ground to white.

# CAUGHT BY THE CENSUS, and it would have aimed the whole ambient sideways. The first armed run
# printed 'Remix ambient: ... up=[0 0 1]'. AMBIENTUP defaults to +Z because the title it was
# designed for had a Z-UP render space (the same derivation RPCS3_REMIX_ZUP rests on) -- and
# Resistance's render space is Y-UP, established three independent ways this session:
#   * the light volumes' key direction is Y-dominant, dir0 = (-0.0347084, 0.999391, 0.003648);
#   * tools/resistance/extract_lights.py read the container as Y-up, right-handed, metres;
#   * the authored-light dump maps file -> world -> render as the IDENTITY (identity_l1=0.00098),
#     so the file's Y-up frame IS the render frame.
# The ambient is submitted as two wide distant lobes about this axis, so a wrong 'up' does not
# dim the scene -- it lights the wrong hemisphere of it.
RPCS3_REMIX_AMBIENTUP=0,1,0

# ROUND 93 -- WHY VERTICAL SURFACES ARE BLACK WHILE THE GROUND IS LIT.
# The 01:09 capture shows bright ground slabs with NPCs as pure black silhouettes and the
# left-hand buildings unlit. That is geometric, not a texture fault, and the live ambient line
# names it: 'up=[0 1 0] cone=150 deg ... two wide distant lobes, NOT a dome light'.
#
# Two opposed lobes about +Y at 150 degrees is a 75-degree HALF-angle each. A wall or a
# character has a normal roughly 90 degrees off +/-Y, so it sits in the 15-degree DEAD BAND
# between the two lobes and receives no ambient at all. The sun compounds it: travel is
# (0.6123, -0.788, -0.06435), i.e. almost straight down, so it lights up-facing ground and
# rakes past anything vertical. Up-facing surfaces get both contributions; vertical surfaces
# get neither. 180 is the clamp ceiling (a 90-degree half-angle) and is exactly the value at
# which the two lobes meet at the equator and the band closes.
#
# THIS IS A PATCH, NOT THE FIX. The level's own header rig authors a FILL light that exists
# precisely to light vertical surfaces -- fill = (0.80, 0.80, 0.80) along
# fillDir = (0.930548, 0.34202, -0.13078), which is mostly HORIZONTAL. Nothing submits it:
# the backend has one distant sun and this conf aims it at the KEY. Submitting the fill as a
# second distant light is the correct answer and needs code, not a knob.
RPCS3_REMIX_AMBIENTCONE=180

# --- STILL OPEN, deliberately not guessed -------------------------------------------------------
# THE SKY. skyhash_dome=10821 and skyclassify_dome=1380, so domes ARE being seen, but no albedo
# holds: 16ACCF24DDC3CF70 goes ARMED (agree=1.0) and then reject:mixed three frames later, and
# every candidate carries wext=2.36e+38 / inf. An infinite world extent is the signature of
# geometry projected to infinity OR of a decode fault, and those are not the same thing. Naming a
# hash in SKYEMISSIVE / SUNSKY on that evidence would be a guess. The census stays armed.
#
# THE PER-REGION LIGHTING. The values above are ONE volume's, applied to the whole level. The
# correct mechanism is a loader that picks the volume containing the eye each frame and submits
# its ambient plus two directional colours -- 166 of them are already extracted to
# bin\resistance_lights\lightvols.txt. That is real work and is not this round.

# ==============================================================================================
# ROUND 90 -- the lighting values are now the LEVEL'S OWN, not a guess
# ==============================================================================================
# The 0x8A00 container was re-read and the orientation that was missing turned out to be in
# plain sight: +0x40..+0x7F is a single 4x4 ROW-VECTOR transform, and the first pass had read
# only its w column (the half extents) and row 3 (the centre), never the 3x3. Verified hard:
# rows orthonormal with det=+1 on 166/166; 99 records are exactly identity and the other 67 are
# WITHOUT EXCEPTION a pure yaw about world +Y whose angle is an exact multiple of 0.5 degrees
# (-105.0 .. +45.5), as are all 498 half extents. Noise or a mis-parse cannot produce that.
# Row-vector convention confirmed empirically against section 0x9300: instances inside a box
# carry +volumeYaw on 532 against -volumeYaw on 19, and transposing inverts that 28:1 result.
# 3691 structural checks, 0 failures. Extractor: tools/resistance/extract_lightvols.py;
# data: bin\resistance_lights\level<NN>.lightvols (41 files).
#
# AND RECORD 0 IS NOT A VOLUME -- it is the level's DEFAULT RIG, the one to use when the camera
# is inside no volume, and it carries its colours as LINEAR FLOATS rather than the volumes'
# RGBA8. level20's header reads:
#     ambient = 0.42 0.42 0.45      key = 1.87 1.59 1.24 (HDR, >1)     fill = 0.80 0.80 0.80
#     keyDir  = -0.612289 0.788011 0.0643541            scale = 0.95
#
# So the two values below are no longer estimates:
#   SUNDIR    = keyDir NEGATED (SUNDIR is the direction light TRAVELS).  This replaces the
#               near-vertical vector taken from volume 0, which was one region's rig standing in
#               for the level.
#   AMBIENTRGB = the header ambient x2.  The x8 gain that used to sit here was compensating for
#               an RGBA8 ratio; these are linear photometric values and need no such fudge. The
#               remaining x2 is a single overall exposure gain chosen so the key's luminance
#               (0.2126*1.87 + 0.7152*1.59 + 0.0722*1.24 = 1.62, x scale 0.95 = 1.54) lands near
#               SUNRADIANCE's existing 3 -- i.e. ONE number for the whole rig instead of one per
#               channel, and the authored ambient:key RATIO is preserved exactly.
#
# STILL OPEN, and stated because it decides how the volumes get used: the photometric meaning of
# 'scale', and whether a volume's LDR key/fill are ABSOLUTE or MODULATE the header's HDR pair.
# The header key reaches 2.0, which an 8-bit volume colour cannot express, so they are not the
# same quantity -- but which way round is unproven. The per-region loader must not assume.
#
# THE PER-REGION LOADER, specified and not yet built. Containment is exact:
#     d = eye - centre;  local = (dot(d,row0), dot(d,row1), dot(d,row2));  inside iff |local|<=ext
# (equivalently rotate x/z by -yaw, since y is always axis-aligned). Of 508 intra-level volume
# pairs, 48 overlap and 7 are full nestings, and no point is ever in more than two volumes -- so
# scan all volumes (<=14 per level) and keep the match with the SMALLEST 8*ex*ey*ez. That
# resolves all 7 nested pairs to the inner room; "last match wins" gets only 6 of 7. No match at
# all -> use the D line above.
