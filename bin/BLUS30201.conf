# --- THE WHITE GAMEPLAY SCREEN: camera identity thrash ------------------------------------------
# Measured 2026-09-12, and it is now the dominant failure by a wide margin. `Remix world-fail:`
# reads **nocam=93637** against attr_offset=20318 out of world_refused=112095 -- note attr_offset
# has FALLEN from 139,089 to 20,318, which is the billboard replay above doing its job, leaving the
# camera as the whole problem.
#
# THE ELECTION IS THRASHING. Consecutive latches in gameplay elect FOUR different programs in
# rotation -- f7fa79c9f2466421, 63be122828a6b877, f1e164af57003605, f7fa79c9f2466421,
# 63be122828a6b877 -- with candidates 3/8/4/1/4 and contested=1834, and the elected eye jumping
# [-0.73 1.41 0.14] -> [-1.08 1.47 -2.52] -> [-1.26 1.36 0.72] -> [0.95 1.01 -1.35] ->
# [10.80 2.38 9.84]. Since world placement is `chain x reference^-1`, a reference that changes
# identity every few frames re-bases the entire scene each time.
#
# WHY THE CUTSCENE WORKS AND GAMEPLAY DOES NOT is consistent with this: the interior is small and
# near the origin, while SR2's city geometry sits around 1600 units out (measured directly from the
# billboard replay's raw anchors), so the same reference error that is invisible in a 10-unit room
# throws the whole city off screen.
#
# CAMSTICKY gives the incumbent's own cluster rank over any other regardless of votes, which is
# exactly the hysteresis this needs. **Its doc block requires CAMRELATCHTOL BELOW 0.8**, and the
# default IS 0.8, so the two MUST move together -- with the relatch still taking props, "own
# cluster" would be measured against a prop-relatched view and the hysteresis would lock onto the
# prop. That is a documented dependency, not two independent guesses, which is why this one test
# changes two values.
#
# SCORE IT ON, in order: `world_refused_nocam` (must fall from 93637), then `cam_sticky_kept` (an
# own cluster elected over one with strictly more votes) against `cam_sticky_lost` (no own cluster,
# so the vote moved the identity anyway), then whether cam-elect stops rotating between programs.
# A real camera cut still goes through the existing 12-frame confirm, so this should not stick to a
# dead camera through a scene change.
# **RESULT: NEGATIVE, 2026-09-12, and the counters say exactly why.** `cam_sticky_kept=9` against
# `cam_sticky_lost=134`, with world_refused_nocam barely moving (93637 -> 91306). "lost" means the
# frame had clusters but NO OWN CLUSTER -- the incumbent's cluster is simply gone by the next frame.
# Hysteresis cannot hold onto something that is not there, and a camera elected from NPCs that walk
# in and out of frame is precisely that case. Reverted rather than left armed, because a knob that
# fires 9 times in a session is noise in the config and its CAMRELATCHTOL dependency is a real
# behaviour change carried for nothing.
#
# WHAT THE SHADER TABLE SAYS THE FIX SHOULD BE. `cgbdis.py params sr2-skin1_mc` reads
# `V_MVP_matrix c[4]`, `V_eye_pos c[10]`, **`V_bones c[52]`**. V_MVP_matrix is at c[4] in EVERY
# SR2 shader, so the projection is not what differs -- a skinned program's position chain is
# `bones x pos x MVP`, so the chain walk drags the bone palette into the reference. The election
# needs to prefer programs with no bone palette, or be pinned outright with CAMLOCK once the right
# program is named (see UIDUMPVP above).
# RPCS3_REMIX_CAMSTICKY=1
# RPCS3_REMIX_CAMRELATCHTOL=0.5

# NEXT A/B, 2026-09-12. 63BE is the non-skinned 960x640 world program that repeatedly emits a
# usable gameplay camera while F7FA/F1E1 are bone-palette programs whose witnesses move with
