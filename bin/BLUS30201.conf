# --- UNTEXTURED DRAWS: give them the colour the SHADER writes, not flat grey -------------------
# Measured 2026-09-12, and it reframes "some textures don't even have a hash id or options to tweak
# upon": **there is no texture to tag.** Of the `class=no-unit` rows in the notex census, 44 of 56
# read **`sampled=0x0`** -- the fragment program samples no texture whatsoever. These draws are not
# ones whose texture we failed to find; they are ones that never had a texture. Their colour lives
# in the fragment program's own constants, and notexmat=1 currently paints them RMXNOTEX mid-grey,
# which in a dark room reads black.
#
# TEXBUDGET DID WORK, and is kept -- `class=budget` has disappeared from the census entirely and
# tex_deferred is 0 -- but it was a minor exit: tex_none is still 340955 of 1790071. The bulk is
# this, not the upload allowance.
#
# BIT 0 ONLY, deliberately. The knob is a bitmask: 1 = round-62 inline literal colour, 2 = round-63
# lerp endpoint, 4 = round-67 texel tint. Only bit 0 applies to a draw that samples nothing. **Bit 2
# is actively wrong to add here** -- 36 of 41 terminal lerps in this engine family are the k=0.204
# FOG family and every endpoint is already in [0,1], so enabling it paints fog colour as albedo.
# Bit 4 needs a bound texture to multiply and so cannot fire on sampled=0x0 at all.
#
# The known aliasing hazard is already guarded: fp_hash_constants_enabled() defaults TRUE, mixing
# the ucode bytes (constants included) into the fingerprint cache key, so a program can no longer be
