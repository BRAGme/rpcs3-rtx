# --- TRANSPARENT PROPS AND BLACK-AT-SOME-ANGLES: an ADDITIVE SECOND PASS -----------------------
# The user Ctrl+clicked four surfaces; three landed on the same thing, which is as close to ground
# truth as this project gets:
#     vp=63be122828a6b877 fp=0d483fc2dd6769f4 albedo=8BD2748AEC7E0A1A
#     blend=1  bsrc=1 bdst=1 bop=32774   alpha=255..255  depth_write=0  depth_test=1  atest=1
#     material=1 albedo_unit=0 extent=20.48 areason=ok
# `bsrc=1 bdst=1` is ONE/ONE -- **pure additive** -- with depth writes OFF and a CONSTANT full
# alpha. An additive surface never occludes anything; it only adds. That is "props are transparent"
# and, wherever there is nothing bright behind it, "the scene is black at some angles". One
# mechanism, both symptoms, and it is why NOALPHA=1 looked negative earlier: at that point the
# scrolling post-process overlay was still on top and masked the difference.
#
# WHAT THIS ACTUALLY IS: SR2 renders lighting in multiple passes -- the shader set is full of
# `V_light_pos` / `V_light_color` / `V_light_atten` and a `V_Light_MapSampler`, and 63be122828a6b877
# is the single biggest submitter at 692,348 draws. A base pass plus additive light passes over the
# SAME geometry is correct for a rasteriser and meaningless to a path tracer, which gets each pass
# as an independent instance and stacks them.
#
# HIDEPAIR is the right instrument because it keys on (vp, fp) TOGETHER. 63be122828a6b877 cannot be
# skipped wholesale -- it draws the base pass too, under a different fragment program -- so a
# vp-only knob like SKIPVP would take the geometry with it. Mode 1 = HIDDEN category.
# EXPECTED IF THE READING IS RIGHT: props go solid, the black angles fill in, and the base pass is
# still there. IF EVERYTHING VANISHES the reading is wrong -- 0d483fc2dd6769f4 would be the only
# pass rather than a second one -- and this comes straight back out. A base pass being ADDITIVE is
# what makes that unlikely.
# **RESULT: FIRED HARD, CHANGED NOTHING. Reverted.** `cat_hidepair=773679` -- the gate matched and
# set REMIXAPI_INSTANCE_CATEGORY_BIT_HIDDEN on three-quarters of a million draws -- and the props
# were still transparent. Two readings and I cannot yet separate them:
#   (a) the HIDDEN instance category is inert on this remixapi backend, which would match the known
#       pattern of Remix features that live in the D3D9 raster path being silent no-ops here, or
#   (b) the additive pass is not what is visible, and the base pass is additive too.
# Either way, leaving 773k draws flagged hidden for no measured benefit is a standing risk to real
# geometry, so it comes out. Distinguishing (a) from (b) needs a control: hide a program that IS
# unambiguously visible and see whether it disappears.
# RPCS3_REMIX_HIDEPAIRVP=63BE122828A6B877
# RPCS3_REMIX_HIDEPAIRFP=0D483FC2DD6769F4
# RPCS3_REMIX_HIDEPAIRMODE=1


# --- "RMXNOTEX", and it is OURS, not the game's -------------------------------------------------
# The user picked `524D584E4F544558` off a black full-screen surface. That is ASCII **"RMXNOTEX"**:
# RemixGSRender.cpp:7837 `constexpr u64 s_neutral_hash = 0x524D584E4F544558ull`, the backend's own
# synthetic mid-grey (albedo 0.5 linear) attached by notex_material_enabled() to any draw that
# reaches submission with no albedo material at all. It is not a texture the game shipped; it is
# the stand-in for "we do not know this surface's colour", and in a dark room mid-grey reads black.
#
# AND IT IS NOT A FRINGE CASE: `tex_none=360602` against `tex_bound=1790071` -- **20% of submitted
# draws carry no texture** -- with `notex_mat_applied=333731`.
#
# THIS PROBABLY REFRAMES "GROUND AND CEILING MISSING". They may not be missing at all; they may be
# untextured, wearing the grey stand-in, and going black. The test is one Ctrl+click on the floor:
# if it reports albedo=524D584E4F544558 the surface is present and the fault is material
# resolution, not geometry.
#
# THE REAL FIX IS NOW UNBLOCKED and it is a code change, not a knob. `tex_albedo_guess` is 99.6% of
# elections picking "lowest bound unit" blind, and docs/remix/cgbdis.py can now read each shader's
# sampler table by NAME and UNIT -- Diffuse_MapSampler, Normal_MapSampler, Specular_MapSampler,
# V_Light_MapSampler, Decal_Map_1/2Sampler. Electing albedo from the named diffuse sampler instead
# of guessing is the round that should retire both tex_none and the wrong-unit elections together.

# Diagnostic, free, no render change: force the top world submitter's microcode to disk so it can
