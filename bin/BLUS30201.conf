# --- CHARACTER CLOTHING UVs: the TWO-SCALE texcoord family -------------------------------------
# Armed 2026-09-14 from a user Ctrl+click on the clothing, and this one is read straight off the
# ucode rather than inferred. Two picks on the same draw, side by side:
#     sr2-hair2  (fp=171f81465c511d72)  uv_ucode=1  uv_scale=affineall(0.000976562)
#                                       u=[0.0078..0.9893]   <- 1/1024, FULL 0..1 range
#     bb-cloth2  (fp=aa5a2b9d9b56a2b5)  uv_ucode=0  uv_scale=fixed(0.000244141)
#                                       u=[0.0032..0.2471]   <- 1/4096, only a QUARTER of the sheet
# A quarter-range UV lands on one flat region of the texture, which is exactly the uniform electric
# blue on the paramedics' scrubs.
#
# WHY THE UCODE READ FAILED, from bin/remix_ucode/397985466920148B.vp (bb-cloth2's own vp):
#      2: MUL r6.zw          <- v8(tc0).xxxy, c[467].zzzz
#     32: MUL o[7](TEX0).xy  <- r6.zwzz,      c[24].xyxx
# TEX0.xy = tc0 * c[467].z * c[24].xy -- TWO scale constants, through a lane hop (written to .zw,
# read back as .zwzz). uv_affine_form carried only ONE scale slot, so reduce_moved_attribute()'s
# MUL arm refuses the family as "affine:mul-two-scales" and the draw drops to the 1/4096 heuristic.
#
# UVSCALE2 is that family's resolver and its doc block describes this exact symptom in advance:
# "that unit is read today from the heuristic attribute 1 with the fixed 1/4096 - the right
# magnitude by coincidence from the wrong attribute". It hands back the second constant in
# scale2_slot/scale2_component and apply_texcoords() multiplies by both IN THE ORDER THE UCODE DOES.
# Both constants are read live per draw; nothing is baked.
# SCORE ON `uv_affine_scale2` going non-zero, and on the cloth pick reporting uv_ucode=1 with a
# u range that reaches ~1.0 instead of stopping at 0.25.
RPCS3_REMIX_UVSCALE2=1


