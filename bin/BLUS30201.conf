# --- THE GREEN: Remix's emissive blend translation ---------------------------------------------
# Measured 2026-09-12 from the backend's own blend census, and it is the same root cause that was
# confirmed on the PC build of this game (see the SR2 PC notes: "unchecking Emissive Blend
# Translation stops the roads/walls/foliage lighting up").
#
# What SR2 submits, from `grep blend_pairs log/RPCS3.log` (Vulkan factor enums, op 0 = ADD):
#     1/1/0 = ONE / ONE            5,415,888   58.9%   <-- pure ADDITIVE
#     1/7/0 = ONE / ONE_MINUS_SRC_ALPHA  2,616,575   28.5%
#     6/1/0 = SRC_ALPHA / ONE      1,243,514   13.5%
#     6/7/0 = SRC_ALPHA / ONE_MINUS_SRC_ALPHA  20,555   0.2%
# with blend_translucent=9,092,983 of blend_chained=9,177,240 -- i.e. **99.1% of submitted draws
# have alpha blending enabled on the guest side**, and nearly six in ten of those are additive.
# blend_unmapped=0 and blend_rtopaque=0, so every pair translated and the runtime rejected none.
#
# `rtx.enableEmissiveBlendModeTranslation` defaults to **true** and is documented in the runtime as
# "Treat incoming semi/additive D3D blend modes as emissive." Neither bin/rtx.conf nor bin/user.conf
# sets it, so it has been at that default all along. Applied to a scene where 99% of draws are
# blended it turns essentially the whole world emissive: everything glows, nothing occludes, layers
# stack additively. That is the green cutscene, the see-through geometry and the washed-out NPCs in
# one mechanism, and it is why the Albedo debug view looked perfectly correct -- the defect is
# entirely downstream of albedo.
#
# Compounding it: blend_astranded=6,529,261 against blend_arescued=31,869, so 99.5% of those
# blended draws submit opacity as a CONSTANT 1.0 rather than the guest's per-vertex alpha (the same
# "alpha cards" defect measured on GRAW2). Every additive layer therefore contributes at full
# strength. Fixing the translation is the big lever; the stranded alpha is a separate project.
#
# KNOWN RISK, recorded on the PC build: neon signs and genuine effects draw additive and RELY on
# this translation to emit. If the neon dies with this off, the documented alternative is to put the
# translation back ON and cap it instead -- keep rtx.enableEmissiveBlendEmissiveOverride=True and
# pull rtx.emissiveBlendOverrideEmissiveIntensity down from its 0.2 default toward 0.05:
#     RPCS3_REMIX_RTXSET=rtx.emissiveBlendOverrideEmissiveIntensity=0.05
RPCS3_REMIX_RTXSET=rtx.enableEmissiveBlendModeTranslation=False
#
# SINGLE-SIDED SURFACES. Current cull_from_rsx() uses env OR the saved GUI setting,
# so CULL=0 does not override `Use RSX Backface Culling: true` in the game config.
# 2026-09-12: user-tested PID 33796 with that saved setting false; floor and ceiling
# were still missing. Restored true for subsequent runs; do not repeat this toggle
# as the floor fix. Missing surfaces still need transform/material diagnosis.
# RPCS3_REMIX_CULL=1
#
# SUN. The values above are Eat Lead's. SR2's own sun has not been recovered from its ucode yet.
# RPCS3_REMIX_SUNDIR=x,y,z
# RPCS3_REMIX_SUNRADIANCE=3
#
# CHANNEL REMAP -- ARMED 2026-09-12, see the block at the end of this file.
#
# IN-WORLD FRAME TIME is NOT the compositor -- it is mesh churn. In-world cost reads
#     frames=15 frame_ms=136.33 draw=141.73
# with mesh_created=71359 / mesh_destroyed=50760 over 6066 flips, and the churn census names six
# programs, led by dd99a1fe15d91aba at 51.5 creates/frame and b21803879233e34b at 12.0.
# dd99a1fe15d91aba is a 4-vertex, no-texture, alpha-blended, alpha-tested passthrough quad -- a
# per-sprite draw handed to remixapi as a brand-new mesh every frame. Batching or skipping that
# family is the in-world perf project; no knob covers it today.

#
# DRAWAUDIT=0 IS *NOT* A FREE 23 ms HERE -- checked before reaching for it. The timing line shows
# audit=23.60 ms/frame (19% of the frame), and the knob is clean (`env_u32(...,1) != 0`, no g_cfg
# disjunction). But RemixGSRender.cpp:33096 states the condition in so many words: skipping the
# audit also drops the world-extent REFUSAL, which is a gate and not a census, so "on a title where
# wext_refused is non-zero, DRAWAUDIT=0 WOULD change the picture -- check that counter before using
# the knob anywhere else." SR2 reads **wext_refused=9789**. Eat Lead, where the knob was cleared for
# use, read 0 for a whole 83,019-flip session. So on SR2 this is a behaviour change that happens to
# be fast, and it has to be A/B'd as a picture change, not banked as a perf win. It may well be
# WANTED -- see the missing-geometry note below -- but not silently.
#
# MISSING GEOMETRY IS MEASURED AND IT IS THE CAMERA, not culling and not extents alone. Run 2:
#     world_refused=20852, of which world_refused_nocam=17406 (83%), plus wext_refused=9789
# against world_refused_nocam=721 in run 1. Both refusal sites bump nocam on `!m_active_camera.valid`
# (RemixGSRender.cpp:31078 and :32036), so 83% of the lost geometry is lost on frames with no valid
# camera. The election census says why: `Remix cam-elect:` reports contested=1915 with candidates
# 1, 5 and 3 on consecutive latches and the elected eye jumping [0.83 1.35 -1.14] -> [0.56 4.26 0.12]
# -> [-0.73 1.41 0.14]. That IS the user-visible "cameras found flicker on/off". The stabiliser
# knobs are all still off (camsticky=0 camtrack=0 camrebase=0) and were only ever measured as inert
# on GRAW2, where the election had no correct answer; SR2 has a real moving camera, so they are
# worth a run here. Start with CAMSTICKY, one at a time, reading world_refused_nocam as the score.
# RPCS3_REMIX_CAMSTICKY=1
#
# THE FAR PLANE IS INFINITE, AND THE LOG'S far= FIELD LIES ABOUT IT. cam-basis alternates
# far=1.2585e+06 and far=0 on consecutive frames with p22=+1 throughout. That is a PRINT artifact,
# not a per-frame change: the census computes far = p32/(1 - p22) and prints 0 whenever
# |1 - p22| <= 1e-12 (RemixGSRender.cpp:11188), so float noise in p22 around exactly 1 flips it
# between a huge number and the guard. p22 = 1 IS an infinite far-plane projection, which is why
# the dev menu's own Near/Far row reads 0.2 / 1.276e36. Do not chase the alternation; do consider
# whether an unbounded far breaks anything downstream that wants a finite range (volumetrics
# froxels, depth heuristics).

#
# NEVER SET RPCS3_REMIX_CAMSANITY=1 ON THIS TITLE. Run 3 reads cam_insane=5786 of 9410 flips, and
# every census line says reason=nodepth. The gate treats P[2][2] == 1 as the structural signature
# of an ortho/2D matrix (RemixGSRender.cpp:10690) -- but SR2's REAL perspective camera has an
# infinite far plane, so p22 == 1 on every frame and every camera trips it. Only camsanity=0 (the
# default) keeps this a census instead of a refusal; at 1 it takes the no-camera path every frame
# and the world goes empty.
#
# THE CHAIN WALKER IS LOSING 83% OF THE REFUSED GEOMETRY (run 3, and this is the backend project).
# world_refused=167413, of which attr_offset=139089 vs nocam=25774. The census reads
#     fail=attr_offset note=innermost operand is not an attribute
# with areason=mad-src0-not-input and areason=sca-xyz. The two dominant programs, read with
# docs/remix/vpdis.py:
#   b21803879233e34b  116609 refusals, vtx=45  -- camera-facing billboard:
#       r1 = v0(pos) + c[11]*r2.z ; r0 = c[12]*r2.w + r1 ; DP4 o[0](HPOS).xyzw <- r0, c[4..7]
#   1c83e55adc63c1d8   18738 refusals, vtx=361 -- camera-facing ribbon/trail: normalises v2(normal)
#       and v0(pos)-c[10], two cross products to build a basis, then
#       r0 = v0(pos) + basis1*w ; r0 = basis2*v9(tc1).x + r0 ; same four DP4s.
# Both are ALREADY IN WORLD SPACE and carry NO object->world matrix -- the only matrix in the chain
# is c[4..7], the view-projection; c[10] is the camera position and c[11]/c[12] its right/up axes.
# The walker refuses because it follows one MAD operand and lands on a CONSTANT (c[12], or a
# cross-product temp) while v0(pos) sits in the other arm. Identical shape to GRAW2's
# repair_split_rows defect: find the input operand instead of assuming its position, and treat a
# chain whose only matrix is the VP as world space with an identity world matrix.
# NOT the cause of the empty gameplay screen, though: vptally_sub shows the main world program
# 63be122828a6b877 submitting 939254 draws and worldbox rows put geometry 1.7-7.5 units from the
# camera, yet Geometry Hash renders almost entirely black in gameplay. Still open.


# --- THE REMAINING COLOUR CAST: the RSX per-texture channel remap ------------------------------
# ARMED 2026-09-12, immediately after the emissive-blend fix above turned the flat green wash back
# into a properly shaded room with a green CAST over it.
#
# WHAT THE PICTURE SAYS, and it is the reason this is the next test rather than a lighting one. In
# the first correctly-shaded cutscene frame most of the room reads green, but the wood panel at
# bottom-left is still tan and the ceiling light strip is still near-white. A global multiplicative
# tint -- a green light, a volumetric medium, a post-process grade -- cannot do that: it would drag
# every surface the same way. A cast that is wrong on MOST surfaces and right on SOME is a
# PER-TEXTURE defect.
#
# WHAT THE COUNTERS SAY: `tex_remap_seen=368 tex_remap_applied=0`. That counter is deliberately
# raised for every decodable texture whose NV4097_SET_TEXTURE_CONTROL1 is non-identity whether or
# not the knob is on, precisely so that "seen>0 with applied=0" reads as "the knob is off" rather
# than "there is nothing to fix" (RemixGSRender.cpp:36876). So 368 SR2 textures ship a channel
# remap that texture_cache::decode() is throwing away. The same defect got 239 of 542 textures
# wrong in another title on this backend.
#
# The knob is safe to trust: `read_env_u32(L"RPCS3_REMIX_TEXREMAP", 0) != 0`, documented in
# RemixTextures.cpp:258 as a real off rather than the `env || g_cfg` silent no-op that has bitten
# SMOOTHNORMALS and TEXBUDGET. B8 textures are excluded from the rewrite by design -- the B8 arm
# hand-writes (v,v,v,0xFF), which is itself a stand-in spread, and remapping that would apply the
# spread twice.
#
# **CONFIRMED 2026-09-12: THIS IS THE FIX FOR THE GREEN.** With it armed the infirmary renders
# with white walls, dark grey monitors and correctly TAN wood on the bed headboards and counter
# fronts. Keep it.
#
# It is narrow and that is not a contradiction: `tex_remap_applied` only reached **3** against
# `tex_remap_seen=143`, because the other 140 are B8 and B8 is excluded by design. Three textures
# sounds like nothing until you notice they are the WALL, FLOOR and CEILING of an interior, which
# between them cover most of every frame. That is exactly the "wrong on most surfaces, right on
# some" signature the untouched tan wood panel pointed at before the test was run.
#
# THE REAL REMAINING DEBT THIS EXPOSES: 140 of 143 non-identity remaps are on B8 textures and are
# still being thrown away. The decoder's B8 arm hand-writes (v,v,v,0xFF), a stand-in spread that
# stands in for this very register, and RemixTextures.cpp:857 already says so -- "the honest fix
# for B8 is to replace its hardcoded spread, which is not this round". On SR2 that is 97% of the
# affected population, so it is worth a round of its own.
RPCS3_REMIX_TEXREMAP=1


# --- THE MILKY VEIL: is the whole world being submitted as translucent? -------------------------
# DIAGNOSTIC, NOT A SHIPPING SETTING. Armed 2026-09-12 after the remap above cleared the green and
# left a washed-out, low-contrast, grainy "bad TV signal" look over an otherwise correct room.
#
# THE MEASUREMENT THAT POINTS HERE. From `grep blend_pairs log/RPCS3.log` (Vulkan factor enums):
#     ONE / ONE                      58.9%   <- pure ADDITIVE
#     ONE / ONE_MINUS_SRC_ALPHA      28.5%
#     SRC_ALPHA / ONE                13.5%
#     SRC_ALPHA / ONE_MINUS_SRC_ALPHA 0.2%
# with blend_translucent = 9,092,983 of blend_chained = 9,177,240, i.e. **99.1% of submitted draws
# carry alphaBlendEnabled**, and blend_astranded = 1,292,444 against blend_arescued = 23,953, so
# 98% of them also submit opacity as a CONSTANT. A path tracer handed a room built entirely out of
# additive, full-strength translucent surfaces produces precisely this: light accumulating through
# stacked layers, low contrast, and noise that the denoiser cannot resolve.
#
# WHY THIS IS PROBABLY A BACKEND BUG RATHER THAN THE GAME. ONE/ONE is pure additive. A game that
# genuinely drew 59% of its world additively would have looked double-bright on a real PS3. The
# guard is `!alpha_state_disabled() && rsx::method_registers.blend_enabled()`, which is the correct
# register -- so either SR2 really does leave NV4097_SET_BLEND_ENABLE on for everything and
# controls the result some other way, or the factor pair is being read from a stale register. This
# knob separates those: it skips the whole blend-state block so every draw submits OPAQUE.
#
# WHAT TO EXPECT: if the veil lifts, the blend stream is the cause and the fix is to find out why
# blending reads as enabled on 99% of draws. Genuinely transparent things -- glass, smoke, effect
# cards -- will go solid while this is on, so do NOT leave it armed; it answers one question.
# Accessor is `env_flag(...) || g_cfg`, so 1 turns it on reliably; setting 0 here would be the
# silent no-op shape, use a comment to disable instead.
#
# **RESULT: NEGATIVE, 2026-09-12. The veil survived with every draw submitted opaque**, so the
# blend stream is EXONERATED and this is disarmed. Retiring it matters rather than just being tidy:
# left on it would solidify glass, smoke and effect cards for no benefit. The 99.1%-blended draw
# stream and the 98% stranded opacity are both still real and still worth their own round -- they
# are simply not what the user was looking at.
# RPCS3_REMIX_NOALPHA=1


# --- THE "BAD TV SIGNAL": SR2's own framebuffer post-process, composited over the ray-traced image
# The user's own description is what cracked it -- "it MOVES in different directions, only in
# cutscenes". Fog does not move and blending does not scroll, so neither of the two earlier
# hypotheses could have been right.
#
# THE MEASUREMENT. One program, `vp=aa4b1cda938b5b0d fp=486b1cddc72c1ff6`, draws a 128x128 texture
# through the 2D compositor with wrap=1/1 and a UV range that ADVANCES MONOTONICALLY:
#     frame 6600  u=[0 .. 191.40201]
#     frame 6720  u=[0 .. 199.40201]
#     frame 6840  u=[0 .. 207.40201]
#     frame 6960  u=[0 .. 215.40201]
# exactly +8.0 every 120 frames, with coverage climbing 25395 -> 32563. A 128x128 sheet tiled ~200
# times across the frame and scrolling is a film-grain / distortion overlay, and it is the ONLY
# heavily tiled 2D draw in the whole run -- every other uiwrap row is a bounded HUD box. SR2's
# shader manifest names the family outright: `data\shaders\framebuf\` holds `tint_desat`,
# `hdr_tint_desat`, `distortion_tint_desat`, `fb_road_heat_distortion`, `fullscreen_quad`.
#
# WHY REFUSING IT IS CORRECT, not a cosmetic hack. These are FRAMEBUFFER post-process passes: on
# real hardware they read and rewrite the finished raster image. A path tracer has no such image to
# hand the compositor, so all the compositor can do is paint the overlay ON TOP of the ray-traced
# result -- which is exactly what UIREFUSEFP's own doc block describes: "A named fragment program is
# never UI: a full-frame background or wall the compositor could only paint OVER the finished Remix
# image." Refusing it restores the path-traced image the effect was meant to modulate.
#
# The refusal is placed after the census row and the BMP dump but before the triangle loop and
# before ++ui_draws, so a refused draw is still fully described in the log and ui_draws keeps
# meaning "rasterised". Score it on `ui_refused_fp` going non-zero.
# The list takes up to 8 fragment-program hashes; add the other framebuf passes here as they are
# identified, rather than reaching for NOUI which would drop the HUD as well.
# WIDENED 2026-09-12 on the user's own hypothesis -- "I wonder if the game's post processing fx is
# what is making the scene white in game". Measured and correct: FIVE distinct programs draw
# full-screen (1280x673) quads through the 2D compositor, and only one of them had been refused.
# Counting the full-screen rows only:
#     7288ec696e58cc45  57   <- THE HUD. minimap, health ring, objective text. DO NOT REFUSE.
#     486b1cddc72c1ff6  35   <- the scrolling grain overlay, already refused, cutscene fix
