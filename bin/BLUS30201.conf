# --- WHY 20% OF DRAWS HAVE NO TEXTURE: the upload budget --------------------------------------
# The albedo TABLE above does not explain tex_none, and measuring it said so plainly: the diffuse
# sampler is on unit 0 in 369 of 399 shader entries (92.5%), which is exactly what the existing
# "lowest bound unit" rule already picks. Picking the WRONG unit and having NO unit are different
# failures, and tex_none is the second one.
#
# The `Remix notex:` census names its own exits, and `class=budget` is one of the top three. That
# class means the draw had an eligible texture unit and the frame had already spent its texture
# UPLOAD allowance, so the draw submitted with no material and wore the RMXNOTEX grey.
# The global config sets **`Texture Uploads Per Frame: 8`**. Eight. A camera turn in an open-world
# city exposes far more than eight new materials at once, and every one over the line renders
# untextured until some later frame lets it through -- which is exactly the reported symptom of
# ground and ceiling that are present but grey/black.
#
# **TRAP, and it has bitten this project before: `RPCS3_REMIX_TEXBUDGET=0` IS A SILENT NO-OP.**
# texture_budget() reads `read_env_u32(name, 0)` and then `env ? env : g_cfg...`, so 0 from the
# environment is indistinguishable from unset and falls through to the config's 8. Only the CONFIG
# value 0 reaches the unlimited branch. From here the only way to raise it is a large number.
# **BACKED OFF 100000 -> 64 on 2026-09-12: the unbounded value HANGS THE RENDER THREAD.**
# Reproducible trigger from the user: answering the play-or-skip-tutorial prompt freezes the picture
# while AMBIENT AUDIO KEEPS PLAYING. That signature is the whole diagnosis -- the known rpcs3 lv2
# scheduler deadlock suspends every PPU thread and would take the audio with it, so a live PPU and a
# dead picture means the RSX/render thread is stuck, not the guest.
# The tutorial prompt is a LEVEL TRANSITION, where the game swaps its entire texture set at once.
# The per-frame budget exists to SPREAD that work across frames; setting it to 100000 removed the
# bound, so the backend tries to create every new texture inside one frame.
# 64 is 8x the shipped default -- enough that `class=budget` stayed out of the notex census when the
# bound was lifted -- while still capping the per-frame work that caused the hang. If budget exits
# reappear, raise it stepwise (128, 256); do NOT go unbounded again.
# **REVERTED TO STOCK 2026-09-14.** 64 did NOT stop the freeze -- the user still hit a hang mid
# cutscene on the 09-13 build -- so my raised budget is not buying anything and is an uncontrolled
# variable sitting on top of someone else's work. Back to the shipped 8 so the freeze can be
# attributed without my knob in the way. If `class=budget` reappears in the notex census, raise it
# STEPWISE (16, 32, 64) and never unbounded: 100000 hung the GPU driver hard enough that the process
# could not be killed even with taskkill /F.
# RPCS3_REMIX_TEXBUDGET=64

