# Saints Row 2 (BLUS30201) -- per-game Remix profile
#
# CREATED 2026-09-12 from the first SR2 run (pid 33612, build Sep 12 2026 02:58:30).
# Until this file existed the log said
#     Remix game-config: none for BLUS30201
# which means SR2 inherited the GLOBAL bin/config/config.yml Remix block plus the shared
# bin/rtx.conf and bin/user.conf -- i.e. Eat Lead's / GRAW2's profile. The visible consequence,
# straight out of the dump:
#     Remix sun: created travel=[-0.3509 -0.9023 -0.2506] radiance=[3 3 3]
# That is Eat Lead's sun vector, and with authored=0/0 submitted=0 lights and
# rtx.fallbackLightMode = 0 it is the ONLY light in the SR2 scene. Restart RPCS3 after edits;
# these are read once at init.


# --- world orientation -------------------------------------------------------------------------
# SR2 submits REAL world space, not a baked view (unlike GRAW2). Measured from cam-basis over the
# character-creator frames:
#     right=[-0.9552 +0.0000 +0.2959] up=[-0.0142 +0.9989 -0.0457] fwd=[-0.2955 -0.0479 -0.9541]
#     pos=[-0.4354 +1.6395 +0.8904] -> [-0.3459 +1.6422 +0.9443]   (the eye MOVES between frames)
# The camera's up is +Y to within 3 degrees and the eye translates in world space, so the
# submitted space is Y-up. Both bin/rtx.conf and bin/user.conf carry `rtx.zUp = True` for GRAW2
# (whose submitted space really is +Z-up because its view is baked), and that value is wrong here.
# zUp cannot reorient geometry -- it drives sky, atmosphere, volumetrics, the terrain baker and
# the free camera -- so this is a sky/fog correctness fix, not an image flip. 0=leave, 1=True, 2=False.
RPCS3_REMIX_ZUP=2


# --- 2D compositor throughput ------------------------------------------------------------------
# The menus are compositor-bound, measured, not argued. In the main-menu phase:
#     Remix cost: frames=49 frame_ms=41.18 draw=37.55 ... other=37.00
# i.e. the per-draw handler IS the frame. ui_draws was 98231 of 112063 submitted draws (88%), and
# ui_uv had reached 28.56e9 addressing events over 5293 flips = ~2.7M texels rasterized on the CPU
# per frame -- SR2 layers full-screen ink/parchment quads, and uiwrap shows them TILED
# (u=[0..87.4] v=[0..94.2] on a 128x128 sheet, uv_tiled=89043), so every one costs a full screen.
# ui_fast_raster_mode() defaults to 0 (the reference bounding-box loop). 1 = the round-61 span
# rasterizer; every uiwrap row in this title reports shrink=100 and the draws are flat-tinted, so
# they satisfy the fast path's guard. Set 2 instead to run span+reference and compare whole
# buffers if the menu ever looks different from this build's reference output.
RPCS3_REMIX_UIFASTRASTER=1


# ROUND 2 (2026-09-12, second run). UIFASTRASTER=1 is ARMED AND WORKING -- ui_fast=5042/136, i.e.
# 97% of compositor triangles now take the span path -- but it bought almost nothing: the menu
# window went draw=37.55 -> 37.19 ms. The reason is in the full timing line in log/RPCS3.log, which
# is where this should have been read the first time:
#     draw=126.08 (ui=73.32 ui_raster=66.65 mesh_create=0.25 tex_bind=0.13 uv=6.20
#                  draw_instance=0.38 decode=14.63 audit=23.60 hash=0.80 xform=0.32 rest=6.46)
# ui_raster is 53% of the whole frame and mesh_create is 0.25 ms, so the compositor is the cost and
# mesh churn is NOT (67 creates/frame is real and cheap). The span path is already as fast as the
# inner loop gets; what is left is the PIXEL COUNT -- ui_px/frame=6632591 against a 1920x1080
# buffer is 3.2 full screens of CPU rasterization every frame.
# SR2's own clip is 960x640 (mainclip=960x640 maxclip=960x640), so a 1920-wide composite is 2x
# oversampled and nothing in this title is authored fine enough to use it. 1280 is the conservative
# step -- it still matches what rpcs3's own overlays are authored at (a virtual 1280x720) and is
# 2.25x cheaper; expect ui_raster ~66.6 -> ~30 ms. Drop to 960 for another ~13 ms once the overlays
# are confirmed to still read cleanly. compositor_max_width() is NOT the `env || g_cfg` trap -- an
# explicit 0 is honoured and means "no cap, use the window size" -- so a real 0 here is dangerous,
# not neutral.
# ROUND 86. A 640-wide diagnostic made the overlay visibly blurry while the on-screen counter still
# fell to 0.99 FPS. Its log was overwritten by a simultaneously running title, so it supplies no
# trustworthy timing attribution. Keep native 1280 until a clean, title-identified capture exists.
RPCS3_REMIX_UIWIDTH=1280


# --- the attribute-offset billboard replay (round 84, built 2026-09-12) -------------------------
# The single biggest source of missing geometry in this title, now expanded on the CPU instead of
# refused. Measured before the fix: world_refused=167413, of which attr_offset=139089 (83%) against
# nocam=25774, and B21803879233E34B alone is 116609 of that 139089.
#
# What the program does, read with docs/remix/vpdis.py rather than guessed:
#     r2    = v12(tc4) * c467.x - c467.y ; r2.zw = r2.zw * v9(tc1).x
#     world = v0(pos).xyz + c[11].xyz * r2.z + c[12].xyz * r2.w
#     HPOS  = DP4(world, c[4..7])
# c[10] is the eye (its own distance fade reads v0 - c[10]) and c[11]/c[12] are two world-space axes
# used directly as offset directions. c[4..7] is the view-projection and is the ONLY matrix in the
# chain, so the expanded vertices are already world space and the draw submits at identity.
#
# ONLY THIS PROGRAM IS LISTED, on purpose. 1C83E55ADC63C1D8 (18738 refusals) and 3DD790A17DE31298
# (6710) are attr_offset refusals on the same title but a DIFFERENT grammar - they normalise
# v2(normal) and v0-c[10], build a basis from two cross products, and scale through a pair of
# reciprocal square roots. Adding them here would place every one of their vertices with the wrong
# two axes. They need their own decode; the refusal keeps them out of the scene until then.
#
# HOW TO SCORE IT, without needing a screenshot: `grep attroffset bin/remix_dump.log`. The refusal
# line now carries listed=/replayed=/vtx=/declined=/rattr=/rconst= so the partition is readable even
# if every draw declines, and the applied line prints the first accepted offset pair and world
# position beside the backend's own camera. If offset= is absurd the c467 scale is wrong; if world=
# is nowhere near cam= the billboard pass is drawing in a different world than the gauge anchor.
# REVERT = comment this line out. The round-74 refusal is untouched and returns exactly as it was.
RPCS3_REMIX_ATTROFFSETVP=B21803879233E34B


