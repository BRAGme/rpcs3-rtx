# VCOLBIAS FORCED OFF: PRIME SUSPECT FOR THE MISSION-LOAD CRASH OF 2026-09-12 03:04.
# ============================================================================================
# The crash has NO device-loss message and NO clean exit - the process simply vanished, which is
# an access violation, NOT the VRAM/VK_ERROR_DEVICE_LOST signature of the earlier two crashes.
# The immediately preceding build (UVLANES only) ran without crashing, and this build added
# exactly two things: the VCOLBIAS vertex-colour bias route and the MAD2DCENSUS logging.
#
# WHY VCOLBIAS AND NOT THE CENSUS: the census is logging only. The bias route resolves ATTR3 at
# THREE decode sites, one of which is the per-triangle loop that re-decodes ATTR3 and overwrites
# the tint. The implementing agent explicitly flagged the hazard in that area -- that touching
# colours.at(i) with an UNMAPPED attribute_view hands the triangle loop a null base -- and said
# it avoided one arm for that reason. A missing guard on another path is the obvious candidate.
#
# 0 is a REAL zero here (env_u32(...,1) != 0 with no g_cfg disjunction), so this genuinely
# disables it rather than silently falling through to a config default.
#
# READ IT: if the mission loads without crashing at 0, VCOLBIAS is confirmed and needs a
# mapped-attribute guard before it is re-armed. If it STILL crashes at 0, the bias route is
# exonerated and the next suspect is the MAD2DCENSUS dedup change (it now reads the constant
# slots BEFORE the dedup test, on every mad2d draw rather than once per program).
# *** RE-ARMED 2026-09-12 AS A SECOND TRIAL. THE FIRST ATTRIBUTION WAS PREMATURE. ***
# One crash and one clean load is ONE trial, not a confirmation, and a code review argues
# AGAINST the bias route being the cause. It is guarded at all four entry points:
#   RemixGSRender.cpp:20505  requires colour_attribute==3, the knob, a non-null fingerprint,
#                            AND vcol_route_kind == vcol_route::biased
#   RemixGSRender.cpp:17494  resolve_vertex_colour_bias re-checks fingerprint + route kind,
#                            returns false on read_slot failure, and rejects non-finite lanes
#   RemixGSRender.cpp:21049  the per-triangle site sits behind `if (have_colour)`, which is only
#                            true when map_attribute actually succeeded, so `colours` is mapped
# The crash left NO dump, NO device-loss line and NO fatal in RPCS3.log -- a hard process kill.
#
# SO THIS RUN IS THE A/B:
#   crashes again at mission load -> the bias route IS the cause despite the guards, and the next
#     place to look is colours.at(tri[c]) with INDEXED draws: map_attribute maps vertex_count
#     entries from first_vertex, and an index beyond that range reads past the end. That call is
#     pre-existing, but the bias makes the loop run on a program it never ran on before.
#   loads fine -> the first crash was a transient, and the markers come back.
#
# WHAT IT FIXES WHEN IT WORKS: the marker elements whose colour is COL0 = ATTR3 + c[12] with
# ATTR3 measured zero. The yellow 'Position to reach' text and distance already render because
# that program carries real per-vertex colours; the missing pieces and the off-screen direction
# arrow are the c[12] population.
RPCS3_REMIX_VCOLBIAS=1

# ============================================================================================
# ROUND 87: THE SHARDS ARE CAMERA-FACING BILLBOARDS WITH NO WORLD MATRIX. REFUSED.
# ============================================================================================
# Three programs build their final position as  attr0 + axis0*w0 + axis1*w1  where the axes are
# camera-relative constants and the WEIGHTS ARE PER-VERTEX. Verified by disassembly of
# B21803879233E34B.vp (18 instructions):
#    1: MOV r0.xyz <- c[12]                  axis 1
#    3: MOV r1.xyz <- c[11]                  axis 0
#    6: MAD r2 <- v12(tc4), c467.x, -c467.y  corner weights from ATTR12
#    8: MUL r2.zw <- r2.zzzw, v9(tc1).xxxx   scaled by ATTR9
#    9: MAD r1.xyzw <- r2.zzzz, r1, v0(pos)      pos + axis0*w0
#   10: MAD r0.xyzw <- r0, r2.wwww, r1              + axis1*w1
#   12-16: DP4 o[0](HPOS).wzyx <- r0, c[7..4]   PROJECTION ONLY
# Constant banks read: c[4] c[5] c[6] c[7] c[10] c[11] c[12] c[14] c[467].
# NOTE WHAT IS ABSENT: c[0..2]. There is NO world x view matrix. One transform group, based at
# c[4], which is the pure projection - so the position is already in view space and the per-vertex
# expansion is the whole geometry. Texcoords come from ATTR12 as well, the quad-corner encoding.
#
# WHY IT PRODUCED A SLIVER: per-vertex weights cannot travel in an instance transform, so Remix
# received the UN-EXPANDED attribute box -- 13 vertices spanning 1864 units on B21803879233E34B --
# placed by a quotient of two projections. Static, because attr0 is static: two video frames half
# a second apart were pixel-identical.
#
# THE THREE MEMBERS (the third was never reported, found by the replay):
#   B21803879233E34B   13 vtx, ext 1864, albedo=0
#   1C83E55ADC63C1D8   29 vtx, ext 1352, albedo=0   (eye-aligned tangent/binormal ribbon)
#   3DD790A17DE31298   same ribbon shape with one fewer normalise
#
# REFUSED RATHER THAN FIXED, deliberately. Expressing this correctly needs a third CPU-side
# billboard-expansion family (the two existing apply_particle_billboards() families do exactly
# that, submitting world positions with an identity transform). That is new geometry, not a
# matcher relaxation, and it cannot be written without a frame to check against.
#
# REGRESSION GUARD: replayed over all 298 cached .vp -- 3 changed, 0 LOSSES, and no column other
# than the new attr_offset flag moved. Three structural guards keep it off anything that decodes:
# neither MAD factor may be ATTR0 (that is the affine matchers' grammar), at least one factor must
# be a TEMP (two constants is an expressible bias), and the walk terminates only on a raw attr0
# read -- which is what exonerates Haze's billboard flower, since that one adds its offset on top
# of a real attr0*c[K].w + c[J].xyz decode.
#
# RPCS3_REMIX_ATTROFFSET defaults to 1, so the refusal is live. UNCOMMENT THE LINE BELOW TO REVERT
# if one of the three was drawing something wanted (a tracer, a laser, a decal edge).
#RPCS3_REMIX_ATTROFFSET=0

# ROUND 87 SKY DIAGNOSTIC -- settles the 2.63x dome placement swing in two stats windows.
# What is ESTABLISHED: the two dome programs are IDENTICAL (they differ only in which spare lane
# of r0 the compiler parked the prescale scalar, and the replay gives them identical rows), so
# 0094b0dbd6583b4d's 'no areason' was a census artefact. The submitted vertex box is BIT-IDENTICAL
# across the two frames, so the mesh is constant and the entire swing is the instance matrix. And
# anchor/wext is 0.227080 in both frames to six figures, which means the transform is a uniform
# SCALAR MULTIPLE of itself frame to frame. It is NOT the DPH implicit-w weakness -- that rule is
# what makes these two resolve, and it resolves them correctly.
# The good frame is identifiable: wext=3760 -> dome radius 1880 against a far plane of 2099.5,
# i.e. a dome fitted to the far plane. wext=9892 -> radius 4946, 2.36x PAST the far plane.
# HYPOTHESIS, not established: the guest itself writes a per-frame-scaled c[0..2] for the sky pass
# (a dome fitted to the current far/fog distance). Invisible in a rasteriser, where a dome's
# apparent size is independent of its radius - but on the EMISSIVE path a shell whose radius swings
# 2.63x changes its lighting contribution ~6.9x, and by the un-projection architecture that shell
# is centred on the origin. That combination is what would read as 'the sky is anchored to camera
# turning'. If it holds, sky DETECTION is the wrong remedy entirely.
# READ branch= on the Remix worldvp rows:
#   branch= stable AND the world matrix a clean uniform multiple -> it is the guest's own c[0..2];
#     the fix is a dome-radius clamp or a runtime-side change, NOT a matcher change.
#   branch= flips between layered and ref/fullchain -> it is the cross-pass reference division,
#     i.e. the known gauge problem, and that is where the work belongs.
RPCS3_REMIX_WORLDVP=0094b0dbd6583b4d,b48adb9043143582
