# STATE OF THE QUESTION. The character now renders at the correct scale and pose, and four
# candidate causes are RULED OUT by measurement, not by argument:
#
#  1. Albedo UNIT election -- NOT the cause. The fragment program was captured this run
#     (bin/remix_ucode/2C5BA6436FD18C9F.fp, 166 slots) and it is unambiguous:
#         0: TEX H?  <- f[4](tc0) [tex1]  then  MAD R0 <- R0, 2, -1   <- normal map unpack
#        48: TXB     <- [tex9]   65: TXB <- [tex8]                    <- ambient cubemaps
#       127: TEX H7.xyz <- f[4](tc0) [tex0]                           <- THE DIFFUSE
#       155: MAD H0.xyz <- H3, H1, H4        (light * albedo + ambient)
#     So unit 0 IS the diffuse and albedo_unit=0 is CORRECT. An earlier hypothesis that unit 0
#     was a mask or normal map is RETRACTED -- the ucode refutes it.
#     (Incidental confirmation from the same program: instruction 148 multiplies by
#      c=[2.56471 1.15294 0.905882], BIT-IDENTICAL to RPCS3_REMIX_SUNRGB above, and instruction
#      164 applies the guest's own x0.25. Both were derived independently and both check out.)
#  2. Missing material or texture -- NOT the cause. material=1, albedo=84F71372B2D16A05,
#     tex_none=0, alpha=255..255.
#  3. Texture budget -- NOT the cause. notex_mat_applied=0, tex_deferred=0, tex_live=149.
#  4. Normals -- NOT the cause. normals=programs/applied/rejected/absent/degenerate reads
#     51/2463514/71889/384689/3207, and the vtxattr census shows a2=cmp1 with per-vertex
#     len=0.9929..0.9981, i.e. unit-length normals. 3,207 degenerate against 2.46M applied.
#
# WHAT REMAINS, and these two need separating before either is worth patching:
#   H1  the decoded albedo texture is itself black (a decode or channel-remap fault)
#   H2  the albedo is fine and NO LIGHT REACHES the character (it is lit only by the guest's
#       light pre-pass, which this backend does not replay, while the world is lit by SUNFP)
#
# THE TEST. RPCS3_REMIX_EMISSIVE makes a named albedo CONTENT hash emit at material creation,
# and emissive emits the ALBEDO COLOUR. So this separates H1 from H2 with no ambiguity:
#   * character glows and you can SEE TEXTURE DETAIL  -> albedo is fine  -> H2, a lighting fault
#   * character glows FLAT BLACK / stays black        -> albedo is black -> H1, a decode fault
# Intensity 5 is deliberately high so a dim-but-present albedo cannot be mistaken for black.
#
# WHY NOT JUST DUMP THE TEXTURE: RPCS3_REMIX_DUMP is the only route to a texture BMP
# (dump_texture_images()'s sole caller sits inside dump_enabled()), and its own source comment
# measures it at "~590 ms frame stalls" -- about 1.7 fps. That is not drivable into a mission, so
# it is the wrong instrument here even though it would answer the question directly.
#
# Two hashes, the two character parts the user clicked:
#   84F71372B2D16A05 -> vp=fd1a9fb07bc80b0e (the soldier body, vtx=971 and vtx=5751)
#   7CD3209F627DB91D -> vp=959e743fab67c4e6 (second part, vtx=2803)
# Counter to read: mat_emissive should rise from 2 to 4. If it does NOT reach 4, the hashes did
# not match and the test never ran -- check that before drawing any conclusion from the picture.
# DELETE THIS LINE once the verdict is recorded. It is a diagnostic, and leaving a character
# glowing in the dark is not a fix.
# *** VERDICT IN, 2026-09-11: H2. THE ALBEDO IS FINE. NO LIGHT REACHES THE CHARACTER. ***
# Armed at intensity 5 and confirmed on screen: the character rendered WHITE with the OUTFIT
# TEXTURE VISIBLE through the glow, and the slung rifle rendered too. mat_emissive read 5, so the
# test provably ran. Emissive emits the albedo colour, so visible texture detail is conclusive:
# the texture decodes correctly, the material is bound, the UVs are right. H1 (black texture) is
# REFUTED. The character was black because it receives no light.
# The diagnostic is removed rather than left in - a character glowing in the dark is not a fix.
#
# NEXT DISCRIMINATOR, AND WHY IT IS THE RIGHT ONE.
# Emissive BYPASSES NORMALS ENTIRELY. "Invisible under lighting, visible under emissive" is
# therefore the exact signature of normals that are wrong, and there is a specific reason to
# suspect them here. RemixGSRender.cpp:28337-28341 states the contract: the backend submits an
# OBJECT-SPACE normal and relies on dxvk-remix's own skinning pass to rotate it by the same bone
# matrices (it accumulates mul(bone, normal) * weight and renormalises). If that rotation is not
# happening for this title's characters, the normals stay in BIND POSE while the positions are
# posed - and a systematically wrong normal gives N.L <= 0, i.e. black under any light, while
# emissive is unaffected. That is precisely what is on screen.
#
# VTXNORMAL=0 drops the per-vertex normal and restores the pre-round-51 CONSTANT (0,0,1) (see
# RemixGSRender.cpp:28345 - a draw whose mean pre-normalisation length is not near 1 already
# keeps that constant). A constant normal is wrong for shading but it is GUARANTEED to face
# somewhere, so it catches the sun from some angle. The knob has the correct accessor shape
# (env_u32(...,1) != 0, no g_cfg disjunction), so 0 is a real zero and not a silent no-op.
#
# READ IT LIKE THIS:
#   character becomes LIT (flat, ugly, but shaded) -> the submitted per-vertex normals are the
#     fault, and the fix is the bone rotation contract above, not a knob.
#   character STAYS BLACK -> normals are NOT the cause. Then the suspect is that this title is a
#     LIGHT PRE-PASS renderer whose characters are lit entirely from a light accumulation buffer
#     this backend does not replay, and the sun/ambient lights simply never apply to them.
# COST: this flattens shading on ALL GRAW2 geometry, including the world, which currently looks
# correct. It is a one-run diagnostic. Remove it either way once the verdict is recorded.
# *** VERDICT IN, 2026-09-12: NORMALS ARE NOT THE CAUSE. THE TEST IS REMOVED. ***
# VTXNORMAL=0 was armed and the character STAYED BLACK. A constant (0,0,1) normal is guaranteed
# to face somewhere and would have caught the sun from some angle, so this is the pre-registered
# second branch: the per-vertex normals are NOT why the character is unlit.
#
# TWO CAUSES NOW ELIMINATED ON SCREEN, both pre-registered before the run:
#   albedo  -- REFUTED by EMISSIVE (character glowed WHITE with outfit texture visible)
#   normals -- REFUTED by VTXNORMAL=0 (character stayed black under a guaranteed-facing normal)
# So the geometry, transform, material, texture, UVs and normals are all fine and the character
# simply receives no light. Remaining suspect: this title is a LIGHT PRE-PASS renderer whose
# characters are lit from an accumulation buffer this backend does not replay, and/or the
# submitted sun/ambient lights do not apply to skinned_layered instances the way they apply to
# the world. Under investigation; do NOT re-test albedo or normals, both are settled.
#
# Left OFF the conf deliberately - VTXNORMAL=1 is the default and the correct value. Setting 0
# flattens shading on ALL geometry including the world, which looks right, so it must not linger.

# ============================================================================================
# THE BIG ONE, 2026-09-12: THE MISSING GROUND AND THE BLACK CHARACTER WERE ONE BUG.
# AND THE FIX IS NOT IN THIS FILE -- IT IS IN bin/config/custom_configs/config_NPUB30502.yml.
# ============================================================================================
#     Use RSX Backface Culling: true   ->   false
#
# That one line restored the terrain, the roads and the kerbs AND turned Mitchell from a pure
# black silhouette into a fully textured, correctly lit soldier. Confirmed on screen, 25-43 fps.
#
# THE MECHANISM. instance.doubleSided = (cull_from_rsx() && cull_face_enabled()) ? 0 : 1.
# dxvk-remix hardcodes frontFace = VK_FRONT_FACE_CLOCKWISE for external draws and maps
# doubleSided=0 to VK_CULL_MODE_BACK_BIT. But front_face_mode() and cull_face_mode() appear
# ZERO times anywhere in rpcs3/Emu/RSX/Remix/ -- only cull_face_enabled(), 3 times. So the
# winding is never read, CW is assumed, and a CCW-winding title gets its VISIBLE face culled.
#
# WHY IT LOOKED LIKE TWO SEPARATE BUGS, which is what defeated five other hypotheses: an OPEN
# one-sided surface (ground, road, terrain slab) vanishes outright, because the primary ray
# passes through it to the sky. A CLOSED volume (building, prop, character) still shows its far
# INTERIOR wall, which reads as a solid, roughly-correct, UNLIT DARK silhouette. 'Everything
# renders except the ground, and the characters are black' is ONE defect, not two.
#
# TWO TRAPS THAT HID IT FOR THE WHOLE PROJECT:
#  1. cull_from_rsx() is env_flag(L"RPCS3_REMIX_CULL") || g_cfg.video.remix.cull_from_rsx --
#     the env||g_cfg shape. So RPCS3_REMIX_CULL=0 IN THIS FILE IS A SILENT NO-OP. Only the YAML
#     or the GUI checkbox can turn it off. Do not add RPCS3_REMIX_CULL here expecting it to work.
#     A comment at RemixGSRender.cpp:33325 asserts 'doubleSided is 1 on every instance unless
#     RPCS3_REMIX_CULL is set, and it is not set' -- true of the env var, FALSE of the config,
#     and that stale comment is why nobody looked here for rounds.
#  2. The only line that prints the RSX cull state is 'Remix dump vp=... cull=%d', gated on
#     dump_enabled() (Log Draw Diagnostics), false for this title. The cull state had literally
#     never been logged, so no counter ever moved and the gate was invisible.
#
# WHAT IT COSTS: double-sided ray intersection, and thin props or interiors may show their inner
# surfaces. Cheap next to invisible terrain. The PROPER fix is to read front_face_mode() and
# cull_face_mode() and submit single-sided only where the guest is CW + back-only. That patch was
# written and deliberately NOT applied: the config flip is both the test and the fix, and piling
# code on top of a working picture is how regressions land.
#
# RETRACTED BY THIS FINDING -- do not revive any of them:
#   * 'the albedo texture is black' -- the emissive test showed white, but that path binds no
#     texture at all, so it never licensed the conclusion it was read as licensing.
#   * 'the vertex normals are wrong' -- and the VTXNORMAL=0 test that 'refuted' it was itself a
#     NO-OP: normal_programs=0, so the constant (0,0,1) was ALREADY in use on every vertex.
#   * 'the smooth-normals/skinning format collision unlights characters' -- a real runtime bug,
#     tested via RPCS3_REMIX_SMOOTHSKIN over 45,057 cleared instances including Mitchell's own
#     program, and a clean negative.
#   * 'the frustum is aimed at +Y so the ground is culled' -- +Y is the horizontal forward.
#   * 'the eye sits below the world' -- a census-dedup artifact of a single frame.
#   * 'the streak/extent gate eats the terrain' -- it refuses exactly 2 programs, neither terrain.

# ROUND 82 A/B: IS THE TERRAIN STREAKING THE TEMPORAL DENOISER? ONE RUN, THEN REMOVE.
# 1 = force rtx.useDenoiser off. Pushed per-game via SetConfigVariable, the same proven
# mechanism as RPCS3_REMIX_DLFG above, because user.conf is shared with four other titles and a
# dev-menu toggle does not survive a relaunch.
#
# THE MECHANISM, and it is the last one standing. Remix's world space on this title IS the
# guest's view space, and the submitted eye is pinned at the origin BY CONSTRUCTION (verified
# three separate times; the camera is not a bug). So the runtime sees ZERO CAMERA MOTION while
# every static instance transform changes every frame. A temporal denoiser reprojecting on world
# position and motion vectors cannot converge on that, and the failure mode is precisely what is
# on screen: streaking along camera motion, intermittent frame to frame, worst on large flat
# surfaces. rtx.enableRayReconstruction = True is live at bin/user.conf:43.
#
# MEASURED AND REFUTED FIRST, so this is not a guess by elimination alone:
#   * 'the camera election churns and re-bases the world each frame' -- REFUTED. The reference
#     hash is ONE value on 2,485 of 3,228 viewsolve lines (77%) and pown=1 on 3,199 of 3,228
#     (99.1%), i.e. reference_inverse IS the pure projection and is constant for a fixed FOV.
#     The 96 distinct values are lens changes (ADS/zoom), not witness hopping. This also means
#     CAMSTICKY / CAMTRACK / CAMREBASE / CAMREFSYNTH are ALL INERT here - their counters read 0
#     and cam-elect reports candidates=1 on ~80% of frames, so a rank rule has nothing to rank.
#   * 'the VIEWSOLVE unbake will fix it' -- BLOCKED, by the code's own decision rule. It wants
#     one inner hash dominating many programs; the measurement is the opposite - a median 20
#     programs carry a median 14 distinct inner matrices, modal share 23%, and the best-shared
#     hash has |t| bit-pinned at 180.17, which RemixGSRender.cpp:16372 names as a shared STATIC
#     WORLD matrix, not the view. An earlier reading of 'two programs share one innerhash and
#     the same t' as evidence the unbake was landable is RETRACTED.
#   * 'the terrain albedo unit is mis-elected, giving a low-frequency map' -- REFUTED by
#     disassembly of 799B66DD6C860BFD.fp: units 0+1 ARE the diffuse, blended by spec_color.x on
#     tc0.zw; unit 5 is a single-channel AO term; unit 14 is the screen-space light-prepass
#     fetch. Electing unit 0 is correct.
#
# READ IT LIKE THIS:
#   terrain STOPS streaking and the image goes visibly GRAINY/NOISY -> confirmed. The grain is
#     the denoiser being absent, not a new bug, and apparent terrain resolution improves because
#     the streak WAS the blur. The real fix is then to give the runtime honest motion vectors,
#     which means the unbake - so this becomes the argument for doing that work.
#   streaking UNCHANGED under heavy noise -> temporal reuse is not the amplifier. The defect is
#     in submitted geometry or UVs, and the next read is the uvrange rows for the terrain
#     programs outside frames 14763-14860 (only 7 of 177 rows in one log were lanes=zw).
# COUNTER TO READ: 'Remix: SetConfigVariable(rtx.useDenoiser=false) returned SUCCESS (0)'. If it
# says SUCCESS but the dev menu still shows denoising on, the API-sets-User-layer override
# applies and the push did not land.
# *** RETIRED 2026-09-12: THE TEST WAS PROBABLY A NO-OP, NOT A REFUTATION. ***
# The push returned SUCCESS twice, but rtx.enableRayReconstruction = True is live
# (bin/user.conf:43) and DLSS Ray Reconstruction does its OWN denoising -- rtx.useDenoiser very
# likely does not gate it. The user reported no change AND no graininess; graininess was the
# pre-registered proof the setting had taken effect, and its absence says it did not. So this
# is INCONCLUSIVE. Do not record the temporal-denoiser hypothesis as refuted on this evidence.
# If it is retried, disable RAY RECONSTRUCTION itself via RTXSET below, not useDenoiser.

# ============================================================================================
# ROUND 83: RPCS3_REMIX_RTXSET -- PER-GAME RUNTIME OVERRIDES, THE GENERAL MECHANISM.
# ============================================================================================
# Every interesting Remix runtime option lives in bin/user.conf or bin/rtx.conf, BOTH shared
# with Eat Lead, Haze, Demon's Souls and Ratchet & Clank, and a dev-menu toggle does not survive
# a relaunch. This pushes any rtx.* variable into the User option layer for THIS TITLE ONLY,
# after initializeSystemLayers(), by the same proven mechanism as the DLFG push. Bounded at 16.
#
# WHY IT IS ARMED NOW -- THE 'LOW RES TERRAIN' LEAD, and this is a hypothesis, not a measurement:
#     bin/user.conf:13  rtx.qualityDLSS = 1     <- DLSS PERFORMANCE, 50% linear render scale
#     bin/user.conf:50  rtx.upscalerType = 1    <- DLSS
#     bin/user.conf:43  rtx.enableRayReconstruction = True
# DLSS Performance renders at half linear resolution and reconstructs the rest temporally, which
# is exactly what loses fine high-frequency detail -- asphalt aggregate, terrain grain. That is a
# direct and sufficient cause for 'terrain is low res' and it had nothing to do with any of the
# six geometry hypotheses chased before it. It also explains the night-vision contrast the user
# reported: a monochrome, heavily grained NV image hides upscaling softness that bare daylight
# asphalt shows immediately. NOT YET CONFIRMED - the dev-menu DLSS Mode dropdown tests it in one
# second with no relaunch, and that is the cheaper first move.
#
# qualityDLSS values in this runtime: 0=UltraPerformance 1=Performance 2=Balanced 3=Quality.
# Set to 3 here. If the terrain sharpens, the cause is confirmed and this line is the fix.
# If it does not, raise it no further - go to DLAA/native via rtx.upscalerType instead, and read
# the 'Remix: SetConfigVariable(rtx.qualityDLSS=3) returned SUCCESS (0) [rtxset]' line first to
# confirm the push even landed.
#
# THIS ALSO REPLACES THE NEED FOR FUTURE ONE-OFF KNOBS. The per-game BIK texture tagging the
# user asked about (they tagged them as UI in the dev menu and it did not persist) is the same
# shape of problem and should be done through here rather than by editing the shared rtx.conf.
# *** qualityDLSS=3 REFUTED: terrain still soft at DLSS Quality. ***
# That partly argues AGAINST plain internal resolution being the cause -- Quality is 67% linear
# against Performance's 50%, so a resolution-limited image should have visibly sharpened.
#
# ROUND 84: THE DECISIVE PARTITION. UPSCALER OFF ENTIRELY, NATIVE RESOLUTION.
# UpscalerType enum (rtx_options.h:68): 0=None 1=DLSS 2=NIS 3=TAAU 4=XeSS 5=FSR.
# 0 renders at native res with NO spatial upscale and NO temporal accumulation, and ray
# reconstruction must go with it because RR is a DLSS feature.
#
# WHY THIS BEFORE ANY CAMERA WORK. The candidate causes for soft terrain are (a) the upscaler --
# spatial resolution and/or failed temporal accumulation -- or (b) the submitted texture, UVs or
# mip. This one line separates them completely, and it costs one relaunch and no rebuild.
#   terrain becomes SHARP  -> it is the upscaler. Then the camera work below is the real fix,
#     because temporal accumulation is what DLSS needs and a pinned-at-origin camera is what
#     denies it. Expect a large fps drop at native res; that is the cost, not a bug.
#   terrain STILL SOFT     -> the upscaler is NOT the cause. Stop blaming the camera for this
#     symptom; the next read is the terrain UV lanes (only 7 of 177 uvrange rows were lanes=zw)
#     and the albedo's actual mip/dimensions, which no one has ever dumped for this title.
#
# NOTE the two are not exclusive: the camera can still be worth fixing for temporal stability
# and correct motion vectors even if it turns out not to drive THIS symptom.
# *** THAT TEST CRASHED THE GAME AND THE CAUSE IS NOT A MYSTERY -- VRAM EXHAUSTION. ***
# From the runtime's own stderr, in order:
#   [02:13:57] Presenter: Buffer size: 3840x2019
#   [02:14:04] [RTX Opacity Micromap] Free Vidmem dropped below a limit. Setting budget to 0.
#   [02:15:02] DxvkSubmissionQueue: Command submission failed: VK_ERROR_DEVICE_LOST
#   [02:15:02] DxvkSubmissionQueue: Exiting after GPU device loss
# upscalerType=0 makes Remix path-trace at NATIVE 3840x2019. DLSS Performance was rendering at
# ~1920x1010 -- a QUARTER of the pixels -- so every ray-tracing buffer grew about 4x. VRAM was
# already 7112/11226 MiB (63%) WITH DLSS, and RPCS3_REMIX_TEXBUDGET=100000 adds to that. It ran
# out. Same exit signature as the original DLFG crash, completely different cause.
#
# So the upscaler question is STILL OPEN -- the run never survived long enough to answer it.
# DO NOT simply retry upscalerType=0 on an 11 GB card at a 4K window; it will crash again.
#
# THE LOW-VRAM WAY TO FINISH THE TEST, if it is worth another run: NIS vs DLSS at the same
# render scale. UpscalerType 2 = NIS is a purely SPATIAL upscaler with NO temporal component;
# 1 = DLSS and 3 = TAAU are both temporal. Same internal resolution, same VRAM, and the
# comparison isolates the one variable:
#   NIS SHARPER than DLSS -> temporal accumulation is actively smearing, and the pinned-at-origin
#     camera is the thing denying it usable reprojection. The camera work is then the real fix.
#   NIS SOFTER than DLSS   -> temporal is HELPING and internal resolution is the limit. Then the
#     answer is more render scale (and more VRAM headroom), not camera work.
# Either way it is one conf line and no rebuild:  RPCS3_REMIX_RTXSET=rtx.upscalerType=2
#
# CLEARED for now, so the title is back on user.conf's DLSS Performance + ray reconstruction --
# the configuration that ran for hours without a device loss. Soft terrain is the status quo,
# not a regression, and a playable build beats an unplayable measurement.

# ============================================================================================
# ROUND 85: THE 'LOW RES TEXTURES' ARE WRONG UVs, NOT LOW RESOLUTION. UVLANES=1.
# ============================================================================================
# The user's own A/B settled it: a wall with a FAN texture plastered across it in normal view,
# and the SAME wall correct under night vision (yellow building, posters, 'OPTICA POPULAR'
# signage, sharp). A wall wearing a fan is not a resolution problem - it is sampling the wrong
# region of the wrong sheet. 'Low res' was the symptom description, not the defect.
#
# THE EVIDENCE, from three picks the user made on the affected walls (all one program):
#   vp=15b7a8f03be58c33 albedo_unit=0 sampled=0x4023
#   lanes=0:zw, 1:zw, 5:xy, 14:-        uv_scale=affineall(0.000976562)
# Unit 0 samples texcoord .ZW. The applied transform is the .XY affine. They are different
# transforms at different scales, so the sampled region is wrong in both scale and offset.
#
# INDEPENDENTLY CORROBORATED by disassembly of a sibling world program (799B66DD6C860BFD.fp):
#   0: TEX R2 <- f[4](tc0).zwzz [tex0]      the diffuse, on tc0.ZW
#   5: TEX R3 <- f[4](tc0).zwzz [tex1]      second diffuse layer, also .ZW
#  28: TEX H1.x <- f[4](tc0).xyzw [tex5]    single-channel AO, on tc0.XY
# So this title's world diffuse lives on .zw and its AO on .xy - exactly the split UVLANES was
# written for. KNOBS.md round 58 calls the failure 'the ten-times-too-dense tiling'.
#
# THE COUNTERS SAY THE REPLAY HAS NEVER RUN:
#   uv_lane_zw=0   uv_lane_refused=0   uv_affine_general=1807003 of uv_applied=1845546 (97.9%)
# i.e. essentially every UV application uses the general .xy affine, including on .zw units.
#
# WHY IT SHIPS OFF UPSTREAM: it changes which texture a surface is drawn with, and the
# RETRYUNSUP precedent says that is not a default. This title is precisely the case it was
# written for, so it is armed HERE rather than globally.
#
# READ IT LIKE THIS:
#   fan gone, wall textures correct, apparent resolution improves -> confirmed. The 'low res'
#     complaint and the 'wrong walls' complaint were one defect, and night vision looked right
#     because its shader path samples .xy.
#   unchanged -> check uv_lane_zw FIRST. If it is still 0 the rule never matched and the lane
#     detection needs work (uv_lane_refused would say a unit is sampled through BOTH pairs).
#     If uv_lane_zw is large and the picture is unchanged, the .zw form is being resolved to the
#     same values as .xy and the defect is elsewhere - then run the queued NIS test.
# COUNTER TO READ: uv_lane_zw must rise from 0. uv_lane_refused reports units sampled through
# both pairs; it is reported, not judged, and a large value means the split is ambiguous.
RPCS3_REMIX_UVLANES=1

# ============================================================================================
# ROUND 86: THE RSX CHANNEL REMAP, NEVER APPLIED ON THIS TITLE. 733 TEXTURES AFFECTED.
# ============================================================================================
#   tex_remap_seen=733   tex_remap_applied=0   texremap=0
# NV4097_SET_TEXTURE_CONTROL1 is the per-texture channel remap. decode() converts guest bytes by
# FORMAT ALONE, which is only correct when the remap is the identity 0xAAE4. Distinct remaps in
# use on this title: 520 aae4 (identity, fine), 110 zero, 56 aa55, 5 0000 -- so 733 draws carry a
# remap that is being ignored.
#
# THE BIK VIDEO IS ONE OF THEM, and it is the strongest single piece of evidence:
#   vp=ab86464ca0d72796 fp=07e8403b6b903b99 tex=640x360 fmt=a1 unit=1 remap=aa55
# bin/remix_atlas.bmp dumped that video's intro frame and it is FLAT GREYSCALE. KNOBS.md records
# the same defect on Eat Lead, where an unapplied remap made greyscale data render as a solid
# BLUE field, because RGBA8 data declared as A8R8G8B8 back-decodes to the wrong lanes. A video
# plane is exactly the case: the guest hands over planar/packed data and uses the remap to say
# which lane is which.
#
# CAVEAT, from the knob's own doc: this changes what EVERY decoded texture contains and has only
# been A/B'd on one title. CELL_GCM_TEXTURE_B8 is excluded in code because that arm already
# hand-writes (v,v,v,0xFF) and applying the remap on top would double it. The remap joins the
# content hash ONLY when actually applied, so a run with this at 0 stays bit-for-bit hash-
# identical to every previous round -- meaning this WILL change 733 content hashes, and any
# bin/remix_tex replacement keyed on an old hash stops matching. Nothing is keyed that way here.
#
# READ IT: tex_remap_applied must rise from 0 toward 733. Then look at the BIK video - if its
# colour corrects, this was it. If tex_remap_applied stays 0 the format gate refused every one
# and the knob is inert on this title.
# *** RETIRED: MEASURED INERT ON THIS TITLE, AND THE REASON IS STRUCTURAL. ***
#   tex_remap_seen=103   tex_remap_applied=0   texremap=1
# The BIK texture is fmt=a1, and 0xa1 & ~0x20 = 0x81 = CELL_GCM_TEXTURE_B8. RemixTextures.cpp:860
# excludes B8 from remap application ON PURPOSE, because the B8 decode arm already hand-writes
# (v, v, v, 0xFF) -- a grey spread -- and applying a remap on top would double it. That grey
# spread IS why bin/remix_atlas.bmp dumped the video as flat greyscale.
# So the video arrives as SINGLE-CHANNEL B8 planes (Y/U/V) and this backend renders one of them
# as grey. TEXREMAP is the wrong instrument and the exclusion it runs into is correct. The only
# fix is three-plane YUV sampling in the compositor. Do not re-arm this for the BIK colour.

