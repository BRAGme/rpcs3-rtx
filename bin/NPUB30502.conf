# =================================================================================================
# Tom Clancy's Ghost Recon Advanced Warfighter 2 (NPUB30502) -- per-game Remix profile
#
# Created 2026-09-11. YETI engine, PS3 PSN build.
#
# WHY THIS FILE EXISTS AT ALL, AND THE TRAP IT DOCUMENTS
# -----------------------------------------------------
# This file only loads when Emu.GetTitleID() resolves to NPUB30502. That happens when the title is
# booted through its EBOOT / the game list. It does NOT happen when USRDIR/OFFLINE/YETI.self is
# booted directly: the title id is then empty, RemixGameConfig logs
#   Remix game-config: no title id at init -- no per-game config loaded
# and the title silently inherits the GLOBAL config.yml Remix block plus the shared rtx.conf --
# which at time of writing are Eat Lead's (Sun Radiance: 3, Sun Direction: -0.3509,-0.9023,-0.2506,
# Generate Smooth Normals: true, rtx.sceneScale = 0.01, rtx.zUp = True). Every knob set for GRAW2
# is dead on that path. Boot via the EBOOT, or none of the below does anything.
#
# PRECEDENCE: an environment variable that is ALREADY SET wins over this file
# (RemixGameConfig.cpp, `env_is_set`), so an A/B harness stays authoritative.
#
# THE LIGHTING FINDING THIS FILE TESTS
# ------------------------------------
# GRAW2's own fragment programs carry the engine's sun as a constant. Disassembled from
# bin/remix_ucode/799B66DD6C860BFD.fp (and a second world program carrying identical values, which
# is what proves these are engine globals and not a per-material tint):
#
#   sun vector    = [-0.94577, 0.10551, -0.307224]     near-horizontal
#   sun radiance  = [ 2.56471, 1.15294,  0.905882]     strongly WARM
#   ambient       ~ [ 0.31,    0.31,     0.39   ]      cool
#   fog colour    = [ 0.181176, 0.157647, 0.242353]
#   final output  x 0.25, saturated
#
# The backend currently submits a steeply-downward direction and FLAT WHITE (3,3,3). Ratio of
# backend sun to game sun is (1.17, 2.60, 3.31) -- 3.3x too strong in blue, 2.6x in green. That is
# the "blown out and colourless" look, and it is a LIGHTING defect, not an albedo one. The albedo
# election was investigated and cleared: tex_albedo_ucode=0 is benign on this title because YETI is
# a light-pre-pass renderer (unit 14 is a screen-space fetch of the light-accumulation RT and
# provably reaches COL0, so the discriminator can never exclude a unit), and the lowest-unit
# fallback lands on unit 0, which IS the diffuse in 77 of 79 censused programs.
#
# SUN COLOUR -- WAS a code limitation, now fixed
# ----------------------------------------------
# The sun used to be white by construction: both submit sites did
#     light_info.radiance = { radiance, radiance, radiance };
# from a scalar sun_radiance(). That is now widened to a real RGB triple, defaulting to the old
# scalar broadcast so every other title is bit-identical, with RPCS3_REMIX_SUNRGB as the override.
# A component of 0 is a legitimate value and is accepted (the accessor uses an explicit validity
# latch, not the `env || g_cfg` shape that would silently swallow it); a NEGATIVE component is
# refused, so a typo cannot darken the scene.
#
# The value set below is GRAW2's own authored sun, read out of its fragment-program constants.
# Note this is a large intensity drop as well as a hue change -- from flat (3,3,3) to
# (2.56, 1.15, 0.91) -- which is the point: the scene was 2.6x too strong in green and 3.3x too
# strong in blue. To revert to stock behaviour, comment the line out; do not set it to 3,3,3,
# because that records a deliberate choice rather than "unset".
#
# Still missing, and NOT addressed by this file: the game's ambient ~(0.31,0.31,0.39), its fog
# colour (0.181176, 0.157647, 0.242353), and its final x 0.25 saturated exposure scale. If the
# scene now reads too dark or too contrasty, that absent ambient term is the first suspect --
# do not "fix" it by pushing the sun back up.
#
# WHAT STILL CANNOT BE FIXED FROM THIS FILE
# -----------------------------------------
# * Smooth normals. smooth_normals_enabled() is `env || g_cfg.video.remix.smooth_normals`, so
#   RPCS3_REMIX_SMOOTHNORMALS=0 is a SILENT NO-OP -- env can only ever turn it ON. It is currently
#   ON globally and overwrites the real vertex normals that were decoded for ~80% of draws, which
#   flattens shading further on hard-edged architecture. Disabling it means editing
#   `Generate Smooth Normals` in config.yml, which is GLOBAL and shared with Eat Lead -- do not
#   flip it without checking with whoever is running that title.
#
# SIGN AMBIGUITY -- RESOLVED, NO A/B NEEDED
# -----------------------------------------
# This section previously warned that it was unknown whether sun_direction() wants the direction
# light TRAVELS or the direction TO the sun, and proposed negating all three components as the
# first A/B to run. That is now settled from the ucode: the fragment program computes N . (-c),
# so the stored constant IS the travel direction and the value below is already correct.
# DO NOT negate it. The near-horizontal, slightly-positive-y shape that looked suspicious is a
# consequence of the constant being VIEW-space, not world-space -- see the SUNFP block below.

RPCS3_REMIX_SUNDIR=-0.94577,0.10551,-0.307224
# Quartered for the round-81 A/B above: 2.56471/4, 1.15294/4, 0.905882/4. This is exactly the
# guest's own x0.25, applied where we can control it. RESTORE THE FULL VALUES WITH SUNFP=1.
# Full values, for the restore: 2.56471,1.15294,0.905882
RPCS3_REMIX_SUNRGB=2.56471,1.15294,0.905882

# ROUND 68 -- THE TWO LINES ABOVE ARE A SNAPSHOT, AND THAT IS NOW MEASURED, NOT SUSPECTED
# --------------------------------------------------------------------------------------
# A census of all 843 stored fragment programs found GRAW2 carrying FIVE DISTINCT sun pairs in a
# SINGLE session: 25 programs on the pinned pair above, 3 on a different direction with the same
# radiance, 2+2 on two more directions sharing (5.92941, 5.55294, 5.08235), and 1 on
# (-0.626498, 0.072763, -0.776019) / (8, 6.83922, 6.21176). All five directions are unit length.
# Direction and radiance move INDEPENDENTLY, so no single latched pair can ever be right -- which
# is exactly the scripted time-of-day cycle, showing up in the data.
#
# Two things this corrected along the way:
#  * The "stable slot" idea was REFUTED. RSX fragment constants are inline literals following their
#    instruction, not an indexed bank, so the ordinal varies per program (0..28 for the vector,
#    4..39 for the radiance). Identification is STRUCTURAL: the direction is the constant of a
#    SATURATED single-lane DP3 against a temp, the radiance the constant of a later MUL/MAD
#    broadcasting that lane across rgb. The saturate bit is load-bearing -- one program dots the
#    normal against the sun twice and only the saturated one feeds the radiance.
#  * The sun's retarget gate was ANGLE-ONLY, so a TOD change that dimmed the sun without moving it
#    could never reach the runtime at all. Radiance is now an independent trigger.
# Coverage: 33 of 34 light-pre-pass world programs recover a complete pair; 0 of 16 non-world
# programs match, so there are no in-title false positives.
#
# KEEP the two pinned lines above. They are no longer the primary source but they ARE the genuine
# fallback: light 0x4 is created from SUNDIR, and a frame that recovers nothing holds it. Deleting
# them would leave GRAW2 inheriting Eat Lead's global (-0.3509,-0.9023,-0.2506) / 3,3,3 instead,
# which is strictly worse.
#
# LAUNCH IN THIS ORDER. Mode 0 changes NOTHING on screen and still emits the full census, which
# also settles the SUNDIR sign question above -- the matcher reads the literal unnegated, exactly as
# it was pinned, so whatever sign SUNDIR needs SUNFP inherits. There is no negate knob.
#   0 = measure only   1 = direction + radiance   2 = direction only   3 = radiance only
# Read sunfp_moved on the `Remix live:` line: == 1 means the sun really is static and the snapshot
# was fine; > 1 means it moves and these two lines never were the whole truth.
# If the recovered radiance reads too hot, use 2 -- direction live, brightness from SUNRGB above.
# (It is a PRE-tonemap value: the guest applies its own x0.25 that this backend deliberately does
# not, because Remix runs its own tonemapper and double-counting it would be wrong.)
# ROUND 69 SETTLES THE SPACE QUESTION, AND IT CHANGES THE FIX.
# The sun constant is VIEW-SPACE. Proven two independent ways:
#  * All 90 GRAW2 vertex programs censused: 40 read v2(normal), and the normal column is
#    c[0],c[1],c[2] in 40 of 40 -- unanimous. c[0..2] is WORLD x VIEW, so the normal is view-space
#    and a constant dotted against it must be too. (DP3 for the normal, DPH for the position, out
#    of the same matrix block -- exactly the right distinction.)
#  * Two recovered directions share their radiance BIT-EXACTLY and differ by a pure yaw:
#    elevation equal to 0.0635 degrees, azimuth swung 194.3 degrees. That is a player turning
#    around. A TOD transition cannot swing azimuth 194 degrees while pinning elevation to a
#    sixteenth of a degree.
#
# So there are TWO lighting states, not five -- the earlier five-pairs reading is RETRACTED. The
# five directions are two environments seen from several camera orientations.
#
# And the fix inverts. Remix's world space here IS the guest's view space, so the raw constant is
# ALREADY correct -- there is no missing view multiply, and adding one would break it. THE DEFECT
# IS THE LATCH: sun_direction() is a `static const`, so one frozen view-space vector is submitted
# while the geometry re-bakes against a new view every frame. That is literally a sun that rotates
# with the player's head, and it is what the `aimed=0` log evidence was showing.
#
# *** IF RPCS3_REMIX_VIEWSOLVE'S UNBAKE EVER LANDS, THIS MUST GO BACK TO 0 IN THE SAME COMMIT. ***
# Unbaking makes Remix's world space the guest's TRUE world, at which point a live view-space
# vector is wrong by V.
#
# Read `sunfp_envmoved`, NOT `sunfp_moved`. With a live view-space direction, sunfp_moved tracks
# CAMERA motion and will approach the frame count -- that is the mechanism working, not TOD.
# sunfp_envmoved counts elections whose RADIANCE moved, which is camera-invariant. Expect 2 or 3.
#
# *** ROUND 76: THE SPACE VERDICT IS SETTLED. VIEW-SPACE. MODE 1 IS RELEASED. ***
# The decisive test described at the bottom of this block has now RUN, in-mission, and the
# counter written for it reads zero:
#     sunfp_multi=0     over sunfp_prog=979714  sunfp_draws=1630964  sunfp_elect=13482
# sunfp_multi counts frames in which the election saw MORE THAN ONE distinct sun candidate.
# Zero, across 13,482 elections, means every draw in a frame carries the SAME constant. That is
# the per-camera signature, not the per-object one, so the constant is VIEW-space and there IS a
# single correct value to submit. The model-space reading taken from the loose shader source at
# data\rendererdata\shaderfragmentsmodel3\ (c11 `DirLight.modelspaceDir`) is REFUTED for the PS3
# build by the PS3 build's own runtime behaviour -- that source describes a different arrangement
# from the ucode actually executing here, exactly as this block warned one of them must.
# The ucode measurement (40 of 40 programs transform v2(normal) by c[0..2]; c[4..7] decodes as a
# pure projection, near 0.1 / far 2097.25 / aspect 16:9) therefore stands unopposed.
#
# Also measured in the same run: sunfp_envmoved=80. The note below predicted 2 or 3 for two
# static lighting environments. 80 radiance changes is MORE than that, and the likeliest reading
# is the scripted time-of-day cycle the title runs at mission checkpoints -- i.e. the extra
# movement is real content, not noise. That is a prediction, NOT a measurement: it has not been
# correlated against a checkpoint, and it is the next thing to check if the sun looks wrong.
# The view-space conclusion above rests on measuring the PS3 ucode: 40 of 40 GRAW2 vertex programs
# transform v2(normal) by c[0..2], and c[4..7] independently decodes as a PURE projection (near
# 0.1, far 2097.25, aspect exactly 16/9), which makes c[0..2] = WORLD x VIEW and the normal
# view-space.
#
# But GRAW2's own shader SOURCE is loose on disk at data\rendererdata\shaderfragmentsmodel3\, and
# its constant map names c11 `DirLight.modelspaceDir` -- MODEL space, transformed per draw into
# each object's local frame -- with c0-c3 as a full WVP rather than a two-stage WORLD*VIEW then
# projection. That is a different arrangement from what the PS3 ucode actually does, so one of the
# two is not describing the shaders we are reading.
#
# WHY THIS CANNOT BE LEFT AMBIGUOUS: if the constant is model-space, then every draw carries a
# DIFFERENT sun and submitting one of them means submitting whichever object drew last. Mode 1
# would feed the runtime garbage that happens to look plausible. The yaw argument does not settle
# it either -- upright buildings differ by pure yaws at constant elevation too, exactly like a
# turning camera.
#
# THE DECISIVE TEST, and mode 0 already runs it: do two draws in the SAME FRAME carry different
# sun constants? All draws in a frame sharing one value means per-camera (view-space, mode 1 is
# the cure). Draws differing within a frame means per-object (model-space, and there is no single
# correct value to submit at all).
# Mode 0 emits the full census and changes nothing on screen, so this costs one launch and no risk.
# *** ROUND 81 A/B: TEMPORARILY 2, TESTING WHETHER THE WORLD IS SIMPLY OVEREXPOSED. ***
# PUT THIS BACK TO 1 once the verdict is recorded. Mode 1 (direction + radiance, both live from
# the fragment constant) is the correct setting and is what the SUNFP block above argues for.
#
# WHY THE TEST. A premise was accepted too readily earlier in this project: that the flat pale
# plane where the ground should be is 'the sky showing through', on the evidence that switching
# to a different sky changed its brightness. But the sky drives the dome/ambient lighting, so
# changing it changes REAL GROUND brightness too - that observation does not actually
# distinguish 'sky visible through absent ground' from 'ground present but blown out'.
#
# And there is a specific reason to expect overexposure. The live submission reads
#     Remix sun-submit: radiance=[2.565 1.153 0.9059] angle=0.5 aimed=1 draw=SUCCESS
# i.e. the raw PRE-TONEMAP constant, while the guest's own fragment program applies a x0.25 at
# its final instruction (2C5BA6436FD18C9F.fp:164, 'MUL R0.xyz <- H0, c[..0.25] [sat]') that this
# backend deliberately skips on the grounds that Remix runs its own tonemapper. If that call is
# wrong, the scene is lit ~4x too bright and a pale ground against a pale sky is invisible.
# sun_radiance() cannot test it: with SUNFP=1 the radiance comes from the ucode and SUNRADIANCE
# is bypassed entirely, which the sun-submit line above proves. Mode 2 = direction live from the
# ucode, brightness from SUNRGB, which is the only way to vary one without the other.
#
# READ IT LIKE THIS:
#   ground APPEARS (and the scene stops being white) -> 'missing geo' was overexposure, not
#     absence, and the x0.25 decision needs revisiting. Bisect SUNRGB back up from here.
#   ground STILL ABSENT but the scene is darker -> exposure is not the cause; the geometry
#     really is not reaching the frame, and mode 1 should be restored immediately.
# Either way this is a ONE-RUN instrument. SUNDIR/SUNRGB above are unchanged as the fallback.
RPCS3_REMIX_SUNFP=1

# With a live view-space direction the sun SHOULD re-aim every frame the player turns, so the angle
# hysteresis now works against us. 0 = re-create whenever the direction changes at all.
RPCS3_REMIX_SUNTRACKDEG=0

# THE GAME'S OWN AMBIENT -- the only lighting fix that is correct TODAY.
# Submitted as two wide (150 degree) distant lobes on hashes 0x20/0x21 at gain 1/pi, because
# remixapi_LightInfoDomeEXT carries only a transform and a colour TEXTURE and ignores `radiance`
# entirely -- this backend already reached that conclusion for Demon's Souls and shipped the same
# two-lobe approximation. A two-lobe pair is ISOTROPIC, so unlike the sun and unlike every
# positional light it does not care that world space is view space. That immunity is the whole
# reason this one can land before the camera work.
#
# Why it matters more than it sounds: GRAW2 has NO DYNAMIC LIGHTS AT ALL. Its complete shader-node
# vocabulary (76 eSID_* names) contains no point, spot or directional node -- only eSID_CubeAmbient
# (1695 uses), the diffuse/specular cube maps, and mask channels. The lighting is BAKED, modulated
# by a global eSID_DayTime term. So the ambient is not a nicety; under a path tracer it is the only
# lighting this game ever had that we were not submitting. Measured at 21.7% of the sun, i.e. an
# authored shadow-side floor of 17.9% of full-sun luminance, where path-traced indirect from one
# distant light under an unlit dome gives maybe 2-5%.
#
# If the scene now reads too bright, lower RPCS3_REMIX_AMBIENTSCALE. Do NOT touch SUNRGB -- that
# destroys the sun:ambient ratio, which is the one quantity that actually matters.
RPCS3_REMIX_AMBIENT=1

# THE UI MUST NOT BE Y-FLIPPED -- match_screen_mad2d already lands it upright
# ---------------------------------------------------------------------------
# The camera clip-Y fix and the 2D matcher were designed independently and BOTH corrected the same
# inversion, so with both armed the HUD/video quad flipped twice and came out upside down again.
# Measured, not guessed -- the mad2d census reads:
#   Remix mad2d: vp=ab86464ca0d72796 xscale=2 yscale=2 xbias=-1 ybias=1 uiyflip=1
# The Bink quad spans y in [-1,0] (vtx-spread: decoded=[0 -1 0 1] and [0 0 0 1]), so
# yscale=+2/ybias=+1 maps it to clip y in [-1,+1] with y=0 -- the TOP of the texture -- going to
# clip +1, i.e. the top of the screen. The guest therefore already emits clip +y = up for its 2D
# pass, and the matcher reproduces that faithfully (it stores slots and components and never a
# sign, so the guest's own intent survives). A second flip on top of it is pure damage.
#
# Why the WORLD still needs its flip: the camera's clip-y latch measured vp_scale_y=+360 ->
# clipy=down (cam_clipydown == cam_resolved == 8636, cam_ysign_disagree=0), i.e. the guest DID
# bake the inversion into its 3D projection. The 3D and 2D passes genuinely disagree about the
# sign, which is why these are two separate knobs and not one. Leave CAMYFLIP on auto.
#
# ROUND 71 -- BACK TO AUTO. The paragraph above is right about WHY but wrong about the remedy.
# Setting this to 0 fixed the Bink quad and left the MENU upside down, because this title carries
# BOTH conventions at once and a whole-title sign can only ever serve one of them:
#   * the Bink surface is mapped by build_screen_mad2d from the guest's own scale+bias, so its y
#     sign is already the guest's (a negative runtime value in c[0].w) and must NOT be flipped;
#   * the menu/HUD only started reaching the compositor when repair_split_rows learned the
#     MAD-multiplicand row form, and it arrives with a clip matrix recovered from a DP4 chain,
#     carrying the 3D pass's DOWNWARD convention -- so it MUST be flipped.
# The flip is now decided per draw on matrix provenance, so auto is correct for both.
#
# Note it is deliberately NOT keyed on the compositor's orientation vote: that vote disagreed with
# ITSELF on the single menu program (ndc=11621 upright / 20418 inverted) while the menu was
# uniformly inverted on screen, because symmetric or degenerate-v content defeats the covariance.
# If the menu comes back inverted anyway, use 2 (force every draw) rather than 0.
# ROUND 72 -- FORCED, because AUTO CANNOT WORK FOR THE MENU AND THAT IS A DESIGN ERROR.
# Measured: ui_yflip=0 over a whole run with uiyflip=1 and the latch line present and reading
# clipy=down. The per-draw provenance logic is correct; the GATE in front of it is not. Auto mode
# is `m_clip_y_latched && m_clip_y_down`, which is the CAMERA's clip-y latch -- and the menu
# composites with no resolved camera at all (cam_resolved=0 for the entire run), so that gate is
# never satisfied while the menu is on screen and the flip never fires.
# The proper fix is for the NDC branch to read the UI draw's OWN viewport_scale_y, exactly as the
# PIXEL branch already does via ui_space_from_viewport, instead of borrowing the camera's latch.
# That needs a rebuild; this line does not.
#
# 2 = force the flip on every UI draw, latch or no latch. Expect a side effect: it also flips the
# Bink logos/videos, which do NOT want it (their y sign is already the guest's, in c[0].w). So the
# menu should come up correct and the videos may go inverted -- that TRADE IS THE DIAGNOSTIC. If
# that is what happens, the per-draw split is confirmed right and only the gate was broken.
# Read ui_yflip: it must now be non-zero. If it is STILL 0 at mode 2, the fault is upstream of
# this expression entirely and nothing here is the problem.
#
# CONFIRMED: mode 2 took ui_yflip from 0 to 311 in one run. The logic was right, the gate was
# wrong. So auto now asks THE DRAW'S OWN viewport_scale_y instead of the camera's latch (the
# pixel branch has always done it that way), and mode 1 is correct again -- with the advantage
# that the Bink quad stays EXEMPT, which mode 2 cannot do.
# Back to 1. Use 2 only if the menu is inverted again and you want to confirm it is the gate.
RPCS3_REMIX_UIYFLIP=1

# MEASURE THE BINK VIEWPORT RECT -- diagnostic, changes nothing on screen
# -----------------------------------------------------------------------
# GRAW2 draws its full-screen studio logos AND its small top-right commander window through ONE
# program pair (vp=ab86464ca0d72796 fp=07e8403b6b903b99): 50 `Remix uiwrap:` rows, 36 at
# tex=640x360 and 14 at tex=160x120, all with u=[0..1] v=[0..1] subrect=1/1. So neither the vertex
# attributes nor the c[0] constants carry the difference -- the matcher reads c[0] live per draw and
# reproduces the ucode exactly. By elimination the only positioning register the NDC compositor
# branch DISCARDS is the viewport scale/offset pair: it is read solely in the PIXEL branch, which
# fired zero times this run (ui_pixel=0). The NDC branch maps onto the whole buffer, i.e. it
# asserts the guest's viewport IS the whole surface.
#
# That is a high-confidence hypothesis, NOT a measurement -- and it is deliberately not patched yet,
# because no GRAW2 viewport figure exists anywhere in the logs. The only `Remix ui-consts:` lines on
# disk are 16 Eat Lead rows, all vp_scale=640,-360 vp_offset=640,360 at clip=1280x720, i.e. a
# full-surface viewport (which is exactly why Eat Lead would not move if the fix were applied).
#
# These two lines emit up to 200 `Remix ui-quads[n]:` rows plus a `Remix ui-consts:` line carrying
# the clip rect, the viewport scale/offset and the first 16 constant slots. Read the tex=160x120
# rows: a box covering the full frame confirms the viewport carries the rect and the fix is right;
# a box already in the corner refutes the hypothesis outright and the same lines show where the
# fault really is. One launch, no rebuild, either way.
#
# Side effect: the first dump also writes bin/remix_atlas.bmp once. Note the ui-consts line prints
# only on the FIRST matching draw, which will be a 640x360 splash rather than a commander video --
# so read the per-quad rows for the 160x120 population, not that single line.
# REMOVE BOTH once measured; 200 dump lines per run is noise otherwise.
# *** REMOVED 2026-09-12: THIS CENSUS COULD NEVER HAVE FIRED. ***
# The armed hash ab86464ca0d72796 appears ZERO times in the first 200 MB of remix_dump.log, and
# zero `ui-quads`/`ui-consts` rows were ever emitted. That vertex program does not exist in this
# title, so the BIK letterboxing question it was meant to answer was never actually asked. Do not
# re-add these two lines with the same hash; find the real BIK program from the `Remix uiwrap:`
# or `Remix ui-route:` census first (the in-game HUD, for reference, is vp=7e6d5cd0fbb52e6a).
#
# What IS known about the BIK path, measured: bin/remix_atlas.bmp dumped a 640x360 intro frame and
# it is FLAT GREYSCALE, so the video path samples only the luma plane. Fixing it needs three-plane
# YUV sampling in the compositor - a separate project, not a knob.

# THE MENU'S FRAMERATE IS THE UI SOFTWARE RASTERISER, MEASURED
# ------------------------------------------------------------
# Turning frame generation off DID work -- the frame-time shape changed completely:
#   before:  frame_ms=323.35  flip=259.74 (present=258.59)
#   after:   frame_ms=62.88   flip=16.79  (present=15.80)   ui_raster=37.86  ui_prims=545724
# present collapsed 258 -> 15.8 ms. What is left is 37.86 ms of CPU span rasterisation over
# 545,724 UI primitives per window -- 60% of the frame, and menu-only, which is exactly why the
# menu is far slower than gameplay (in-world, geometry occupies the frame instead of UI quads).
#
# There is an existing fast path that has always been off. 1 = fast, 2 = run BOTH loops and
# cross-check (slower, for correctness only -- use it if 1 produces wrong pixels).
# CAVEAT worth knowing before reading the result: the fast path is gated on !b8_coverage, and with
# B8MULTIPLANE now off every B8 texture is a coverage texture again. If GRAW2's menu is mostly B8,
# this may barely help -- in which case ui_raster stays high and the honest answer is that the
# 2D compositor needs GPU rasterisation, not a knob.
RPCS3_REMIX_UIFASTRASTER=1

# REVERTING MY OWN ARTIFACT REGRESSION
# ------------------------------------
# The menu gained artifacts in the 22:16 build. The one change in it that ADDS geometry is the
# match_wpremul mask-aware chase, which newly accepts 31 programs (45 -> 76). If any of those
# carries a transform the old component-blind chase was accidentally protecting us from, it now
# reaches the scene as garbage. That is the only candidate that can add pixels: the B8 gate only
# REMOVES an effect (verified, ui_b8_multiplane=0) and the flip gate only changes a sign.
#
# 0 restores the component-blind chase byte for byte. This does NOT cost the sky: the dome was
# already exempted by RPCS3_REMIX_SKYEMISSIVE above, measured at wext_exempt_sky=463 on the
# PREVIOUS binary, before this fix existed.
#
# *** ROUND 76: THE ROLLBACK IS WITHDRAWN. THE PRECONDITION ABOVE IS NOW SATISFIED. ***
# The condition written above was "set back to 1 once the per-program tallies name which of the 31
# is the bad one". That list now exists, from an offline replay of the REAL code slice (namespace
# remix_rsx compiled out of RemixTransforms.cpp, not a reimplementation) over all 238 .vp files in
# bin/remix_ucode:
#     WPREMULMASK=0 : 238 scanned, 100 resolved, 32 has_wpremul
#     WPREMULMASK=1 : 238 scanned, 124 resolved, 56 has_wpremul
#     24 gains, 0 LOSSES, and no already-resolving program shifts its decode or group layout.
# The losses column was re-derived independently by set-differencing the two result files and came
# back EMPTY, so this is not merely the replay's own summary line agreeing with itself.
#
# AND THE ROLLBACK IS WHAT WAS EXPLODING EVERY CHARACTER IN THE GAME.
# With MASK=0, 4A9F32E7B9F1C5A8 (a skinned_layered character program, 355 log lines) reads:
