# THE CAMERA ELECTION HAS NO UNIQUE CORRECT ANSWER -- THIS TURNS ON THE CENSUS THAT PROVES IT
# --------------------------------------------------------------------------------------------
# Three different vertex programs won the camera election in one run (b0596b76d83ac01a,
# c816178c904f0fb4, 4bc5d75f7848a6e4). Disassembled, all three are permutations of ONE YETI
# uber-shader: 72 of 76 instructions byte-identical between the two whose ucode survives, and the
# only differences are the branch-target field and a second UV set. Both carry a three-axis
# sinusoidal wind sway (SCA SIN on all three axes, amplitude c[109], gated by vertex-colour alpha)
# applied to the position BEFORE the matrix chain. The user's report that "grass is being picked up
# as a camera" is literally correct: these are foliage programs. Of 1081 stored programs, 55 are in
# this matrix family and exactly 3 carry the SIN block -- so the wind stage is a real feature, not
# family boilerplate, and 15b7a8f03be58c33 is the no-wind control.
#
# But the election is not the root cause, and no heuristic can fix it, because there is nothing to
# elect. YETI premultiplies the view on the CPU: every object gets c[0..2] = WORLD x VIEW and
# c[4..7] = a PURE projection (clip.x = 1.540976*p.x, clip.y = -2.739512*p.z,
# clip.z = 1.0000477*p.y - 0.100005, clip.w = p.y; near 0.1, far 2097.25, fovy 40.107, aspect
# exactly 16/9). The camera's ROTATION is in no candidate the election can see. Every candidate is
# a projection, they all encode the same projection, and the winner is simply whichever family
# member drew first that frame. Corroborated three ways: cam=[0 0 0] on all 19 cam-elect lines,
# cam_viewspace == cam_resolved (12918/12918) with cam_worldspace=0, and 17 of 19 lines reporting
# candidates=1.
#
# The rasterised PICTURE is exact whoever wins, and that is provable rather than lucky. Geometry is
# placed as world = chain x ref^-1 with chain = WORLD x VIEW x P_own and ref = P_elected, and the
# submitted camera (V0,P0) satisfies V0 x P0 = ref, so
#     p x chain x ref^-1 x V0 x P0 = p x chain
# identically. What is wrong is everything that reads the world POSE instead of the picture:
# Remix's world space IS the guest's view space, the eye never leaves the origin, and the pose
# teleports whenever the election changes winner -- which it did on 12857 of 12918 resolved frames
# (cam_relatch). World-space lights cannot work in that space at all; they are pinned to the
# player's head by construction.
#
# WHAT THIS KNOB MEASURES. Diagnostic only, default 0, so no other title is touched. It runs on the
# layered world population (world_layered_ref = 2,211,858 draws) and answers the one question the
# real fix needs: every draw carries WORLD_i x VIEW and never VIEW, so the guest's view V is only
# recoverable as the inner matrix SHARED by draws whose own world transform is the identity --
# static geometry authored in world coordinates. Rigidity alone proves nothing (a rotated crate is
# rigid too); CONSENSUS does.
#
# Read the result like this, in order:
#   1. vs_pown_differ == 0        -> every pass shares one projection, so the election is provably
#                                   harmless to the pose and the per-frame jump is the relatch
#                                   alone. Non-zero instead means passes carry DIFFERENT
#                                   projections and those draws are placed by a non-affine matrix
#                                   (WORLD x VIEW x P_own x P_elected^-1), which no election fix
#                                   can repair.
#   2. vs_inner_rigid ~= vs_draws -> c[0..2] is a rigid transform everywhere, as the ucode says.
#   3. THE DECISIVE STEP, not a counter: grep the 'Remix viewsolve:' lines out of the dump and
#      count distinct innerhash values across distinct vp hashes.
#        ONE hash dominating many programs  = that matrix IS V, recovered exactly, and the fix is
#                                             immediately available (see below).
#        no dominant hash                   = WORLD_i is not the identity for this title's world
#                                             geometry and V must be solved another way.
#      Check |t| on those lines too: for a true view it is the eye-to-world-origin distance and
#      MOVES as the player walks. A shared hash with a pinned |t| is a shared static world matrix
#      masquerading as the view.
#   4. vs_skipped is the census's coverage report. scan_vertex_program calls a program 'fused' when
#      its walker finds one group, and all three camera-electing programs fingerprint fused
#      (arch=fused areason=wpremul) despite carrying two chained groups in their ucode. A large
#      vs_skipped beside a small vs_draws means the next round belongs in the CHAIN WALKER, not in
#      the camera.
#
# THE FIX this census is the entry ticket to, stated so it is not re-derived: with P_own == P,
#     instance' = chain x P^-1 x V^-1 = WORLD_i,   submit view = V, projection = P
# reproduces the same clip position (WORLD_i x V x P = chain) while giving Remix a genuine world
# space. No split is needed for it -- the fused outer group ALREADY IS the projection, and
# try_split_once's constructed near-identity view is precisely the "no view present" tell.
RPCS3_REMIX_VIEWSOLVE=1

# rtx.zUp, PER GAME, WITHOUT EDITING THE SHARED bin\rtx.conf
# -----------------------------------------------------------
# bin\rtx.conf carries `rtx.zUp = True` inherited from Eat Lead and is shared with that live
# project, so it must not be edited for GRAW2. Three routes were checked against the DEPLOYED
# runtime's source (dxvk-remix-aerial, the tree whose public\include\remix\remix_c.h is
# byte-identical to our remix_c.h -- md5 351fe5b7502f37f5504761892590fba3):
#
#   * A dedicated env var: DOES NOT EXIST. zUp is declared with plain RTX_OPTION
#     (rtx_options.h:346), and loadFromEnvironmentVariable bails unless the declaration named one
#     via RTX_OPTION_ENV. 72 options tree-wide are env-settable; zUp is not among them.
#   * DXVK_RTX_CONFIG_FILE: works, but note TWO corrections to how it is usually described. It
#     REPLACES rtx.conf rather than layering on top of it (the default { "rtx.conf" } is returned
#     only when the var is unset), and the FIRST file listed wins, not the last -- every listed
#     file gets priority 3 and they are separated by name ("00_Remix Config", "01_...", bare
#     "Remix Config" for the last), RtxOptionLayerKey::operator< orders equal priorities by
#     ASCENDING name, and resolveValue walks strongest-first and breaks on the first hit, so
#     '0' < 'R' makes "00_" strongest. The in-source comment at rtx_option_layer.cpp:662 says the
#     opposite; it is describing the SAVE TARGET (s_rtxConfLayer = rtxLayers.back()), not
#     resolution order. It also needs a launcher, since RemixGameConfig only forwards
#     RPCS3_REMIX_-prefixed keys into the process environment.
#   * remixapi SetConfigVariable: works, needs neither a launcher nor a file, and is what the knob
#     below now uses. It writes the USER layer (0xFFFFFFFE), which only Quality Presets outranks,
#     and the only other writer of zUp in the tree is the dev-menu checkbox. It is not
#     read-once-at-init: readOption ends in markDirty() and injectRTX calls applyPendingValues()
#     at the end of every frame. Traps to know: an EMPTY value string is treated as "option
#     absent" and writes nothing, an unparseable value silently resolves to FALSE, and a call made
#     before initializeSystemLayers() does nothing -- all three still return SUCCESS. The backend
#     sends "true"/"false" and calls from submit_camera, which is past all three.
#
# THE CORRECT VALUE, and why it is not what the game's world says. The world IS Y-up, as observed.
# But that is YETI's world space, and it is not the space this backend submits: while the view
# stays baked into every instance transform, Remix's world space is the guest's VIEW space, and
# that space is Z-UP. From the projection -- clip.x = 1.540976*p.x, clip.y = -2.739512*p.z,
# clip.w = p.y -- right = +X and forward = +Y; and because the clip-y latch measured
# vp_scale_y = +360 (the guest authored clip y DOWNWARD), screen up is -clip.y = +p.z. So up = +Z,
# X x Y = Z, right-handed, det +1. `True` is correct for what is submitted TODAY.
#
# This must flip to 2 (False) if and when the view is unbaked per RPCS3_REMIX_VIEWSOLVE above,
# because that makes Remix's world space the guest's true Y-up world. Setting it here rather than
# leaving it to rtx.conf is what makes that flip a one-line per-game edit instead of a change to a
# file another project depends on.
#
# Expect on the next launch:
#   Remix: SetConfigVariable(rtx.zUp=true) returned SUCCESS (0) [zupmode=1]
# GENERAL_FAILURE there would mean the key was not found, which for this exact-case key would mean
# the deployed runtime is not the tree that was read -- worth knowing immediately.
RPCS3_REMIX_ZUP=1

# *** THE MISSION-LOAD CRASH. THIS IS THE FIX, AND IT IS MEASURED, NOT SUSPECTED. ***
# Captured from the runtime's own stderr, end to end:
#      2 x Failed to create DLFG feature   (NVSDK_NGX_Result_FAIL_InvalidParameter)
#   1282 x NGX_VK_EVALUATE_DLSSG failed    (same code -- evaluated every frame on a feature that
#                                           was never successfully created)
#        -> DLFG pacer: fence timed out
#        -> DxvkSubmissionQueue: Command submission failed: VK_ERROR_DEVICE_LOST
#        -> DxvkSubmissionQueue: Exiting after GPU device loss          exit code 173
#
# That is the "silent close": a CONTROLLED exit, which is exactly why it never produced a crash
# dump or a Windows Application Error, and why it read as a mystery for several rounds.
# It was also the framerate: present was 258.59 ms of a 323.35 ms frame with only 145 instances
# submitted -- no scene that small can cost that.
#
# WHY A KNOB AND NOT A SETTING: rtx.dlfg.enable lives in bin/user.conf, which is SHARED with every
# other title this backend runs, and turning frame generation off in the Remix dev menu DOES NOT
# SURVIVE A RELAUNCH -- the menu itself reports "User Settings (user.conf): (unsaved changes)" and
# the file still reads True. So a live toggle appears to work and then quietly is not there next
# launch, which is what happened here. This pushes it PER GAME through SetConfigVariable into the
# User option layer -- the same route that already drives rtx.zUp -- so no shared file is touched
# and no other title changes by one bit (default 0).
#
# 1 = force frame generation OFF. 2 = force ON (for a title where it works). 0 = leave alone.
# PROOF TO READ, in this order:
#   1. run-start log carries: SetConfigVariable(rtx.dlfg.enable=false) returned SUCCESS (0)
#   2. NGX_VK_EVALUATE_DLSSG vanishes from the runtime stderr entirely
#   3. the mission loads without exit 173
RPCS3_REMIX_DLFG=1

# THE BLACK RECTANGLES IN THE HUD ARE THE TEXTURE BUDGET, MEASURED.
# Every single row of the `Remix notex:` census in the 2026-09-11 in-mission run reads
# class=budget with had_unit=1 -- i.e. the draw DID have a texture unit bound and a real texture
# (fmt=0x86 at 256x256 / 512x512 / 512x1024); it was simply never created, because
# texture_budget() caps CreateTexture at 8 calls PER FRAME and the config default is 8. An
# over-budget draw is submitted with a null material, which renders as a flat opaque slab -- the
# stable black boxes punched through the HUD text and over the CPU overlay.
#
# Residency in the same run confirms the starvation rather than a decode fault:
#     tex_live=57  tex_created=345  tex_destroyed=288  tex_deferred=1269  reap_freed=288
# 57 live textures with 1,269 deferred, over 17,000 flips. This also accounts for the
# "missing some effects" reading -- those effects are untextured, not absent.
#
# *** SET A LARGE NUMBER, NOT ZERO. ***
# TEXBUDGET=0 is a SILENT NO-OP, not "unlimited": texture_budget() is read_env_u32(name, 0) then
# `env ? env : g_cfg...` then `value ? value : umax`, so an env 0 is indistinguishable from unset
# and falls through to the CONFIG default of 8. Only the config value 0 reaches the umax branch.
# (The bin\BLUS30443.conf comment "zero is unlimited" is wrong for exactly this reason.)
# It is also a `static const`, latched on first call, so this needs a restart -- not live.
#
# WHAT TO READ NEXT RUN, and this is a prediction, not a measurement:
#   notex_mat_applied should collapse from 997 toward 0, and tex_deferred from 1269 toward 0,
#   with tex_live rising well above 57. If notex_mat_applied stays high, the deferred queue is not
#   draining and the budget was not the whole cause -- lower this back and look at the reaper.
# Risk if wrong: a load-time hitch or a VRAM spike from creating many textures in few frames.
# That is strictly better than permanent opaque slabs over the HUD, and it is one line to revert.
RPCS3_REMIX_TEXBUDGET=100000

