# Demon's Souls (BLUS30443) -- per-game Remix profile
# Requires primitive-restart support in this RPCS3 build. Restart RPCS3 after edits.
RPCS3_REMIX_PRIMITIVERESTART=1
# Replay the game's measured menu shaders in the screen compositor.
RPCS3_REMIX_DEMONSMENU=1
# Reconstruct the verified gameplay shader palette transforms.
RPCS3_REMIX_DEMONSWORLD=1
# Terrain and walls exceed the default eight texture uploads per frame.
# CORRECTED 2026-09-06 (round 50): the line below is a NO-OP, not "unlimited". texture_budget()
# reads `read_env_u32(name, 0)` and then `env ? env : g_cfg.video.remix.texture_budget`, so a value
# of 0 from the environment or from this file is indistinguishable from unset and falls through to
# the CONFIG value, which defaults to 8. Only the config value 0 reaches the unlimited branch.
# To raise the budget from here, set a large number instead -- e.g. RPCS3_REMIX_TEXBUDGET=100000.
# Left at 0 rather than changed, because changing it changes this title's behaviour and no A/B has
# been run on it; the value is inert today and this comment now says so.
RPCS3_REMIX_TEXBUDGET=0
# Captured cloud panorama, horizon silhouette, and cloud layer.
RPCS3_REMIX_SKYEMISSIVE=BB8F60EF3064B33B,1716BEA1C9E692F8
RPCS3_REMIX_SKYEMISSIVEINT=1
RPCS3_REMIX_SKYEMISSIVEBLEND=1


# ROUND 57 measurement: capture the MESSAGE vertex program so its texcoord writes can be read.
# store_refused_ucode() skips "healthy" programs (archetype != unknown && inner_is_input), and
# 9fac8d0968bbceb8 is arch=fused, so it is never written. UIDUMPVP is the documented escape hatch.
# What this is FOR: its fragment program builds the colour as ((tex * tc1) * tc2 + tc3) * k / j, and
# the vertex census shows only THREE attributes exist (a0=f3 position, a3=ub4 colour, a8=f2 uv).
# So tc2 and tc3 cannot be per-vertex data - reading the .vp says whether they are constants, which
# decides whether reducing the expression to "the tint is tc1" is a bounded approximation or a lie.
# Remove once the program has been read; it costs one file write per run.
RPCS3_REMIX_UIDUMPVP=9FAC8D0968BBCEB8
